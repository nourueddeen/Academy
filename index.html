ight:800;text-align:center;margin-top:10px}\nfooter{text-align:center;color:var(--mut);padding:0 10px 30px}\n.e{display:block;direction:ltr;text-align:left;color:var(--mut);font-size:.92rem;font-weight:400;line-height:1.5;margin-top:2px}\nh2 .e{color:var(--b1);font-weight:700;font-size:1rem}\nh3 .e{display:inline;font-size:.9rem;margin-inline-start:8px}\n.brand{direction:ltr;display:inline-block;font-size:1.6rem;font-weight:800;letter-spacing:.5px;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.55);border-radius:99px;padding:6px 26px;margin-bottom:14px;text-shadow:0 2px 6px rgba(0,0,0,.25)}\n.ic{font-size:1.35rem;line-height:1;vertical-align:middle;margin-inline-end:6px;font-style:normal}\ntd.ic{font-size:2.2rem;margin:0}\n.pron .ic{display:block;font-size:2.6rem;margin:0 0 4px}\n.avatar{display:block;width:150px;height:150px;border-radius:50%;object-fit:cover;margin:0 auto 14px;border:5px solid #fff;box-shadow:0 8px 24px rgba(0,0,0,.3)}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\n\u003cimg class=\"avatar\" alt=\"Nour El-Din\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAFAAUADASIAAhEBAxEB/8QAHAAAAQQDAQAAAAAAAAAAAAAABAMFBgcBAggA/8QARBAAAQMDAgMGAwUFBgUEAwAAAQIDBAAFERIhBjFBBxMiUWFxFDKBI0KRobEIFSQzUjRicsHR8BZDgqLhFxg1kiay8f/EABkBAAMBAQEAAAAAAAAAAAAAAAECAwAEBf/EACURAAICAgICAgMBAQEAAAAAAAABAhEDMRIhBEETMiJRYUJxBf/aAAwDAQACEQMRAD8Aud7+0n3pZseMe1DOn+JPvRKD4x7UiLGr/ImmpKR36h6U6v7A5ptSB3yvQUGZG7QzLZ8gqpWOQqLM+KY2OW9SpI2FUhoRm6a8awDWTTgE1HY1GZKv4l0/3qkyutReSf4lz/FU8g0RZv5N68v5TWzQy3WHh4DSBG5ABWr3qRWZOGle9R9oc8edSKz/AMlXvRhsEhxrPSsDcV6qCnlDetFVuTSajzoGI3MAVcXvcUSkbDFIu+Kc6c9aISnY1NDAskZJqNXROXUj+9UofGajtwRqloHrSvYy0Tu2DERr/CKN6ULATpjND+6KLq6JmhrRZ2NbmtFcjRYURR9JVdX1etEkeHlSeNU5/wDxUSpGEVEYZ5YGsGn3hofZLNMc4eJNP3DYxGX70YbNIefrWD71kVgirCDXPP259qBcG49 an class=\"e\">Ask how someone is and answer\u003c/span>\u003c/li>\u003cli>تسأل عن اسم شخص وتذكر اسمك 🏷\u003cspan class=\"e\">Ask someone’s name and say yours\u003c/span>\u003c/li>\u003cli>تسأل عن بلد شخص وتتحدث عن بلدك 🌍\u003cspan class=\"e\">Ask where someone is from and talk about your country\u003c/span>\u003c/li>\u003cli>تقدّم نفسك في محادثة قصيرة 🎤\u003cspan class=\"e\">Introduce yourself in a short conversation\u003c/span>\u003c/li>\u003c/ul>\n\u003cdiv class=\"box tip\">\u003cb>⭐ الأهم · Most Important\u003c/b>أن تُجري محادثة بسيطة دون الاعتماد على حفظ نص كامل.\u003cspan class=\"e\">Hold a simple conversation without relying on memorizing a full script.\u003c/span>\u003c/div>\u003c/section>\n\n\u003csection class=\"s2\">\u003ch2>\u003ci>2\u003c/i>\u003cspan>الكلمات والمفردات الأساسية\u003cspan class=\"e\">Basic Words and Vocabulary\u003c/span>\u003c/span>\u003c/h2>\n\u003cdiv class=\"wrap\">\u003ctable>\u003ctr>\u003cth>🖼\u003c/th>\u003cth>العربية\u003c/th>\u003cth>English\u003c/th>\u003cth>النطق التقريبي\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd class=\"ic\">👋\u003c/td>\u003ctd class=\"ar\">مَرْحَبًا\u003c/td>\u003ctd class=\"en\">Hello\u003c/td>\u003ctd class=\"lat\">Marhaban\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"ic\">🤗\u003c/td>\u003ctd class=\"ar\">أَهْلًا\u003c/td>\u003ctd class=\"en\">Hi / Welcome\u003c/td>\u003ctd class=\"lat\">Ahlan\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"ic\">🕊️\u003c/td>\u003ctd class=\"ar\">السَّلَامُ عَلَيْكُمْ\u003c/td>\u003ctd class=\"en\">Peace be upon you\u003c/td>\u003ctd class=\"lat\">As-salamu alaykum\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"ic\">🤝\u003c/td>\u003ctd class=\"ar\">وَعَلَيْكُمُ السَّلَامُ\u003c/td>\u003ctd class=\"en\">And peace be upon you\u003c/td>\u003ctd class=\"lat\">Wa alaykum assalam\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"ic\">🙏\u003c/td>\u003ctd class=\"ar\">شُكْرًا\u003c/td>\u003ctd class=\"en\">Thank you\u003c/td>\u003ctd class=\"lat\">Shukran\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"ic\">✅\u003c/td>\u003ctd class=\"ar\">نَعَمْ\u003c/td>\u003ctd class=\"en\">Yes\u003c/td>\u003ctd class=\"lat\">Na’am\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"ic\">❌\u003c/td>\u003ctd class=\"ar\">لَا\u003c/td>\u003ctd class=\"en\">No\u003c/td>\u003ctd class=\"lat\">La\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"ic\">🤲\u003c/td>\u003ctd class=\"ar\">مِنْ فَضْلِكَ\u003c/td>\u003ctd class=\"en\">Please\u003c/td>\u003ctd class=\"lat\">Min fadlik\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"ic\">🚪\u003c/td>\u003ctd class=\"ar\">مَعَ السَّلَامَةِ\u003c/td>\u003ctd class=\"en\">Goodbye\u003c/td>\u003ctd class=\"lat\">Ma’a as-salama\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cdiv class=\"box note\">\u003cb>💡 نصيحة · Tip\u003c/b>لا تحاول حفظ كل الكلمات دفعة واحدة. استخدمها في الحوار وكرّرها في مواقف مختلفة.\u003cspan class=\"e\">Don’t try to memorize all the words at once. Use them in dialogue and repeat them in different situations.\u003c/span>\u003c/div>\u003c/section>\n\n\u003csection class=\"s3\">\u003ch2>\u003ci>3\u003c/i>\u003cspan>أول محادثة: كيف حالك؟\u003cspan class=\"e\">First Conversation: How are you?\u003c/span>\u003c/span>\u003c/h2>\n\u003cdiv class=\"dlg\">\n\u003cdiv class=\"m a\">\u003cspan class=\"who\">أحمد\u003c/span>\u003cdiv class=\"ar\">\u003cspan class=\"ic\">🕊️\u003c/span>السَّلَامُ عَلَيْكُمْ.\u003c/div>\u003csmall>Peace be upon you.\u003c/small>\u003c/div>\n\u003cdiv class=\"m l\">\u003cspan class=\"who\">علي\u003c/span>\u003cdiv class=\"ar\">\u003cspan class=\"ic\">🤝\u003c/span>وَعَلَيْكُمُ السَّلَامُ.\u003c/div>\u003csmall>And peace be upon you.\u003c/small>\u003c/div>\n\u003cdiv class=\"m a\">\u003cspan class=\"who\">أحمد\u003c/span>\u003cdiv class=\"ar\">\u003cspan class=\"ic\">🙂❓\u003c/span>كَيْفَ حَالُكَ؟\u003c/div>\u003csmall>How are you?\u003c/small>\u003c/div>\n\u003cdiv class=\"m l\">\u003cspan class=\"who\">علي\u003c/span>\u003cdiv class=\"ar\">\u003cspan class=\"ic\">😊\u003c/span>أَنَا بِخَيْرٍ، شُكْرًا.\u003c/div>\u003csmall>I am fine, thank you.\u003c/small>\u003c/div>\n\u003cdiv class=\"m a\">\u003cspan class=\"who\">أحمد\u003c/span>\u003cdiv class=\"ar\">\u003cspan class=\"ic\">🤲\u003c/span>الْحَمْدُ لِلَّهِ.\u003c/div>\u003csmall>Praise be to Allah.\u003c/small>\u003c/div>\u003c/div>\n\u003ch3>🔎 شرح مهم\u003cspan class=\"e\">Important Explanation\u003c/span>\u003c/h3>\n\u003cp>\u003cspan class=\"ar\">كَيْفَ حَالُكَ؟\u003c/span> = \u003cspan class=\"en\">How are you?\u003c/span> نستخدمها للسؤال عن حالة الشخص.\u003c/p>\n\u003cul>\u003cli>\u003cspan class=\"ar\">كَيْفَ حَالُكَ؟\u003c/span> عند مخاطبة \u003cb>رجل\u003c/b> 👨\u003c/li>\u003cli>\u003cspan class=\"ar\">كَيْفَ حَالُكِ؟\u003c/span> عند مخاطبة \u003cb>امرأة\u003c/b> 👩\u003c/li>\u003c/ul>\n\u003cp>\u003cb>الإجابة:\u003c/b>\u003c/p>\n\u003cul>\u003cli>\u003cspan class=\"ar\">أَنَا بِخَيْرٍ\u003c/span> = \u003cspan class=\"en\">I am fine.\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"ar\">أَنَا جَيِّدٌ\u003c/span> = \u003cspan class=\"en\">I am good\u003c/span> (للمذكر)\u003c/li>\u003cli>\u003cspan class=\"ar\">أَنَا جَيِّدَةٌ\u003c/span> = \u003cspan class=\"en\">I am good\u003c/span> (للمؤنث)\u003c/li>\u003c/ul>\n\u003cdiv class=\"box tip\">\u003cb>✅ لا تقلق · Don’t Worry\u003c/b>لا نحتاج الآن إلى شرح الإعراب أو قواعد المبتدأ والخبر. يكفي أن تفهم الاستخدام.\u003cspan class=\"e\">We don’t need to explain grammar rules yet. It is enough to understand how to use the phrase.\u003c/span>\u003c/div>\u003c/section>\n\n\u003csection class=\"s4\">\u003ch2>\u003ci>4\u003c/i>\u003cspan>التعريف بالنفس\u003cspan class=\"e\">Introducing Yourself\u003c/span>\u003c/span>\u003c/h2>\n\u003cp>هذه أهم مهارة في درسنا الأول.\u003c/p>\n\u003cdiv class=\"wrap\">\u003ctable>\u003ctr>\u003cth>السؤال\u003c/th>\u003cth>الإجابة\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd class=\"ar\">\u003cspan class=\"ic\">🏷️\u003c/span>مَا اسْمُكَ؟\u003cbr>\u003cspan class=\"en\" style=\"font-size:.85rem\">What is your name?\u003c/span>\u003c/td>\u003ctd class=\"ar\">\u003cspan class=\"ic\">🪪\u003c/span>اسْمِي أَحْمَدُ.\u003cbr>\u003cspan class=\"en\" style=\"font-size:.85rem\">My name is Ahmed.\u003c/span>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"ar\">\u003cspan class=\"ic\">🌍\u003c/span>مِنْ أَيْنَ أَنْتَ؟\u003cbr>\u003cspan class=\"en\" style=\"font-size:.85rem\">Where are you from?\u003c/span>\u003c/td>\u003ctd class=\"ar\">\u003cspan class=\"ic\">🇪🇬\u003c/span>أَنَا مِنْ مِصْرَ.\u003cbr>\u003cspan class=\"en\" style=\"font-size:.85rem\">I am from Egypt.\u003c/span>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch3>🧱 التراكيب الجديدة\u003cspan class=\"e\">New Structures\u003c/span>\u003c/h3>\n\u003cp>\u003cb>أولًا: اسمي…\u003c/b>\u003c/p>\u003cdiv class=\"chips\">\u003cspan>🏷️ اسمي محمد\u003c/span>\u003cspan>🏷️ اسمي جون\u003c/span>\u003cspan>🏷️ اسمي أحمد\u003c/span>\u003c/div>\n\u003cp>\u003cb>ثانيًا: أنا من…\u003c/b>\u003c/p>\u003cdiv class=\"chips\">\u003cspan>🇪🇬 أنا من مصر\u003c/span>\u003cspan>🇺🇸 أنا من أمريكا\u003c/span>\u003cspan>🇬🇧 أنا من بريطانيا\u003c/span>\u003cspan>🇹🇷 أنا من تركيا\u003c/span>\u003c/div>\n\u003cdiv class=\"box note\">\u003cb>📌 ملاحظة · Note\u003c/b>قل «أنا من مصر» و«أنا من أمريكا». أما الجنسيات (مصري، أمريكي، بريطاني) فلها درس لاحق.\u003cspan class=\"e\">Say “I am from Egypt / America.” Nationalities (Egyptian, American, British) will come in a later lesson.\u003c/span>\u003c/div>\u003c/section>\n\n\u003csection class=\"s5\">\u003ch2>\u003ci>5\u003c/i>\u003cspan>الضمائر الأولى\u003cspan class=\"e\">First Pronouns\u003c/span>\u003c/span>\u003c/h2>\n\u003cdiv class=\"pron\">\u003cdiv>\u003cspan class=\"ic\">🙋\u003c/span>\u003cspan class=\"ar\">أَنَا\u003c/span>I\u003c/div>\u003cdiv>\u003cspan class=\"ic\">👉👨\u003c/span>\u003cspan class=\"ar\">أَنْتَ\u003c/span>You (male)\u003c/div>\u003cdiv>\u003cspan class=\"ic\">👉👩\u003c/span>\u003cspan class=\"ar\">أَنْتِ\u003c/span>You (female)\u003c/div>\u003c/div>\n\u003cp>\u003cb>أمثلة:\u003c/b>\u003c/p>\u003cdiv class=\"chips\">\u003cspan>أنا أحمد\u003c/span>\u003cspan>أنت محمد\u003c/span>\u003cspan>أنتِ سارة\u003c/span>\u003c/div>\n\u003cdiv class=\"box tip\">\u003cb>🙋 نشاط شفهي · Oral Activity\u003c/b>أشِر إلى نفسك وقل «أنا»، ثم أشِر إلى زميلك وقل «أنتَ» أو «أنتِ». كوّن جملًا من عندك.\u003cspan class=\"e\">Point to yourself and say “ana”, then point to your partner and say “anta” or “anti”. Make your own sentences.\u003c/span>\u003c/div>\u003c/section>\n\n\u003csection class=\"s6\">\u003ch2>\u003ci>6\u003c/i>\u003cspan>تطبيق المحادثة: لقاء شخصين لأول مرة\u003cspan class=\"e\">Conversation Practice: Meeting Someone for the First Time\u003c/span>\u003c/span>\u003c/h2>\n\u003cdiv class=\"en\" style=\"margin-bottom:8px\">Meeting someone for the first time\u003c/div>\n\u003cdiv class=\"dlg\">\n\u003cdiv class=\"m a\">\u003cspan class=\"who\">أحمد\u003c/span>\u003cdiv class=\"ar\">\u003cspan class=\"ic\">👋\u003c/span>مَرْحَبًا!\u003c/div>\u003c/div>\n\u003cdiv class=\"m l\">\u003cspan class=\"who\">علي\u003c/span>\u003cdiv class=\"ar\">\u003cspan class=\"ic\">🤗\u003c/span>أَهْلًا!\u003c/div>\u003c/div>\n\u003cdiv class=\"m a\">\u003cspan class=\"who\">أحمد\u003c/span>\u003cdiv class=\"ar\">\u003cspan class=\"ic\">🏷️\u003c/span>مَا اسْمُكَ؟\u003c/div>\u003c/div>\n\u003cdiv class=\"m l\">\u003cspan class=\"who\">علي\u003c/span>\u003cdiv class=\"ar\">اسْمِي عَلِيٌّ. وَمَا اسْمُكَ؟\u003c/div>\u003c/div>\n\u003cdiv class=\"m a\">\u003cspan class=\"who\">أحمد\u003c/span>\u003cdiv class=\"ar\">\u003cspan class=\"ic\">🪪\u003c/span>اسْمِي أَحْمَدُ.\u003c/div>\u003c/div>\n\u003cdiv class=\"m l\">\u003cspan class=\"who\">علي\u003c/span>\u003cdiv class=\"ar\">\u003cspan class=\"ic\">🌍\u003c/span>مِنْ أَيْنَ أَنْتَ؟\u003c/div>\u003c/div>\n\u003cdiv class=\"m a\">\u003cspan class=\"who\">أحمد\u003c/span>\u003cdiv class=\"ar\">\u003cspan class=\"ic\">🇪🇬\u003c/span>أَنَا مِنْ مِصْرَ. وَأَنْتَ؟\u003c/div>\u003c/div>\n\u003cdiv class=\"m l\">\u003cspan class=\"who\">علي\u003c/span>\u003cdiv class=\"ar\">\u003cspan class=\"ic\">🇹🇷\u003c/span>أَنَا مِنْ تُرْكِيَا.\u003c/div>\u003c/div>\n\u003cdiv class=\"m a\">\u003cspan class=\"who\">أحمد\u003c/span>\u003cdiv class=\"ar\">\u003cspan class=\"ic\">🤝\u003c/span>سُرِرْتُ بِلِقَائِكَ.\u003c/div>\u003csmall>Nice to meet you.\u003c/small>\u003c/div>\n\u003cdiv class=\"m l\">\u003cspan class=\"who\">علي\u003c/span>\u003cdiv class=\"ar\">\u003cspan class=\"ic\">😊\u003c/span>وَأَنَا أَيْضًا.\u003c/div>\u003csmall>Me too.\u003c/small>\u003c/div>\u003c/div>\n\u003cdiv class=\"box note\">\u003cb>✨ تعبيرات مفيدة · Useful Expressions\u003c/b>\u003cspan class=\"ar\">سُرِرْتُ بِلِقَائِكَ\u003c/span> = Nice to meet you · \u003cspan class=\"ar\">وَأَنَا أَيْضًا\u003c/span> = Me too\u003cspan class=\"e\">You don’t need to master these in the first class.\u003c/span>\u003c/div>\u003c/section>\n\n\u003csection class=\"s1\" id=\"quiz\">\u003ch2>\u003ci>✍\u003c/i>\u003cspan>تدريبات الفهم والتطبيق\u003cspan class=\"e\">Comprehension and Practice Exercises\u003c/span>\u003c/span>\u003c/h2>\n\u003ch3>التدريب الأول: اختر الإجابة الصحيحة\u003cspan class=\"e\">Exercise 1: Choose the correct answer\u003c/span>\u003c/h3>\n\u003cdiv id=\"mc\">\u003c/div>\n\u003ch3>التدريب الثاني: أكمل الفراغ\u003cspan class=\"e\">Exercise 2: Fill in the blank\u003c/span>\u003c/h3>\n\u003cp>الكلمات المساعدة: \u003cb>بخير – كيف – أحمد – مصر\u003c/b>\u003c/p>\n\u003cdiv id=\"fills\">\u003c/div>\n\u003cbutton class=\"btn\" id=\"chk\">تحقق من الإجابات\u003c/button>\n\u003cdiv class=\"score\" id=\"sc\">\u003c/div>\n\u003ch3>التدريب الثالث: أجب بنفسك 🎙\u003cspan class=\"e\">Exercise 3: Answer for yourself\u003c/span>\u003c/h3>\n\u003cp>أجب شفهيًا \u003cb>دون النظر إلى الدرس\u003c/b>:\u003cspan class=\"e\">Answer out loud without looking at the lesson:\u003c/span>\u003c/p>\n\u003cul class=\"speak\">\u003cli>ما اسمك؟\u003c/li>\u003cli>من أين أنت؟\u003c/li>\u003cli>كيف حالك؟\u003c/li>\u003cli>هل أنت من مصر؟\u003c/li>\u003cli>هل اسمك محمد؟\u003c/li>\u003c/ul>\u003c/section>\n\n\u003csection class=\"s3\">\u003ch2>\u003ci>🗣\u003c/i>\u003cspan>نشاط المحادثة الحرة\u003cspan class=\"e\">Free Conversation Activity\u003c/span>\u003c/span>\u003c/h2>\n\u003cp>تخيّل أنك قابلت شخصًا عربيًا للمرة الأولى. تحدّث \u003cb>دقيقة كاملة\u003c/b> باستخدام ما تعلمته. لا تقلق من الأخطاء؛ أكمل الكلام ثم صحّح مع معلمك.\u003cspan class=\"e\">Imagine you have met an Arab person for the first time. Speak for a full minute using what you have learned. Don’t worry about mistakes; keep talking, then correct them with your teacher.\u003c/span>\u003c/p>\u003c/section>\n\n\u003csection class=\"s5\">\u003ch2>\u003ci>🏠\u003c/i>\u003cspan>الواجب المنزلي\u003cspan class=\"e\">Homework\u003c/span>\u003c/span>\u003c/h2>\n\u003cp>سجّل مقطعًا صوتيًا مدته \u003cb>30–45 ثانية\u003c/b> تتحدث فيه عن نفسك: تحية، اسمك، بلدك، وحالك.\u003cspan class=\"e\">Record a 30–45 second voice message about yourself: a greeting, your name, your country, and how you are.\u003c/span>\u003c/p>\u003c/section>\n\u003c/main>\n\u003cfooter>بالتوفيق! 🌟 تكلّم كثيرًا، وستتقدم سريعًا.\u003c/footer>\n\u003cscript>\nvar MC=[[\"ما معنى «مَرْحَبًا»؟\",[\"Goodbye\",\"Hello\",\"Thank you\"],1],[\"كيف تسأل شخصًا عن اسمه؟\",[\"ما اسمك؟\",\"كيف حالك؟\",\"من أين أنت؟\"],0],[\"ما الإجابة المناسبة عن «من أين أنت؟»؟\",[\"أنا بخير\",\"أنا من مصر\",\"اسمي علي\"],1],[\"ما معنى «شكرًا»؟\",[\"Please\",\"Yes\",\"Thank you\"],2]];\nvar FL=[[\"اسمي\",\" .\",\"أحمد\"],[\"أنا من\",\" .\",\"مصر\"],[\"\",\"حالك؟\",\"كيف\"],[\"أنا\",\"، شكرًا.\",\"بخير\"]];\nvar W=[\"بخير\",\"كيف\",\"أحمد\",\"مصر\"],done=0,mcEl=document.getElementById(\"mc\");\nMC.forEach(function(q,i){var d=document.createElement(\"div\");d.className=\"q\";var p=document.createElement(\"p\");p.textContent=(i+1)+\". \"+q[0];d.appendChild(p);var o=document.createElement(\"div\");o.className=\"opts\";var fb=document.createElement(\"div\");fb.className=\"fb\";\nq[1].forEach(function(t,j){var b=document.createElement(\"button\");b.className=\"opt\";b.textContent=t;if(/^[A-Za-z]/.test(t))b.style.direction=\"ltr\";b.onclick=function(){if(d.dataset.d)return;d.dataset.d=1;b.classList.add(j==q[2]?\"ok\":\"no\");if(j==q[2]){fb.textContent=\"✅ أحسنت!\"}else{fb.textContent=\"❌ حاول مرة أخرى في الدرس: \"+q[1][q[2]];o.children[q[2]].classList.add(\"ok\")}};o.appendChild(b)});\nd.appendChild(o);d.appendChild(fb);mcEl.appendChild(d)});\nvar fe=document.getElementById(\"fills\"),sels=[];\nFL.forEach(function(f){var r=document.createElement(\"div\");r.className=\"fill\";r.appendChild(document.createTextNode(f[0]));var s=document.createElement(\"select\");s.innerHTML=\"\u003coption value=''>اختر…\u003c/option>\"+W.map(function(w){return \"\u003coption>\"+w+\"\u003c/option>\"}).join(\"\");sels.push(s);r.appendChild(s);r.appendChild(document.createTextNode(f[1].replace(\" .\",\".\")));fe.appendChild(r)});\ndocument.getElementById(\"chk\").onclick=function(){var n=0;sels.forEach(function(s,i){var ok=s.value==FL[i][2];if(ok)n++;s.style.borderColor=ok?\"#10b981\":\"#ef4444\"});document.getElementById(\"sc\").textContent=n==4?\"🎉 ممتاز! 4/4\":\"النتيجة: \"+n+\"/4 — راجع الأحمر وحاول مرة أخرى\"};\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"},{"id":"lmwv7pgmm","num":"Lesson 2","en":"The First Arabic Letters","ar":"الحُرُوفُ العَرَبِيَّةُ الأُولَى","html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"ar\" dir=\"rtl\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>الدرس الثاني: الحروف العربية الأولى\u003c/title>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&family=Amiri:wght@400;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{--bg:#f6f8fc;--card:#fff;--ink:#1b2440;--mut:#5b6685;--b1:#2563eb;--g1:#10b981;--o1:#f97316;--p1:#8b5cf6;--r1:#ef4444;--y1:#fef3c7;--bl:#e0ecff;--gr:#d9f7ea;--or:#ffe9d6;--pu:#ece6ff;--line:#e2e8f3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe our El-Din\u003c/div>\n\u003cdiv class=\"ar\" style=\"font-size:1.1rem\">الوحدة الأولى: البداية والتعارف · Unit 1\u003c/div>\n\u003ch1 class=\"ar\" style=\"font-size:2.3rem\">الدرس الثاني: الحُرُوفُ العَرَبِيَّةُ الأُولَى\u003c/h1>\n\u003cdiv class=\"en\">Lesson 02 · A0 · The First Arabic Letters\u003c/div>\n\u003cdiv class=\"tags\">\u003cspan>🔤 الحروف\u003c/span>\u003cspan>👂 الاستماع\u003c/span>\u003cspan>🗣 النطق\u003c/span>\u003cspan>📖 القراءة\u003c/span>\u003cspan>✍ الكتابة\u003c/span>\u003c/div>\n\u003c/header>\n\u003cmain>\n\n\u003csection class=\"s1\">\u003ch2>\u003ci>1\u003c/i>\u003cspan>أهداف الدرس\u003cspan class=\"e\">Lesson Objectives\u003c/span>\u003c/span>\u003c/h2>\n\u003cp>بنهاية الدرس ستستطيع أن:\u003cspan class=\"e\">By the end of this lesson you will be able to:\u003c/span>\u003c/p>\n\u003cul>\n\u003cli>تتعرف على أول أربعة أحرف عربية 🔤\u003cspan class=\"e\">Recognize the first four Arabic letters\u003c/span>\u003c/li>\n\u003cli>تنطق الحروف نطقًا صحيحًا 🗣\u003cspan class=\"e\">Pronounce the letters correctly\u003c/span>\u003c/li>\n\u003cli>تميّز بين الحروف المتشابهة في الشكل 👀\u003cspan class=\"e\">Tell similar-looking letters apart\u003c/span>\u003c/li>\n\u003cli>تقرأ الحروف مع الحركات القصيرة الثلاث 📖\u003cspan class=\"e\">Read letters with the three short vowels\u003c/span>\u003c/li>\n\u003cli>تقرأ مقاطع وكلمات بسيطة 🧩\u003cspan class=\"e\">Read simple syllables and words\u003c/span>\u003c/li>\n\u003cli>تكتب الحروف بصورة مستقلة ✍\u003cspan class=\"e\">Write the letters on your own\u003c/span>\u003c/li>\n\u003cli>تستخدم بعض الكلمات الجديدة في إجابات بسيطة 💬\u003cspan class=\"e\">Use some new words in simple answers\u003c/span>\u003c/li>\u003c/ul>\u003c/section>\n\n\u003csection class=\"s2\">\u003ch2>\u003ci>2\u003c/i>\u003cspan>تمهيد\u003cspan class=\"e\">Introduction\u003c/span>\u003c/span>\u003c/h2>\n\u003cp>اليوم سنتعلم أول أربعة أحرف من الحروف العربية. اللغة العربية تُكتب \u003cb>من اليمين إلى اليسار\u003c/b> ➡️⬅️\u003c/p>\n\u003cspan class=\"e\" style=\"margin-bottom:8px\">Today we will learn the first four letters of the Arabic alphabet. Arabic is written from right to left.\u003c/span>\n\u003cdiv class=\"box note\">\u003cb>📌 معلومة · Fact\u003c/b>العربية فيها 28 حرفًا أساسيًا، وشكل بعض الحروف يتغير بحسب موقعه في الكلمة.\u003cspan class=\"e\">Arabic has 28 basic letters, and the shape of some letters changes depending on its position in the word.\u003c/span>\u003c/div>\u003c/section>\n\n\u003csection class=\"s3\">\u003ch2>\u003ci>3\u003c/i>\u003cspan>الحروف الأربعة الأولى\u003cspan class=\"e\">The First Four Letters\u003c/span>\u003c/span>\u003c/h2>\n\n\u003cdiv class=\"lc c1\">\u003cdiv class=\"big\">ا\u003c/div>\u003cdiv>\u003cb class=\"ar\">الحرف الأول: أَلِف\u003c/b> \u003cspan class=\"lat\">Alif\u003c/span>\u003cbr>\u003cb>النطق:\u003c/b> الألف حرف طويل يُستخدم في المد، مثل الصوت الطويل في كلمة «باب». أما الهمزة في أول كلمات مثل «أَبٌ» فلها صوت مستقل.\u003cspan class=\"e\">A long vowel letter used for stretching the sound, like the long sound in “baab”.\u003c/span>\n\u003cspan class=\"ar\">أَبٌ\u003c/span> Father · \u003cspan class=\"ar\">أَخٌ\u003c/span> Brother\u003cdiv class=\"box note\" style=\"margin:8px 0 0\">\u003cb>⚠️ ملاحظة · Note\u003c/b>الألف (ا) ليست الهمزة (ء)، وسنوضح الفرق لاحقًا.\u003cspan class=\"e\">Alif (ا) is not hamza (ء); we will explain the difference later.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"lc c2\">\u003cdiv class=\"big\">ب\u003c/div>\u003cdiv>\u003cb class=\"ar\">الحرف الثاني: بَاء\u003c/b> \u003cspan class=\"lat\">Baa\u003c/span>\u003cbr>\u003cb>النطق:\u003c/b> نضم الشفتين ثم نُخرج الصوت: بْ. يشبه حرف B.\u003cspan class=\"e\">Close the lips, then release the sound. Like English B.\u003c/span>\n\u003cspan class=\"ar\">بَابٌ\u003c/span> Door · \u003cspan class=\"ar\">بَيْتٌ\u003c/span> House\u003c/div>\u003c/div>\n\n\u003cdiv class=\"lc c3\">\u003cdiv class=\"big\">ت\u003c/div>\u003cdiv>\u003cb class=\"ar\">الحرف الثالث: تَاء\u003c/b> \u003cspan class=\"lat\">Taa\u003c/span>\u003cbr>\u003cb>النطق:\u003c/b> يخرج الصوت من طرف اللسان عند الأسنان العليا، قريب من حرف T.\u003cspan class=\"e\">Made with the tip of the tongue at the upper teeth. Close to English T.\u003c/span>\n\u003cspan class=\"ar\">تِينٌ\u003c/span> Figs · \u003cspan class=\"ar\">تُوتٌ\u003c/span> Mulberries\u003c/div>\u003c/div>\n\n\u003cdiv class=\"lc c4\">\u003cdiv class=\"big\">ث\u003c/div>\u003cdiv>\u003cb class=\"ar\">الحرف الرابع: ثَاء\u003c/b> \u003cspan class=\"lat\">Thaa\u003c/span>\u003cbr>\u003cb>النطق:\u003c/b> نضع طرف اللسان بين الأسنان الأمامية قليلًا ثم نخرج الهواء. يشبه TH في \u003ci>Three\u003c/i>، وليس TH في \u003ci>This\u003c/i>.\u003cspan class=\"e\">Tongue tip slightly between the front teeth, then release air. Like TH in “three”, not “this”.\u003c/span>\n\u003cspan class=\"ar\">ثَوْبٌ\u003c/span> Garment / Clothing\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection class=\"s4\">\u003ch2>\u003ci>4\u003c/i>\u003cspan>الفرق بين الحروف\u003cspan class=\"e\">Letter Recognition\u003c/span>\u003c/span>\u003c/h2>\n\u003cp>الحروف ب ت ث تتشابه في الشكل، فانتبه للنقاط!\u003cspan class=\"e\">B, T and Th look alike. Watch the dots!\u003c/span>\u003c/p>\n\u003cdiv class=\"dots\">\n\u003cdiv class=\"c2 lc\" style=\"display:block;text-align:center\">\u003cdiv class=\"big\">ب\u003c/div>\u003cb>نقطة واحدة أسفل\u003c/b>\u003cspan class=\"e\" style=\"text-align:center\">One dot below\u003c/span>\u003c/div>\n\u003cdiv class=\"c3 lc\" style=\"display:block;text-align:center\">\u003cdiv class=\"big\">ت\u003c/div>\u003cb>نقطتان أعلى\u003c/b>\u003cspan class=\"e\" style=\"text-align:center\">Two dots above\u003c/span>\u003c/div>\n\u003cdiv class=\"c4 lc\" style=\"display:block;text-align:center\">\u003cdiv class=\"big\">ث\u003c/div>\u003cb>ثلاث نقاط أعلى\u003c/b>\u003cspan class=\"e\" style=\"text-align:center\">Three dots above\u003c/span>\u003c/div>\u003c/div>\n\u003cdiv class=\"box tip\">\u003cb>✅ قاعدة سهلة · Easy Rule\u003c/b>الشكل الأساسي متشابه، والاختلاف في عدد النقاط وموقعها.\u003cspan class=\"e\">The basic shape is the same; the difference is the number and position of the dots.\u003c/span>\u003c/div>\n\u003cdiv class=\"box note\">\u003cb>🙋 نشاط · Activity\u003c/b>أشر إلى كل حرف عندما تنطقه، ثم غيّر ترتيب الحروف واختبر نفسك.\u003cspan class=\"e\">Point to each letter as you say it, then shuffle the order and test yourself.\u003c/span>\u003c/div>\u003c/section>\n\n\u003csection class=\"s5\">\u003ch2>\u003ci>5\u003c/i>\u003cspan>الحركات القصيرة\u003cspan class=\"e\">Short Vowels\u003c/span>\u003c/span>\u003c/h2>\n\u003cp>هناك ثلاث حركات قصيرة:\u003cspan class=\"e\">There are three short vowels:\u003c/span>\u003c/p>\n\u003cdiv class=\"dots\">\n\u003cdiv class=\"c1 lc\" style=\"display:block;text-align:center\">\u003cdiv class=\"big\">بَ\u003c/div>\u003cb class=\"ar\">الفَتْحَة\u003c/b> \u003cspan class=\"lat\">Fatha\u003c/span>\u003cspan class=\"e\" style=\"text-align:center\">short sound like “a”\u003c/span>\u003c/div>\n\u003cdiv class=\"c3 lc\" style=\"display:block;text-align:center\">\u003cdiv class=\"big\">بِ\u003c/div>\u003cb class=\"ar\">الكَسْرَة\u003c/b> \u003cspan class=\"lat\">Kasra\u003c/span>\u003cspan class=\"e\" style=\"text-align:center\">short sound like “i”\u003c/span>\u003c/div>\n\u003cdiv class=\"c4 lc\" style=\"display:block;text-align:center\">\u003cdiv class=\"big\">بُ\u003c/div>\u003cb class=\"ar\">الضَّمَّة\u003c/b> \u003cspan class=\"lat\">Damma\u003c/span>\u003cspan class=\"e\" style=\"text-align:center\">short sound like “u”\u003c/span>\u003c/div>\u003c/div>\n\u003ch3>🗣 تدريب النطق\u003cspan class=\"e\">Pronunciation Practice\u003c/span>\u003c/h3>\n\u003cdiv class=\"wrap\">\u003ctable>\u003ctr>\u003cth>الحرف\u003c/th>\u003cth>الفتحة\u003c/th>\u003cth>الكسرة\u003c/th>\u003cth>الضمة\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd class=\"ar\">ب\u003c/td>\u003ctd class=\"ar\">بَ\u003c/td>\u003ctd class=\"ar\">بِ\u003c/td>\u003ctd class=\"ar\">بُ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"ar\">ت\u003c/td>\u003ctd class=\"ar\">تَ\u003c/td>\u003ctd class=\"ar\">تِ\u003c/td>\u003ctd class=\"ar\">تُ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"ar\">ث\u003c/td>\u003ctd class=\"ar\">ثَ\u003c/td>\u003ctd class=\"ar\">ثِ\u003c/td>\u003ctd class=\"ar\">ثُ\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>❓ ما الفرق بين بَ وبِ وبُ؟\u003c/p>\n\u003cdetails>\u003csummary>👀 الإجابة · Answer\u003c/summary>حركة الفم والصوت القصير المصاحب للحرف.\u003cspan class=\"e\">The mouth movement and the short sound that goes with the letter.\u003c/span>\u003c/details>\u003c/section>\n\n\u003csection class=\"s6\">\u003ch2>\u003ci>6\u003c/i>\u003cspan>أشكال الحروف في الكلمة\u003cspan class=\"e\">Letter Forms\u003c/span>\u003c/span>\u003c/h2>\n\u003cp>الحرف العربي قد يتغير شكله بحسب موقعه في الكلمة. نبدأ بالباء والتاء والثاء لأنها تتصل بالطريقة نفسها.\u003cspan class=\"e\">An Arabic letter can change shape depending on its position in the word.\u003c/span>\u003c/p>\n\u003cdiv class=\"wrap\">\u003ctable>\u003ctr>\u003cth>الموقع · Position\u003c/th>\u003cth>باء\u003c/th>\u003cth>تاء\u003c/th>\u003cth>ثاء\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>منفصل · Alone\u003c/td>\u003ctd class=\"ar\">ب\u003c/td>\u003ctd class=\"ar\">ت\u003c/td>\u003ctd class=\"ar\">ث\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>أول الكلمة · Start\u003c/td>\u003ctd class=\"ar\">بـ\u003c/td>\u003ctd class=\"ar\">تـ\u003c/td>\u003ctd class=\"ar\">ثـ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>وسط الكلمة · Middle\u003c/td>\u003ctd class=\"ar\">ـبـ\u003c/td>\u003ctd class=\"ar\">ـتـ\u003c/td>\u003ctd class=\"ar\">ـثـ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>آخر الكلمة · End\u003c/td>\u003ctd class=\"ar\">ـب\u003c/td>\u003ctd class=\"ar\">ـت\u003c/td>\u003ctd class=\"ar\">ـث\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>\u003cb>أما الألف:\u003c/b>\u003c/p>\n\u003cdiv class=\"wrap\">\u003ctable>\u003ctr>\u003cth>الموقع · Position\u003c/th>\u003cth>الشكل · Form\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>منفصل · Alone\u003c/td>\u003ctd class=\"ar\">ا\u003c/td>\u003c/tr>\u003ctr>\u003ctd>أول الكلمة · Start\u003c/td>\u003ctd class=\"ar\">ا\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>وسط الكلمة · Middle\u003c/td>\u003ctd class=\"ar\">ـا\u003c/td>\u003c/tr>\u003ctr>\u003ctd>آخر الكلمة · End\u003c/td>\u003ctd class=\"ar\">ـا\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cdiv class=\"box note\">\u003cb>⚠️ مهم · Important\u003c/b>الألف لا يتصل بالحرف الذي بعده (جهة اليسار)، ولذلك ينقطع الاتصال بعده.\u003cspan class=\"e\">Alif does not connect to the letter after it, so the connection breaks.\u003c/span>\u003c/div>\n\u003cdiv class=\"box tip\">\u003cb>🙋 نشاط · Activity\u003c/b>لاحظ حرف الباء في: \u003cspan class=\"ar\">بَابٌ · كِتَابٌ · حَلِيبٌ\u003c/span>\u003cbr>هل شكل الباء واحد في الكلمات الثلاث؟\u003cspan class=\"e\">Is the shape of baa the same in all three words?\u003c/span>\n\u003cdetails>\u003csummary>👀 الإجابة · Answer\u003c/summary>لا، يختلف شكله حسب موقعه واتصاله بالحروف الأخرى.\u003cspan class=\"e\">No, it changes with its position and connection.\u003c/span>\u003c/details>\u003c/div>\u003c/section>\n\n\u003csection class=\"s1\">\u003ch2>\u003ci>7\u003c/i>\u003cspan>أول كلمة نقرؤها\u003cspan class=\"e\">Our First Word\u003c/span>\u003c/span>\u003c/h2>\n\u003cdiv class=\"lc c2\" style=\"justify-content:center;text-align:center\">\u003cdiv>\u003cdiv class=\"big\" style=\"font-size:4rem\">بَابٌ\u003c/div>\u003cspan class=\"lat\">Bābun\u003c/span> · Door 🚪\u003c/div>\u003c/div>\n\u003cul>\u003cli>\u003cspan class=\"ar\">بَ\u003c/span> = Ba\u003c/li>\u003cli>\u003cspan class=\"ar\">ا\u003c/span> = Alif (long vowel · حرف مد)\u003c/li>\u003cli>\u003cspan class=\"ar\">بٌ\u003c/span> = Bun\u003c/li>\u003c/ul>\n\u003cp>الألف هنا يمد صوت الفتحة، ولذلك نقول «بَا» بصوت \u003cb>طويل\u003c/b>.\u003cspan class=\"e\">Alif stretches the fatha sound, so we say “baa” long.\u003c/span>\u003c/p>\n\u003cp>قارن: \u003cspan class=\"ar\">بَ\u003c/span> = صوت قصير (short) · \u003cspan class=\"ar\">بَا\u003c/span> = صوت طويل (long)\u003c/p>\n\u003cdiv class=\"box tip\">\u003cb>⭐ أول خطوة\u003c/b>هذه أول خطوة لفهم الفرق بين الحركات القصيرة وحروف المد.\u003cspan class=\"e\">The first step to understanding short vowels vs. long vowel letters.\u003c/span>\u003c/div>\u003c/section>\n\n\u003csection class=\"s2\" id=\"quiz\">\u003ch2>\u003ci>8\u003c/i>\u003cspan>تدريبات القراءة والكتابة\u003cspan class=\"e\">Reading and Writing Exercises\u003c/span>\u003c/span>\u003c/h2>\n\u003ch3>التدريب الأول: اقرأ الحروف بصوت مرتفع\u003cspan class=\"e\">Exercise 1: Read aloud\u003c/span>\u003c/h3>\n\u003cdiv class=\"chips ar\" style=\"font-size:1.6rem\">\u003cspan>ا\u003c/span>\u003cspan>ب\u003c/span>\u003cspan>ت\u003c/span>\u003cspan>ث\u003c/span>\u003c/div>\u003cbr>\n\u003cdiv class=\"chips ar\" style=\"font-size:1.6rem\">\u003cspan>بَ\u003c/span>\u003cspan>بِ\u003c/span>\u003cspan>بُ\u003c/span>\u003c/div>\u003cbr>\n\u003cdiv class=\"chips ar\" style=\"font-size:1.6rem\">\u003cspan>تَ\u003c/span>\u003cspan>تِ\u003c/span>\u003cspan>تُ\u003c/span>\u003c/div>\u003cbr>\n\u003cdiv class=\"chips ar\" style=\"font-size:1.6rem\">\u003cspan>ثَ\u003c/span>\u003cspan>ثِ\u003c/span>\u003cspan>ثُ\u003c/span>\u003c/div>\n\u003ch3>التدريب الثاني: ميّز الحرف\u003cspan class=\"e\">Exercise 2: Identify the letter\u003c/span>\u003c/h3>\n\u003cp>ما الحرف الذي له...؟ فكّر ثم افتح الإجابة:\u003c/p>\n\u003cul>\u003cli>نقطة واحدة أسفل الحرف \u003cdetails>\u003csummary>👀\u003c/summary>ب · Baa\u003c/details>\u003c/li>\u003cli>نقطتان أعلى الحرف \u003cdetails>\u003csummary>👀\u003c/summary>ت · Taa\u003c/details>\u003c/li>\u003cli>ثلاث نقاط أعلى الحرف \u003cdetails>\u003csummary>👀\u003c/summary>ث · Thaa\u003c/details>\u003c/li>\u003c/ul>\n\u003ch3>التدريب الثالث: الكتابة\u003cspan class=\"e\">Exercise 3: Writing\u003c/span>\u003c/h3>\n\u003cul>\u003cli>اكتب الألف 5 مرات ✍ \u003cspan class=\"e\">Write alif 5 times\u003c/span>\u003c/li>\u003cli>اكتب الباء 5 مرات ✍\u003c/li>\u003cli>اكتب التاء 5 مرات ✍\u003c/li>\u003cli>اكتب الثاء 5 مرات ✍\u003c/li>\u003cli>ثم اكتب كلمة «بَابٌ» 3 مرات\u003c/li>\u003c/ul>\n\u003ch3>التدريب الرابع: انظر واختر\u003cspan class=\"e\">Exercise 4: Look and choose\u003c/span>\u003c/h3>\n\u003cdiv id=\"mc\">\u003c/div>\u003cdiv class=\"score\" id=\"sc\">\u003c/div>\u003c/section>\n\n\u003csection class=\"s3\">\u003ch2>\u003ci>9\u003c/i>\u003cspan>نشاط المحادثة والاستماع\u003cspan class=\"e\">Speaking and Listening\u003c/span>\u003c/span>\u003c/h2>\n\u003cp>نعود إلى محادثة الدرس الأول! أجب \u003cb>دون النظر إلى الكتاب\u003c/b>:\u003cspan class=\"e\">Back to Lesson 1! Answer without looking at the book:\u003c/span>\u003c/p>\n\u003cul class=\"speak\">\u003cli>مَا اسْمُكَ؟\u003c/li>\u003cli>مِنْ أَيْنَ أَنْتَ؟\u003c/li>\u003cli>كَيْفَ حَالُكَ؟\u003c/li>\u003c/ul>\n\u003cdiv class=\"box tip\">\u003cb>🎧 نشاط جديد · New Activity\u003c/b>المعلم ينطق حرفًا، وأنت تحدد الحرف الذي سمعته.\u003cspan class=\"e\">Your teacher says a letter and you name the letter you heard.\u003c/span>\u003c/div>\n\u003cdiv class=\"dlg\">\u003cdiv class=\"m a\">\u003cspan class=\"who\">المعلم\u003c/span>\u003cdiv class=\"ar\">بَ\u003c/div>\u003c/div>\u003cdiv class=\"m l\">\u003cspan class=\"who\">الطالب\u003c/span>\u003cdiv class=\"ar\">بَاء\u003c/div>\u003c/div>\u003c/div>\n\u003cp>سنكرر النشاط بترتيب عشوائي وبسرعة تزداد تدريجيًا ⚡\u003cspan class=\"e\">We repeat in random order, speeding up gradually.\u003c/span>\u003c/p>\u003c/section>\n\n\u003csection class=\"s5\">\u003ch2>\u003ci>10\u003c/i>\u003cspan>الأخطاء الشائعة\u003cspan class=\"e\">Common Mistakes\u003c/span>\u003c/span>\u003c/h2>\n\u003cdiv class=\"wrap\">\u003ctable>\u003ctr>\u003cth>الخطأ · Mistake\u003c/th>\u003cth>التصحيح · Fix\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>الخلط بين ب وت وث\u003c/td>\u003ctd>ركّز على عدد النقاط\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>نطق ث مثل S\u003c/td>\u003ctd>درّب اللسان على صوت TH\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>إهمال الحركات\u003c/td>\u003ctd>انطق كل حركة بوضوح\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>نطق بَ وبَا بالطول نفسه\u003c/td>\u003ctd>ميّز بين الصوت القصير والمد\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>الكتابة من اليسار إلى اليمين\u003c/td>\u003ctd>اكتب من اليمين إلى اليسار ➡️⬅️\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003c/section>\n\n\u003csection class=\"s6\">\u003ch2>\u003ci>🏠\u003c/i>\u003cspan>الواجب المنزلي\u003cspan class=\"e\">Homework\u003c/span>\u003c/span>\u003c/h2>\n\u003cul>\u003cli>احفظ أسماء الحروف الأربعة ونطقها\u003cspan class=\"e\">Memorize the names and sounds of the four letters\u003c/span>\u003c/li>\n\u003cli>اقرأ الحروف مع الفتحة والكسرة والضمة\u003cspan class=\"e\">Read the letters with fatha, kasra and damma\u003c/span>\u003c/li>\n\u003cli>اكتب كل حرف 10 مرات\u003cspan class=\"e\">Write each letter 10 times\u003c/span>\u003c/li>\n\u003cli>اكتب كلمة «بَابٌ» 5 مرات\u003cspan class=\"e\">Write the word “baab” 5 times\u003c/span>\u003c/li>\n\u003cli>سجّل مقطعًا صوتيًا تقرأ فيه الحروف والمقاطع 🎙\u003cspan class=\"e\">Record a voice message reading the letters and syllables\u003c/span>\u003c/li>\u003c/ul>\u003c/section>\n\n\u003csection class=\"s4\">\u003ch2>\u003ci>✔\u003c/i>\u003cspan>معيار إتقان الدرس\u003cspan class=\"e\">Lesson Completion Checklist\u003c/span>\u003c/span>\u003c/h2>\n\u003cp>أنت أتقنت الدرس عندما تستطيع كل ما يلي (اضغط للتحديد):\u003cspan class=\"e\">You have mastered the lesson when you can do all of these (tap to tick):\u003c/span>\u003c/p>\n\u003cdiv class=\"chk\">\u003c/div>\u003c/section>\n\u003c/main>\n\u003cfooter>بالتوفيق! 🌟 كل حرف تتعلمه يقرّبك من القراءة بالعربية.\u003c/footer>\n\u003cscript>\nvar MC=[[\"أي حرف له نقطة واحدة أسفل الحرف؟\",[\"ت\",\"ب\",\"ث\"],1],[\"أي حرف له ثلاث نقاط؟\",[\"ب\",\"ث\",\"ت\"],1],[\"ما الحركة الموجودة في بَ؟\",[\"الكسرة\",\"الضمة\",\"الفتحة\"],2],[\"ما الحرف الذي يمد الصوت في كلمة بَاب؟\",[\"الألف\",\"التاء\",\"الثاء\"],0]],n=0,right=0,mcEl=document.getElementById(\"mc\");\nMC.forEach(function(q,i){var d=document.createElement(\"div\");d.classN TYPE html>\n\u003chtml lang=\"ar\" dir=\"rtl\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>الدرس الثالث: المجموعة الثانية من الحروف\u003c/title>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&family=Amiri:wght@400;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{--bg:#f6f8fc;--card:#fff;--ink:#1b2440;--mut:#5b6685;--b1:#2563eb;--g1:#10b981;--o1:#f97316;--p1:#8b5cf6;--r1:#ef4444;--y1:#fef3c7;--bl:#e0ecff;--gr:#d9f7ea;--or:#ffe9d6;--pu:#ece6ff;--line:#e2e8f3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0e1424;--card:#172038;--ink:#eef2ff;--mut:#a9b4d6;--y1:#3b3210;--bl:#172a52;--gr:#0f3a2c;--or:#432a14;--pu:#2d2352;--line:#2a3558;color-scheme:dark}}\n:root[data-theme=\"dark\"]{--bg:#0e1424;--card:#172038;--ink:#eef2ff;--mut:#a9b4d6;--y1:#3b3210;--bl:#172a52;--gr:#0f3a2c;--or:#432a14;--pu:#2d2352;--line:#2a3558;color-scheme:dark}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;line-height:1.8;font-size:17px}\n.ar{font-family:Amiri,'Traditional Arabic',serif;font-size:1.25em}\nheader{background:linear-gradient(135deg,#2563eb,#8b5cf6 55%,#f97316);color:#fff;text-align:center;padding:36px 16px 44px}\nheader h1{margin:6px 0;font-size:2rem;font-weight:800}\nheader .en{direction:ltr;opacity:.95}\n.tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}\n.tags span{background:rgba(255,255,255,.22);border-radius:99px;padding:3px 14px;font-size:.9rem}\nmain{max-width:820px;margin:-22px auto 40px;padding:0 14px}\nsection{background:var(--card);border-radius:20px;padding:20px;margin-bottom:18px;border:1px solid var(--line);box-shadow:0 4px 14px rgba(30,40,90,.07)}\nh2{margin:0 0 12px;fo /h2>\n\u003cp>بنهاية الدرس ستستطيع أن:\u003cspan class=\"e\">By the end of this lesson you will be able to:\u003c/span>\u003c/p>\n\u003cul>\n\u003cli>تتعرف على الحروف الخمسة الجديدة 🔤\u003cspan class=\"e\">Recognize the five new letters\u003c/span>\u003c/li>\n\u003cli>تميّز بين ج وح وخ 👀\u003cspan class=\"e\">Tell ج ح خ apart\u003c/span>\u003c/li>\n\u003cli>تميّز بين د وذ 👀\u003cspan class=\"e\">Tell د and ذ apart\u003c/span>\u003c/li>\n\u003cli>تنطق الحروف من مخارجها الصحيحة 🗣\u003cspan class=\"e\">Pronounce the letters from their correct articulation points\u003c/span>\u003c/li>\n\u003cli>تقرأ الحروف مع الفتحة والكسرة والضمة 📖\u003cspan class=\"e\">Read the letters with fatha, kasra and damma\u003c/span>\u003c/li>\n\u003cli>تتعرف على أشكال الحروف في الكلمات 🧩\u003cspan class=\"e\">Recognize letter forms inside words\u003c/span>\u003c/li>\n\u003cli>تقرأ كلمات بسيطة من حروف الدروس السابقة والجديدة 🌟\u003cspan class=\"e\">Read simple words made of old and new letters\u003c/span>\u003c/li>\u003c/ul>\u003c/section>\n\n\u003csection class=\"s2\">\u003ch2>\u003ci>2\u003c/i>\u003cspan>مراجعة سريعة\u003cspan class=\"e\">Quick Review\u003c/span>\u003c/span>\u003c/h2>\n\u003cdiv class=\"chips ar\" style=\"font-size:1.8rem\">\u003cspan>ا\u003c/span>\u003cspan>ب\u003c/span>\u003cspan>ت\u003c/span>\u003cspan>ث\u003c/span>\u003c/div>\n\u003cp>أجب شفهيًا ثم افتح الإجابة:\u003cspan class=\"e\">Answer out loud, then open the answer:\u003c/span>\u003c/p>\n\u003cul>\n\u003cli>ما اسم هذا الحرف: \u003cspan class=\"ar\">ب\u003c/span>؟ \u003cdetails>\u003csummary>👀\u003c/summary>بَاء · Baa\u003c/details>\u003c/li>\n\u003cli>كم نقطة في حرف \u003cspan class=\"ar\">ث\u003c/span>؟ \u003cdetails>\u003csummary>👀\u003c/summary>ثلاث نقاط أعلى · Three dots above\u003c/details>\u003c/li>\n\u003cli>أين تقع نقطة حرف \u003cspan class=\"ar\">ب\u003c/span>؟ \u003cdetails>\u003csummary>👀\u003c/summary>أسفل الحرف · Below\u003c/details>\u003c/li>\n\u003cli>اقرأ: \u003cspan class=\"ar\">بَ – بِ – بُ\u003c/span>\u003c/li>\n\u003cli>اقرأ كلمة: \u003cspan class=\"ar\">بَاب\u003c/span> 🚪\u003c/li>\u003c/ul>\u003c/section>\n\n\u003csection class=\"s3\">\u003ch2>\u003ci>3\u003c/i>\u003cspan>الحروف الجديدة\u003cspan class=\"e\">New Letters\u003c/span>\u003c/span>\u003c/h2>\n\n\u003cdiv class=\"lc c1\">\u003cdiv class=\"big\">ج\u003c/div>\u003cdiv>\u003cb class=\"ar\">الحرف الأول: جِيم\u003c/b> \u003cspan class=\"lat\">Jeem\u003c/span>\u003cbr>\u003cb>النطق:\u003c/b> مثل J في \u003ci>Job\u003c/i> تقريبًا. يخرج الصوت من وسط اللسان مع ما يقابله من الحنك الأعلى.\u003cspan class=\"e\">Like J in “Job”. Made with the middle of the tongue against the roof of the mouth.\u003c/span>\n\u003cdiv>\u003cspan class=\"wd\">\u003ci>🐪\u003c/i>\u003cb class=\"ar\">جَمَلٌ\u003c/b> Camel\u003c/span>\u003cspan class=\"wd\">\u003ci>⛰️\u003c/i>\u003cb class=\"ar\">جَبَلٌ\u003c/b> Mountain\u003c/span>\u003cspan class=\"wd\">\u003ci>👴\u003c/i>\u003cb class=\"ar\">جَدٌّ\u003c/b> Grandfather\u003c/span>\u003c/div>\n\u003cdiv class=\"box note\" style=\"margin:8px 0 0\">\u003cb>👀 انتبه\u003c/b>الجيم لها \u003cb>نقطة واحدة أسفل\u003c/b> الحرف.\u003cspan class=\"e\">Jeem has one dot below.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"lc c2\">\u003cdiv class=\"big\">ح\u003c/div>\u003cdiv>\u003cb class=\"ar\">الحرف الثاني: حَاء\u003c/b> \u003cspan class=\"lat\">Haa\u003c/span>\u003cbr>\u003cb>النطق:\u003c/b> حرف حلقي يخرج من وسط الحلق. ليس مثل H الإنجليزية؛ هو أعمق وأكثر احتكاكًا.\u003cspan class=\"e\">A throat letter from the middle of the throat. Deeper and breathier than English H.\u003c/span>\n\u003cdiv>\u003cspan class=\"wd\">\u003ci>🥛\u003c/i>\u003cb class=\"ar\">حَلِيبٌ\u003c/b> Milk\u003c/span>\u003cspan class=\"wd\">\u003ci>🐴\u003c/i>\u003cb class=\"ar\">حِصَانٌ\u003c/b> Horse\u003c/span>\u003cspan class=\"wd\">\u003ci>🐋\u003c/i>\u003cb class=\"ar\">حُوتٌ\u003c/b> Whale\u003c/span>\u003c/div>\n\u003cdiv class=\"box note\" style=\"margin:8px 0 0\">\u003cb>👀 انتبه\u003c/b>الحاء \u003cb>بلا نقاط\u003c/b>.\u003cspan class=\"e\">Haa has no dots.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"lc c3\">\u003cdiv class=\"big\">خ\u003c/div>\u003cdiv>\u003cb class=\"ar\">الحرف الثالث: خَاء\u003c/b> \u003cspan class=\"lat\">Khaa\u003c/span>\u003cbr>\u003cb>النطق:\u003c/b> يخرج من أعلى الحلق، مثل الصوت في كلمة \u003ci>Bach\u003c/i> الألمانية.\u003cspan class=\"e\">From the upper throat, like the sound in German “Bach”.\u003c/span>\n\u003cdiv>\u003cspan class=\"wd\">\u003ci>🍞\u003c/i>\u003cb class=\"ar\">خُبْزٌ\u003c/b> Bread\u003c/span>\u003cspan class=\"wd\">\u003ci>👨\u003c/i>\u003cb class=\"ar\">خَالٌ\u003c/b> Maternal uncle\u003c/span>\u003cspan class=\"wd\">\u003ci>✨\u003c/i>\u003cb class=\"ar\">خَيْرٌ\u003c/b> Goodness\u003c/span>\u003c/div>\n\u003cdiv class=\"box note\" style=\"margin:8px 0 0\">\u003cb>👀 انتبه\u003c/b>الخاء تشبه الحاء، لكن لها \u003cb>نقطة واحدة أعلى\u003c/b>، وصوتها مختلف.\u003cspan class=\"e\">Khaa looks like Haa but has one dot above, and a different sound.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"lc c4\">\u003cdiv class=\"big\">د\u003c/div>\u003cdiv>\u003cb class=\"ar\">الحرف الرابع: دَال\u003c/b> \u003cspan class=\"lat\">Daal\u003c/span>\u003cbr>\u003cb>النطق:\u003c/b> قريب من D، ويخرج من طرف اللسان مع أصول الثنايا العليا.\u003cspan class=\"e\">Close to English D, from the tongue tip at the upper front teeth.\u003c/span>\n\u003cdiv>\u003cspan class=\"wd\">\u003ci>🏠\u003c/i>\u003cb class=\"ar\">دَارٌ\u003c/b> House / Home\u003c/span>\u003cspan class=\"wd\">\u003ci>🐓\u003c/i>\u003cb class=\"ar\">دِيكٌ\u003c/b> Rooster\u003c/span>\u003cspan class=\"wd\">\u003ci>🐻\u003c/i>\u003cb class=\"ar\">دُبٌّ\u003c/b> Bear\u003c/span>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"lc c5\">\u003cdiv class=\"big\">ذ\u003c/div>\u003cdiv>\u003cb class=\"ar\">الحرف الخامس: ذَال\u003c/b> \u003cspan class=\"lat\">Dhaal\u003c/span>\u003cbr>\u003cb>النطق:\u003c/b> نضع طرف اللسان بين الأسنان الأمامية قليلًا، ونخرج صوتًا مجهورًا. يشبه TH في \u003ci>This\u003c/i>.\u003cspan class=\"e\">Tongue tip slightly between the front teeth, with a voiced sound. Like TH in “this”.\u003c/span>\n\u003cdiv>\u003cspan class=\"wd\">\u003ci>🥇\u003c/i>\u003cb class=\"ar\">ذَهَبٌ\u003c/b> Gold\u003c/span>\u003cspan class=\"wd\">\u003ci>🐺\u003c/i>\u003cb class=\"ar\">ذِئْبٌ\u003c/b> Wolf\u003c/span>\u003cspan class=\"wd\">\u003ci>🪰\u003c/i>\u003cb class=\"ar\">ذُبَابٌ\u003c/b> Fly\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection class=\"s4\">\u003ch2>\u003ci>4\u003c/i>\u003cspan>مقارنة الحروف المتشابهة\u003cspan class=\"e\">Similar Letters\u003c/span>\u003c/span>\u003c/h2>\n\u003cp>\u003cb>المجموعة الأولى:\u003c/b> ج – ح – خ\u003c/p>\n\u003cdiv class=\"dots\">\n\u003cdiv class=\"c1 lc\" style=\"display:block;text-align:center\">\u003cdiv class=\"big\">ج\u003c/div>\u003cb>نقطة أسفل\u003c/b>\u003cspan class=\"e\" style=\"text-align:center\">One dot below\u003c/span>\u003c/div>\n\u003cdiv class=\"c2 lc\" style=\"display:block;text-align:center\">\u003cdiv class=\"big\">ح\u003c/div>\u003cb>دون نقاط\u003c/b>\u003cspan class=\"e\" style=\"text-align:center\">No dots\u003c/span>\u003c/div>\n\u003cdiv class=\"c3 lc\" style=\"display:block;text-align:center\">\u003cdiv class=\"big\">خ\u003c/div>\u003cb>نقطة أعلى\u003c/b>\u003cspan class=\"e\" style=\"text-align:center\">One dot above\u003c/span>\u003c/div>\u003c/div>\n\u003cp>\u003cb>المجموعة الثانية:\u003c/b> د – ذ\u003c/p>\n\u003cdiv class=\"dots\">\n\u003cdiv class=\"c4 lc\" style=\"display:block;text-align:center\">\u003cdiv class=\"big\">د\u003c/div>\u003cb>دون نقاط\u003c/b>\u003cspan class=\"e\" style=\"text-align:center\">No dots\u003c/span>\u003c/div>\n\u003cdiv class=\"c5 lc\" style=\"display:block;text-align:center\">\u003cdiv class=\"big\">ذ\u003c/div>\u003cb>نقطة أعلى\u003c/b>\u003cspan class=\"e\" style=\"text-align:center\">One dot above\u003c/span>\u003c/div>\u003c/div>\n\u003cdiv class=\"box tip\">\u003cb>🎧 تدريب سمعي مهم · Listening Practice\u003c/b>يقول معلمك الحروف بترتيب عشوائي، وأنت تحدد الحرف الذي سمعته وتنطقه بنفسك:\u003cdiv class=\"chips ar\" style=\"font-size:1.4rem;margin-top:6px\">\u003cspan>ج – خ – ح\u003c/span>\u003cspan>ذ – د – ذ\u003c/span>\u003cspan>ح – ج – ح\u003c/span>\u003cspan>خ – د – ج\u003c/span>\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection class=\"s5\">\u003ch2>\u003ci>5\u003c/i>\u003cspan>الحركات القصيرة\u003cspan class=\"e\">Short Vowels\u003c/span>\u003c/span>\u003c/h2>\n\u003cp>نراجع الفتحة والكسرة والضمة ونطبقها على الحروف الجديدة.\u003cspan class=\"e\">We review fatha, kasra and damma on the new letters.\u003c/span>\u003c/p>\n\u003cdiv class=\"wrap\">\u003ctable>\u003ctr>\u003cth>الحرف\u003c/th>\u003cth>الفتحة\u003c/th>\u003cth>الكسرة\u003c/th>\u003cth>الضمة\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd class=\"ar\">ج\u003c/td>\u003ctd class=\"ar\">جَ\u003c/td>\u003ctd class=\"ar\">جِ\u003c/td>\u003ctd class=\"ar\">جُ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"ar\">ح\u003c/td>\u003ctd class=\"ar\">حَ\u003c/td>\u003ctd class=\"ar\">حِ\u003c/td>\u003ctd class=\"ar\">حُ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"ar\">خ\u003c/td>\u003ctd class=\"ar\">خَ\u003c/td>\u003ctd class=\"ar\">خِ\u003c/td>\u003ctd class=\"ar\">خُ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"ar\">د\u003c/td>\u003ctd class=\"ar\">دَ\u003c/td>\u003ctd class=\"ar\">دِ\u003c/td>\u003ctd class=\"ar\">دُ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"ar\">ذ\u003c/td>\u003ctd class=\"ar\">ذَ\u003c/td>\u003ctd class=\"ar\">ذِ\u003c/td>\u003ctd class=\"ar\">ذُ\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cdiv class=\"box note\">\u003cb>🗣 تدريب · Practice\u003c/b>اقرأ كل صف ثلاث مرات، ثم جرّب ترتيبًا مختلفًا:\u003cdiv class=\"chips ar\" style=\"font-size:1.4rem;margin-top:6px\">\u003cspan>جُ – جَ – جِ\u003c/span>\u003cspan>حِ – حُ – حَ\u003c/span>\u003cspan>خَ – خِ – خُ\u003c/span>\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection class=\"s6\">\u003ch2>\u003ci>6\u003c/i>\u003cspan>أشكال الحروف في الكلمات\u003cspan class=\"e\">Letter Forms\u003c/span>\u003c/span>\u003c/h2>\n\u003cp>\u003cb>الحروف ج – ح – خ\u003c/b> تقبل الاتصال من الجهتين.\u003cspan class=\"e\">These letters connect on both sides.\u003c/span>\u003c/p>\n\u003cdiv class=\"wrap\">\u003ctable>\u003ctr>\u003cth>الموقع · Position\u003c/th>\u003cth>جيم\u003c/th>\u003cth>حاء\u003c/th>\u003cth>خاء\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>منفصل · Alone\u003c/td>\u003ctd class=\"ar\">ج\u003c/td>\u003ctd class=\"ar\">ح\u003c/td>\u003ctd class=\"ar\">خ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>أول الكلمة · Start\u003c/td>\u003ctd class=\"ar\">جـ\u003c/td>\u003ctd class=\"ar\">حـ\u003c/td>\u003ctd class=\"ar\">خـ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>وسط الكلمة · Middle\u003c/td>\u003ctd class=\"ar\">ـجـ\u003c/td>\u003ctd class=\"ar\">ـحـ\u003c/td>\u003ctd class=\"ar\">ـخـ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>آخر الكلمة · End\u003c/td>\u003ctd class=\"ar\">ـج\u003c/td>\u003ctd class=\"ar\">ـح\u003c/td>\u003ctd class=\"ar\">ـخ\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>\u003cb>الحروف د – ذ\u003c/b>\u003c/p>\n\u003cdiv class=\"wrap\">\u003ctable>\u003ctr>\u003cth>الموقع · Position\u003c/th>\u003cth>دال\u003c/th>\u003cth>ذال\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>منفصل · Alone\u003c/td>\u003ctd class=\"ar\">د\u003c/td>\u003ctd class=\"ar\">ذ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>بداية الكلمة · Start\u003c/td>\u003ctd class=\"ar\">د\u003c/td>\u003ctd class=\"ar\">ذ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>وسط الكلمة · Middle\u003c/td>\u003ctd class=\"ar\">ـد\u003c/td>\u003ctd class=\"ar\">ـذ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>نهاية الكلمة · End\u003c/td>\u003ctd class=\"ar\">ـد\u003c/td>\u003ctd class=\"ar\">ـذ\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cdiv class=\"box note\">\u003cb>⚠️ قاعدة مهمة جدًا · Very Important Rule\u003c/b>الدال والذال لا يتصلان بالحرف الذي بعدهما (من جهة اليسار)، فيبدأ الحرف التالي منفصلًا. مثل: \u003cspan class=\"ar\">دَارٌ\u003c/span> و\u003cspan class=\"ar\">ذَهَبٌ\u003c/span>\u003cspan class=\"e\">Daal and Dhaal do not connect to the next letter; the next letter starts separately.\u003c/span>\u003c/div>\u003c/section>\n\n\u003csection class=\"s1\">\u003ch2>\u003ci>7\u003c/i>\u003cspan>المفردات الجديدة\u003cspan class=\"e\">New Vocabulary\u003c/span>\u003c/span>\u003c/h2>\n\u003cdiv class=\"dots\">\n\u003cdiv class=\"c1 lc\" style=\"display:block;text-align:center\">\u003cdiv style=\"font-size:3rem\">🐪\u003c/div>\u003cdiv class=\"ar\" style=\"font-size:1.6rem\">جَمَلٌ\u003c/div>\u003cspan class=\"e\" style=\"text-align:center\">Camel\u003c/span>\u003c/div>\n\u003cdiv class=\"c2 lc\" style=\"display:block;text-align:center\">\u003cdiv style=\"font-size:3rem\">⛰️\u003c/div>\u003cdiv class=\"ar\" style=\"font-size:1.6rem\">جَبَلٌ\u003c/div>\u003cspan class=\"e\" style=\"text-align:center\">Mountain\u003c/span>\u003c/div>\n\u003cdiv class=\"c3 lc\" style=\"display:block;text-align:center\">\u003cdiv style=\"font-size:3rem\">🥛\u003c/div>\u003cdiv class=\"ar\" style=\"font-size:1.6rem\">حَلِيبٌ\u003c/div>\u003cspan class=\"e\" style=\"text-align:center\">Milk\u003c/span>\u003c/div>\n\u003cdiv class=\"c4 lc\" style=\"display:block;text-align:center\">\u003cdiv style=\"font-size:3rem\">🍞\u003c/div>\u003cdiv class=\"ar\" style=\"font-size:1.6rem\">خُبْزٌ\u003c/div>\u003cspan class=\"e\" style=\"text-align:center\">Bread\u003c/span>\u003c/div>\n\u003cdiv class=\"c5 lc\" style=\"display:block;text-align:center\">\u003cdiv style=\"font-size:3rem\">🏠\u003c/div>\u003cdiv class=\"ar\" style=\"font-size:1.6rem\">دَارٌ\u003c/div>\u003cspan class=\"e\" style=\"text-align:center\">Home / House\u003c/span>\u003c/div>\n\u003cdiv class=\"c1 lc\" style=\"display:block;text-align:center\">\u003cdiv style=\"font-size:3rem\">🥇\u003c/div>\u003cdiv class=\"ar\" style=\"font-size:1.6rem\">ذَهَبٌ\u003c/div>\u003cspan class=\"e\" style=\"text-align:center\">Gold\u003c/span>\u003c/div>\u003c/div>\n\u003cdiv class=\"box note\">\u003cb>💡 تنبيه · Tip\u003c/b>بعض هذه الكلمات فيها حروف لم تتعلمها بعد، مثل ل وي وه. استمع إليها وانطقها الآن، ولا تقلق من قراءتها وحدك.\u003cspan class=\"e\">Some words contain letters you haven’t learned yet (ل ي ه). Just listen and speak them for now; you aren’t expected to read them alone yet.\u003c/span>\u003c/div>\u003c/section>\n\n\u003csection class=\"s2\">\u003ch2>\u003ci>8\u003c/i>\u003cspan>أول جمل بسيطة\u003cspan class=\"e\">Simple Sentences\u003c/span>\u003c/span>\u003c/h2>\n\u003cdiv class=\"dlg\">\n\u003cdiv class=\"m a\">\u003cdiv class=\"ar\">\u003cspan class=\"ic\">🐪\u003c/span>هَذَا جَمَلٌ.\u003c/div>\u003csmall>This is a camel.\u003c/small>\u003c/div>\n\u003cdiv class=\"m l\">\u003cdiv class=\"ar\">\u003cspan class=\"ic\">⛰️\u003c/span>هَذَا جَبَلٌ.\u003c/div>\u003csmall>This is a mountain.\u003c/small>\u003c/div>\n\u003cdiv class=\"m a\">\u003cdiv class=\"ar\">\u003cspan class=\"ic\">🍞\u003c/span>هَذَا خُبْزٌ.\u003c/div>\u003csmall>This is bread.\u003c/small>\u003c/div>\n\u003cdiv class=\"m l\">\u003cdiv class=\"ar\">\u003cspan class=\"ic\">🥇\u003c/span>هَذَا ذَهَبٌ.\u003c/div>\u003csmall>This is gold.\u003c/small>\u003c/div>\u003c/div>\n\u003cdiv class=\"box tip\">\u003cb>✅ لا تقلق · Don’t Worry\u003c/b>يكفي أن تفهم أن «هَذَا» تُستعمل للإشارة إلى شيء مذكر.\u003cspan class=\"e\">It is enough to know that “hadha” points to something masculine (“this”).\u003c/span>\u003c/div>\u003c/section>\n\n\u003csection class=\"s3\" id=\"quiz\">\u003ch2>\u003ci>9\u003c/i>\u003cspan>التدريبات\u003cspan class=\"e\">Exercises\u003c/span>\u003c/span>\u003c/h2>\n\u003ch3>التدريب الأول: اختر الحرف الصحيح\u003cspan class=\"e\">Exercise 1: Choose the correct letter\u003c/span>\u003c/h3>\u003cdiv id=\"mc\">\u003c/div>\n\u003ch3>التدريب الثاني: أكمل بالحرف المناسب\u003cspan class=\"e\">Exercise 2: Complete with the right letter\u003c/span>\u003c/h3>\n\u003cp>الحروف: \u003cb class=\"ar\">ج – ح – خ – د – ذ\u003c/b>\u003c/p>\n\u003cdiv id=\"fills\">\u003c/div>\u003cbutton class=\"btn\" id=\"chk\">تحقق من الإجابات\u003c/button>\u003cdiv class=\"score\" id=\"sc\">\u003c/div>\n\u003ch3>التدريب الثالث: صح أم خطأ؟\u003cspan class=\"e\">Exercise 3: True or false?\u003c/span>\u003c/h3>\u003cdiv id=\"tf\">\u003c/div>\n\u003ch3>التدريب الرابع: استمع واكتب\u003cspan class=\"e\">Exercise 4: Listen and write\u003c/span>\u003c/h3>\n\u003cp>يقول معلمك حرفًا دون أن تراه، وأنت تكتبه:\u003cspan class=\"e\">Your teacher says a letter without showing it; you write it.\u003c/span>\u003c/p>\n\u003cdiv class=\"chips ar\" style=\"font-size:1.6rem\">\u003cspan>ج\u003c/span>\u003cspan>خ\u003c/span>\u003cspan>د\u003c/span>\u003cspan>ح\u003c/span>\u003cspan>ذ\u003c/span>\u003c/div>\n\u003cp style=\"margin-top:8px\">ثم كرّر بترتيب مختلف 🔁\u003c/p>\u003c/section>\n\n\u003csection class=\"s4\">\u003ch2>\u003ci>10\u003c/i>\u003cspan>نشاط المحادثة\u003cspan class=\"e\">Speaking Activity\u003c/span>\u003c/span>\u003c/h2>\n\u003cp>انظر إلى الصور وأجب بالعربية، لا تكتفِ بحفظ المفردات!\u003cspan class=\"e\">Look at the pictures and answer in Arabic; don’t just memorize words!\u003c/span>\u003c/p>\n\u003cdiv class=\"chips ar\" style=\"font-size:2rem\">\u003cspan>🐪\u003c/span>\u003cspan>⛰️\u003c/span>\u003cspan>🍞\u003c/span>\u003cspan>🥇\u003c/span>\u003c/div>\n\u003cul class=\"speak\">\u003cli>مَا هَذَا؟\u003c/li>\u003cli>هَلْ هَذَا جَمَلٌ؟\u003c/li>\u003cli>هَلْ هَذَا خُبْزٌ؟\u003c/li>\u003c/ul>\n\u003cp>\u003cb>يمكنك أن تجيب:\u003c/b>\u003c/p>\n\u003cdiv class=\"dlg\">\u003cdiv class=\"m a\">\u003cdiv class=\"ar\">هَذَا جَمَلٌ.\u003c/div>\u003c/div>\u003cdiv class=\"m a\">\u003cdiv class=\"ar\">نَعَمْ، هَذَا جَمَلٌ.\u003c/div>\u003c/div>\u003cdiv class=\"m l\">\u003cdiv class=\"ar\">لَا، هَذَا لَيْسَ جَمَلًا.\u003c/div>\u003csmall>No, this is not a camel.\u003c/small>\u003c/div>\u003c/div>\n\u003cdiv class=\"box note\">\u003cb>📌 ملاحظة · Note\u003c/b>العبارة الأخيرة للتعرّف فقط، ولا تحتاج إلى حفظ النفي الآن.\u003cspan class=\"e\">The last sentence is just a bonus model; you don’t need to memorize negation yet.\u003c/span>\u003c/div>\u003c/section>\n\n\u003csection class=\"s5\">\u003ch2>\u003ci>11\u003c/i>\u003cspan>الكتابة\u003cspan class=\"e\">Writing Practice\u003c/span>\u003c/span>\u003c/h2>\n\u003cdiv class=\"wrap\">\u003ctable>\u003ctr>\u003cth>الحرف\u003c/th>\u003cth>اكتبه في المواضع\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd class=\"ar\">ج\u003c/td>\u003ctd class=\"ar\">جـ &nbsp; ـجـ &nbsp; ـج\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"ar\">ح\u003c/td>\u003ctd class=\"ar\">حـ &nbsp; ـحـ &nbsp; ـح\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"ar\">خ\u003c/td>\u003ctd class=\"ar\">خـ &nbsp; ـخـ &nbsp; ـخ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"ar\">د\u003c/td>\u003ctd class=\"ar\">د &nbsp; ـد\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"ar\">ذ\u003c/td>\u003ctd class=\"ar\">ذ &nbsp; ـذ\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cul>\u003cli>اكتب كل حرف 5 مرات ✍\u003cspan class=\"e\">Write each letter 5 times\u003c/span>\u003c/li>\u003cli>ضع النقاط في مواضعها الصحيحة\u003cspan class=\"e\">Put the dots in the right places\u003c/span>\u003c/li>\u003cli>انسخ الكلمات: \u003cspan class=\"ar\">جَمَل · جَبَل · خُبْز · ذَهَب\u003c/span>\u003cspan class=\"e\">Copy the words\u003c/span>\u003c/li>\u003c/ul>\u003c/section>\n\n\u003csection class=\"s6\">\u003ch2>\u003ci>12\u003c/i>\u003cspan>الأخطاء الشائعة\u003cspan class=\"e\">Common Mistakes\u003c/span>\u003c/span>\u003c/h2>\n\u003cdiv class=\"wrap\">\u003ctable>\u003ctr>\u003cth>الخطأ · Mistake\u003c/th>\u003cth>التصحيح · Fix\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>نطق ح مثل H الإنجليزية\u003c/td>\u003ctd>انطقها من وسط الحلق\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>نطق خ مثل ح\u003c/td>\u003ctd>قارن بين الصوتين\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>نطق ذ مثل ز\u003c/td>\u003ctd>ضع اللسان بين الأسنان\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>الخلط بين ج وح وخ\u003c/td>\u003ctd>ركّز على النقاط\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>وصل د وذ بما بعدهما\u00 xLaT9mGr3GwDoVhD6R78jRs+YGZLEZDBWEuZUQrmMdKOcfZclMhlh9B0lJJVgemd6Yx//9k=\">\n\u003cdiv class=\"brand\">Arabic with Nour El-Din\u003c/div>\n\u003cdiv class=\"ar\" style=\"font-size:1.1rem\">الوحدة الأولى: البداية والتعارف · Unit 1\u003c/div>\n\u003ch1 class=\"ar\" style=\"font-size:2.1rem\">الدرس الرابع: الحروف العربية – المجموعة الثالثة\u003c/h1>\n\u003cdiv class=\"en\">Lesson 04 · A0 · The Arabic Alphabet – Group 3\u003c/div>\n\u003cdiv class=\"ar\" style=\"font-size:2.6rem;letter-spacing:8px;margin-top:6px\">ر – ز – س – ش\u003c/div>\n\u003cdiv class=\"tags\">\u003cspan>🔤 الحروف\u003c/span>\u003cspan>👂 الاستماع\u003c/span>\u003cspan>🗣 النطق\u003c/span>\u003cspan>📖 القراءة\u003c/span>\u003cspan>✍ الكتابة\u003c/span>\u003c/div>\n\u003c/header>\n\u003cmain>\n\n\u003csection class=\"s1\">\u003ch2>\u003ci>1\u003c/i>\u003cspan>أهداف الدرس\u003cspan class=\"e\">Lesson Objectives\u003c/span>\u003c/span>\u003c/h2>\n\u003cp>بنهاية الدرس ستستطيع أن:\u003cspan class=\"e\">By the end of this lesson you will be able to:\u003c/span>\u003c/p>\n\u003cul>\n\u003cli>تتعرف على الحروف الأربعة وتميّز بينها 🔤\u003cspan class=\"e\">Recognize the four letters and tell them apart\u003c/span>\u003c/li>\n\u003cli>تنطق الحروف نطقًا صحيحًا 🗣\u003cspan class=\"e\">Pronounce the letters correctly\u003c/span>\u003c/li>\n\u003cli>تقرأ الحروف مع الحركات القصيرة 📖\u003cspan class=\"e\">Read the letters with short vowels\u003c/span>\u003c/li>\n\u003cli>تميّز بين السين والشين 👂\u003cspan class=\"e\">Tell س and ش apart\u003c/span>\u003c/li>\n\u003cli>تعرف كيف تتصل هذه الحروف بغيرها 🧩\u003cspan class=\"e\">Know how these letters connect to others\u003c/span>\u003c/li>\n\u003cli>تقرأ كلمات بسيطة من الحروف التي تعلمتها 🌟\u003cspan class=\"e\">Read simple words made of letters you know\u003c/span>\u003c/li>\u003c/ul>\u003c/section>\n\n\u003csection class=\"s2\">\u003ch2>\u003ci>2\u003c/i>\u003cspan>مراجعة سريعة\u003cspan class=\"e\">Quick Review\u003c/span>\u003c/span>\u003c/h2>\n\u003cdiv class=\"chips ar\" style=\"font-size:1.6rem\">\u003cspan>ا\u003c/span>\u003cspan>ب\u003c/span>\u003cspan>ت\u003c/span>\u003cspan>ث\u003c/span>\u003cspan>ج\u003c/span>\u003cspan>ح\u003c/span>\u003cspan>خ\u003c/span>\u003cspan>د\u003c/span>\u003cspan>ذ\u003c/span>\u003c/div>\n\u003cp>أجب شفهيًا ثم افتح الإجابة:\u003cspan class=\"e\">Answer out loud, then open the answer:\u003c/span>\u003c/p>\n\u003cul>\n\u003cli>ما هذا الحرف؟ (اختر أي حرف من الأعلى) 👆\u003c/li>\n\u003cli>ما الفرق بين \u003cspan class=\"ar\">ب\u003c/span> و\u003cspan class=\"ar\">ت\u003c/span> و\u003cspan class=\"ar\">ث\u003c/span>؟ \u003cdetails>\u003csummary>👀\u003c/summary>عدد النقاط وموضعها · Number and position of dots\u003c/details>\u003c/li>\n\u003cli>هل يتصل \u003cspan class=\"ar\">د\u003c/span> و\u003cspan class=\"ar\">ذ\u003c/span> بالحرف الذي بعدهما؟ \u003cdetails>\u003csummary>👀\u003c/summary>لا · No\u003c/details>\u003c/li>\n\u003cli>اقرأ: \u003cspan class=\"ar\">بَ – تُ – جِ – خُ – دَ\u003c/span>\u003c/li>\u003c/ul>\u003c/section>\n\n\u003csection class=\"s3\">\u003ch2>\u003ci>3\u003c/i>\u003cspan>الحروف الجديدة\u003cspan class=\"e\">New Letters\u003c/span>\u003c/span>\u003c/h2>\n\n\u003cdiv class=\"lc c1\">\u003cdiv class=\"big\">ر\u003c/div>\u003cdiv>\u003cb class=\"ar\">أولًا: الراء\u003c/b> \u003cspan class=\"lat\">Rā’\u003c/span>\u003cbr>\u003cb>النطق:\u003c/b> قريب من R مع نطق عربي واضح.\u003cspan class=\"e\">Close to R, with a clear Arabic pronunciation.\u003c/span>\n\u003cdiv>\u003cspan class=\"wd\">\u003ci>👨\u003c/i>\u003cb class=\"ar\">رَجُلٌ\u003c/b> Man\u003c/span>\u003cspan class=\"wd\">\u003ci>👤\u003c/i>\u003cb class=\"ar\">رَأْسٌ\u003c/b> Head\u003c/span>\u003c/div>\n\u003cdiv class=\"wrap\">\u003ctable style=\"min-width:0\">\u003ctr>\u003ctd class=\"ar\">رَ\u003c/td>\u003ctd class=\"ar\">رِ\u003c/td>\u003ctd class=\"ar\">رُ\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"lat\">Ra\u003c/td>\u003ctd class=\"lat\">Ri\u003c/td>\u003ctd class=\"lat\">Ru\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"lc c2\">\u003cdiv class=\"big\">ز\u003c/div>\u003cdiv>\u003cb class=\"ar\">ثانيًا: الزاي\u003c/b> \u003cspan class=\"lat\">Zāy\u003c/span>\u003cbr>\u003cb>النطق:\u003c/b> مثل Z في \u003ci>Zoo\u003c/i>.\u003cspan class=\"e\">Like Z in “Zoo”.\u003c/span>\n\u003cdiv>\u003cspan class=\"wd\">\u003ci>🫒\u003c/i>\u003cb class=\"ar\">زَيْتٌ\u003c/b> Oil\u003c/span>\u003cspan class=\"wd\">\u003ci>🌸\u003c/i>\u003cb class=\"ar\">زَهْرَةٌ\u003c/b> Flower\u003c/span>\u003c/div>\n\u003cdiv class=\"wrap\">\u003ctable style=\"min-width:0\">\u003ctr>\u003ctd class=\"ar\">زَ\u003c/td>\u003ctd class=\"ar\">زِ\u003c/td>\u003ctd class=\"ar\">زُ\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"lat\">Za\u003c/td>\u003ctd class=\"lat\">Zi\u003c/td>\u003ctd class=\"lat\">Zu\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"lc c3\">\u003cdiv class=\"big\">س\u003c/div>\u003cdiv>\u003cb class=\"ar\">ثالثًا: السين\u003c/b> \u003cspan class=\"lat\">Sīn\u003c/span>\u003cbr>\u003cb>النطق:\u003c/b> مثل S في \u003ci>Sun\u003c/i>.\u003cspan class=\"e\">Like S in “Sun”.\u003c/span>\n\u003cdiv>\u003cspan class=\"wd\">\u003ci>🐟\u003c/i>\u003cb class=\"ar\">سَمَكٌ\u003c/b> Fish\u003c/span>\u003cspan class=\"wd\">\u003ci>🚗\u003c/i>\u003cb class=\"ar\">سَيَّارَةٌ\u003c/b> Car\u003c/span>\u003c/div>\n\u003cdiv class=\"wrap\">\u003ctable style=\"min-width:0\">\u003ctr>\u003ctd class=\"ar\">سَ\u003c/td>\u003ctd class=\"ar\">سِ\u003c/td>\u003ctd class=\"ar\">سُ\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"lat\">Sa\u003c/td>\u003ctd class=\"lat\">Si\u003c/td>\u003ctd class=\"lat\">Su\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"lc c4\">\u003cdiv class=\"big\">ش\u003c/div>\u003cdiv>\u003cb class=\"ar\">رابعًا: الشين\u003c/b> \u003cspan class=\"lat\">Shīn\u003c/span>\u003cbr>\u003cb>النطق:\u003c/b> مثل SH في \u003ci>Ship\u003c/i>.\u003cspan class=\"e\">Like SH in “Ship”.\u003c/span>\n\u003cdiv>\u003cspan class=\"wd\">\u003ci>☀️\u003c/i>\u003cb class=\"ar\">شَمْسٌ\u003c/b> Sun\u003c/span>\u003cspan class=\"wd\">\u003ci>🍵\u003c/i>\u003cb class=\"ar\">شَايٌ\u003c/b> Tea\u003c/span>\u003c/div>\n\u003cdiv class=\"wrap\">\u003ctable style=\"min-width:0\">\u003ctr>\u003ctd class=\"ar\">شَ\u003c/td>\u003ctd class=\"ar\">شِ\u003c/td>\u003ctd class=\"ar\">شُ\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"lat\">Sha\u003c/td>\u003ctd class=\"lat\">Shi\u003c/td>\u003ctd class=\"lat\">Shu\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection class=\"s4\">\u003ch2>\u003ci>4\u003c/i>\u003cspan>الفرق بين الحروف\u003cspan class=\"e\">Similar Letters\u003c/span>\u003c/span>\u003c/h2>\n\u003cp>\u003cb>السين والشين:\u003c/b>\u003c/p>\n\u003cdiv class=\"dots\">\n\u003cdiv class=\"c3 lc\" style=\"display:block;text-align:center\">\u003cdiv class=\"big\">س\u003c/div>\u003cb class=\"ar\">سين\u003c/b> · S\u003cbr>بدون نقاط\u003cspan class=\"e\" style=\"text-align:center\">No dots\u003c/span>\u003c/div>\n\u003cdiv class=\"c4 lc\" style=\"display:block;text-align:center\">\u003cdiv class=\"big\">ش\u003c/div>\u003cb class=\"ar\">شين\u003c/b> · SH\u003cbr>ثلاث نقاط فوقه\u003cspan class=\"e\" style=\"text-align:center\">Three dots above\u003c/span>\u003c/div>\u003c/div>\n\u003cp>\u003cb>الراء والزاي:\u003c/b>\u003c/p>\n\u003cdiv class=\"dots\">\n\u003cdiv class=\"c1 lc\" style=\"display:block;text-align:center\">\u003cdiv class=\"big\">ر\u003c/div>بدون نقاط\u003cspan class=\"e\" style=\"text-align:center\">No dots\u003c/span>\u003c/div>\n\u003cdiv class=\"c2 lc\" style=\"display:block;text-align:center\">\u003cdiv class=\"big\">ز\u003c/div>نقطة واحدة فوقه\u003cspan class=\"e\" style=\"text-align:center\">One dot above\u003c/span>\u003c/div>\u003c/div>\n\u003cdiv class=\"box tip\">\u003cb>🎧 تدريب سمعي · Listening Practice\u003c/b>استمع لمعلمك ثم اختر الحرف الصحيح، وانطق الأزواج بنفسك:\u003cdiv class=\"chips ar\" style=\"font-size:1.5rem;margin-top:6px\">\u003cspan>سَ – شَ\u003c/span>\u003cspan>سِ – شِ\u003c/span>\u003cspan>سُ – شُ\u003c/span>\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection class=\"s5\">\u003ch2>\u003ci>5\u003c/i>\u003cspan>أشكال الحروف\u003cspan class=\"e\">Letter Forms\u003c/span>\u003c/span>\u003c/h2>\n\u003cdiv class=\"wrap\">\u003ctable>\u003ctr>\u003cth>الحرف\u003c/th>\u003cth>أول الكلمة · Start\u003c/th>\u003cth>وسط الكلمة · Middle\u003c/th>\u003cth>آخر الكلمة · End\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd class=\"ar\">ر\u003c/td>\u003ctd class=\"ar\">ر\u003c/td>\u003ctd class=\"ar\">ـر\u003c/td>\u003ctd class=\"ar\">ـر\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"ar\">ز\u003c/td>\u003ctd class=\"ar\">ز\u003c/td>\u003ctd class=\"ar\">ـز\u003c/td>\u003ctd class=\"ar\">ـز\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"ar\">س\u003c/td>\u003ctd class=\"ar\">سـ\u003c/td>\u003ctd class=\"ar\">ـسـ\u003c/td>\u003ctd class=\"ar\">ـس\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"ar\">ش\u003c/td>\u003ctd class=\"ar\">شـ\u003c/td>\u003ctd class=\"ar\">ـشـ\u003c/td>\u003ctd class=\"ar\">ـش\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cdiv class=\"box note\">\u003cb>⚠️ ملاحظة مهمة · Important Note\u003c/b>الراء والزاي \u003cb>لا تتصلان بالحرف الذي بعدهما\u003c/b>، لكنهما قد تتصلان بالحرف الذي قبلهما.\u003cspan class=\"e\">Raa and Zay do not connect to the next letter, but can connect to the letter before them.\u003c/span>\u003c/div>\n\u003cdiv class=\"box tip\">\u003cb>✅ قاعدة · Rule\u003c/b>السين والشين تتصلان من الجهتين إذا كان الحرف التالي يقبل الاتصال.\u003cspan class=\"e\">Seen and Sheen connect on both sides when the next letter allows it.\u003c/span>\u003c/div>\n\u003cdiv class=\"box note\">\u003cb>🔁 تذكّر · Remember\u003c/b>الحروف التي لا تتصل بما بعدها حتى الآن: \u003cspan class=\"ar\" style=\"font-size:1.4rem\">ا · د · ذ · ر · ز\u003c/span>\u003cspan class=\"e\">Letters that don’t connect to the next one so far\u003c/span>\u003c/div>\u003c/section>\n\n\u003csection class=\"s6\">\u003ch2>\u003ci>6\u003c/i>\u003cspan>القراءة والتطبيق\u003cspan class=\"e\">Reading Practice\u003c/span>\u003c/span>\u003c/h2>\n\u003cp>اقرأ الأصوات:\u003cspan class=\"e\">Read the sounds:\u003c/span>\u003c/p>\n\u003cdiv class=\"chips ar\" style=\"font-size:1.5rem\">\u003cspan>رَ – رِ – رُ\u003c/span>\u003cspan>زَ – زِ – زُ\u003c/span>\u003cspan>سَ – سِ – سُ\u003c/span>\u003cspan>شَ – شِ – شُ\u003c/span>\u003c/div>\n\u003cp style=\"margin-top:12px\">الآن كلمات من حروف تعرفها:\u003cspan class=\"e\">Now words made of letters you already know:\u003c/span>\u003c/p>\n\u003cdiv class=\"wrap\">\u003ctable>\u003ctr>\u003cth>الكلمة\u003c/th>\u003cth>النطق · Sound\u003c/th>\u003cth>المعنى · Meaning\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd class=\"ar\">دَرَسَ 📚\u003c/td>\u003ctd class=\"lat\">Darasa\u003c/td>\u003ctd class=\"en\">He studied\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"ar\">زَارَ 🏠\u003c/td>\u003ctd class=\"lat\">Zāra\u003c/td>\u003ctd class=\"en\">He visited\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"ar\">سَارَ 🚶\u003c/td>\u003ctd class=\"lat\">Sāra\u003c/td>\u003ctd class=\"en\">He walked / travelled\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cdiv class=\"box note\">\u003cb>💡 تنبيه · Tip\u003c/b>كلمات مثل \u003cspan class=\"ar\">سَمَكٌ\u003c/span> و\u003cspan class=\"ar\">شَمْسٌ\u003c/span> فيها حروف لم تتعلمها بعد، فاستمع إليها وانطقها فقط.\u003cspan class=\"e\">Words like “samak” and “shams” contain letters you haven’t learned yet; just listen and say them.\u003c/span>\u003c/div>\u003c/section>\n\n\u003csection class=\"s1\" id=\"quiz\">\u003ch2>\u003ci>7\u003c/i>\u003cspan>التدريبات\u003cspan class=\"e\">Exercises\u003c/span>\u003c/span>\u003c/h2>\n\u003ch3>التدريب الأول: اختر الحرف الصحيح\u003cspan class=\"e\">Exercise 1: Choose the correct letter\u003c/span>\u003c/h3>\u003cdiv id=\"mc\">\u003c/div>\n\u003ch3>التدريب الثاني: اقرأ بصوت مرتفع\u003cspan class=\"e\">Exercise 2: Read aloud\u003c/span>\u003c/h3>\n\u003cdiv class=\"chips ar\" style=\"font-size:1.6rem\">\u003cspan>رَ – زَ – سَ – شَ\u003c/span>\u003c/div>\u003cbr>\n\u003cdiv class=\"chips ar\" style=\"font-size:1.6rem\">\u003cspan>رُ – زُ – سُ – شُ\u003c/span>\u003c/div>\u003cbr>\n\u003cdiv class=\"chips ar\" style=\"font-size:1.6rem\">\u003cspan>دَرَسَ – زَارَ – سَارَ\u003c/span>\u003c/div>\n\u003ch3>التدريب الثالث: التمييز السمعي\u003cspan class=\"e\">Exercise 3: Listening discrimination\u003c/span>\u003c/h3>\n\u003cp>ينطق معلمك أحد الحروف الأربعة، وأنت تكتب الحرف الذي سمعته ✍\u003cspan class=\"e\">Your teacher says one of the four letters and you write the one you hear.\u003c/span>\u003c/p>\n\u003ch3>تدريب إضافي: طابق الحرف بصوته\u003cspan class=\"e\">Bonus: Match the letter to its sound\u003c/span>\u003c/h3>\n\u003cdiv id=\"fills\">\u003c/div>\u003cbutton class=\"btn\" id=\"chk\">تحقق من الإجابات\u003c/button>\u003cdiv class=\"score\" id=\"sc\">\u003c/div>\u003c/section>\n\n\u003csection class=\"s2\">\u003ch2>\u003ci>8\u003c/i>\u003cspan>المحادثة\u003cspan class=\"e\">Speaking Practice\u003c/span>\u003c/span>\u003c/h2>\n\u003cp>لن ينتهي الدرس قبل أن تتحدث بالعربية! أجب دون النظر:\u003cspan class=\"e\">The lesson isn’t over until you speak Arabic! Answer without looking:\u003c/span>\u003c/p>\n\u003cul class=\"speak\">\u003cli>مَا اسْمُكَ؟\u003c/li>\u003cli>مِنْ أَيْنَ أَنْتَ؟\u003c/li>\u003cli>كَيْفَ حَالُكَ؟\u003c/li>\u003c/ul>\n\u003cdiv class=\"box tip\">\u003cb>🎤 تحدَّ نفسك · Challenge\u003c/b>قدّم نفسك في \u003cb>ثلاث جمل\u003c/b> دون قراءة من الورقة.\u003cspan class=\"e\">Introduce yourself in three sentences without reading from the page.\u003c/span>\n\u003cdiv class=\"dlg\">\u003cdiv class=\"m a\">\u003cdiv class=\"ar\">اسْمِي ... .\u003c/div>\u003c/div>\u003cdiv class=\"m l\">\u003cdiv class=\"ar\">أَنَا مِنْ ... .\u003c/div>\u003c/div>\u003cdiv class=\"m a\">\u003cdiv class=\"ar\">أَنَا بِخَيْرٍ، شُكْرًا.\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection class=\"s5\">\u003ch2>\u003ci>9\u003c/i>\u003cspan>الأخطاء الشائعة\u003cspan class=\"e\">Common Mistakes\u003c/span>\u003c/span>\u003c/h2>\n\u003cdiv class=\"wrap\">\u003ctable>\u003ctr>\u003cth>الخطأ · Mistake\u003c/th>\u003cth>التصحيح · Fix\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>الخلط بين س وش\u003c/td>\u003ctd>انتبه للنقاط الثلاث، واسمع الصوتين\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>الخلط بين ر وز\u003c/td>\u003ctd>ز لها نقطة واحدة فوقها\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>وصل ر وز بالحرف التالي\u003c/td>\u003ctd>ابدأ الحرف التالي منفصلًا\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003c/section>\n\n\u003csection class=\"s6\">\u003ch2>\u003ci>🏠\u003c/i>\u003cspan>الواجب المنزلي\u003cspan class=\"e\">Homework\u003c/span>\u003c/span>\u003c/h2>\n\u003cul>\u003cli>اكتب كل حرف من الحروف الأربعة 10 مرات\u003cspan class=\"e\">Write each of the four letters 10 times\u003c/span>\u003c/li>\n\u003cli>سجّل صوتك وأنت تنطق الحروف مع الحركات 🎙\u003cspan class=\"e\">Record yourself saying the letters with short vowels\u003c/span>\u003c/li>\n\u003cli>اقرأ الكلمات: \u003cspan class=\"ar\">دَرَسَ – زَارَ – سَارَ\u003c/span>\u003cspan class=\"e\">Read the three words\u003c/span>\u003c/li>\n\u003cli>راجع الحروف التسعة السابقة\u003cspan class=\"e\">Review the nine previous letters\u003c/span>\u003c/li>\n\u003cli>سجّل مقطعًا صوتيًا قصيرًا تعرّف فيه بنفسك بالعربية\u003cspan class=\"e\">Record a short voice message introducing yourself in Arabic\u003c/span>\u003c/li>\u003c/ul>\u003c/section>\n\n\u003csection class=\"s4\">\u003ch2>\u003ci>✔\u003c/i>\u003cspan>اختبر نفسك\u003cspan class=\"e\">Mastery Checklist\u003c/span>\u003c/span>\u003c/h2>\n\u003cp>اضغط لتحديد ما تستطيع فعله:\u003cspan class=\"e\">Tap to tick what you can do:\u003c/span>\u003c/p>\n\u003cdiv class=\"chk\">\u003c/div>\u003c/section>\n\u003c/main>\n\u003cfooter>أحسنت! 🌟 ثلاث عشرة حرفًا الآن، وكل درس يقرّبك من القراءة.\u003c/footer>\n\u003cscript>\nfunction mk(id,D){var el=document.getElementById(id);D.forEach(function(q,i){var d=document.createElement(\"div\");d.className=\

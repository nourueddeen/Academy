e:2.6rem;margin-top:6px;letter-spacing:10px\">بْ &nbsp; بَّ\u003c/div>\n\u003cdiv class=\"tags\">\u003cspan>⏱ 45–60 دقيقة\u003c/span>\u003cspan>🔤 العلامات\u003c/span>\u003cspan>🗣 النطق\u003c/span>\u003cspan>📖 القراءة\u003c/span>\u003c/div>\n\u003c/header>\n\u003cmain>\n\u003csection class=\"s1\">\u003ch2>\u003ci>1\u003c/i>\u003cspan>أهداف الدرس\u003cspan class=\"e\">Learning Objectives\u003c/span>\u003c/span>\u003c/h2>\n\u003cp>بنهاية هذا الدرس ستستطيع أن:\u003cspan class=\"e\">By the end of this lesson you will be able to:\u003c/span>\u003c/p>\u003cul>\u003cli>تتعرف على علامة السكون (ْ) وتميزها ✔️\u003cspan class=\"e\">Recognize the sukūn sign (ْ)\u003c/span>\u003c/li>\u003cli>تقرأ الحرف الساكن قراءة صحيحة 🗣\u003cspan class=\"e\">Read a silent (sukūn) letter correctly\u003c/span>\u003c/li>\u003cli>تتعرف على علامة الشدة (ّ) وتميزها ✔️\u003cspan class=\"e\">Recognize the shaddah sign (ّ)\u003c/span>\u003c/li>\u003cli>تفهم أن الحرف المشدد = حرفان متماثلان 🔁\u003cspan class=\"e\">Understand that a doubled letter = two identical letters\u003c/span>\u003c/li>\u003cli>تقرأ كلمات فيها سكون وشدة 📖\u003cspan class=\"e\">Read words with sukūn and shaddah\u003c/span>\u003c/li>\u003cli>تميّز بين المتحرك والساكن والمشدد 👀\u003cspan class=\"e\">Tell moving, silent and doubled letters apart\u003c/span>\u003c/li>\u003cli>تقرأ كلمات وجملًا قصيرة تجمع هذه العلامات 🌟\u003cspan class=\"e\">Read short words and sentences combining these signs\u003c/span>\u003c/li>\u003c/ul>\u003c/section>\n\n\u003csection class=\"s2\">\u003ch2>\u003ci>2\u003c/i>\u003cspan>مراجعة سريعة\u003cspan class=\"e\">Quick Review\u003c/span>\u003c/span>\u003c/h2>\n\u003cp>تذكّر الحركات القصيرة:\u003cspan class=\"e\">Remember the short vowels:\u003c/span>\u003c/p>\u003cdiv class=\"wrap\">\u003ctable>\u003ctr>\u003cth>الحركة · Vowel\u003c/th>\u003cth>الصوت · Sound\u003c/th>\u003cth>المثال · Example\u003c/th>\u003c/tr>\u003ctr>\u003ctd class=\"ar\">الفتحة ـَ\u003c/td>\u003ctd>a\u003c/td>\u003ctd>بَ\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"ar\">الكسرة ـِ\u003c/td>\u003ctd>i\u003c/td>\u003ctd>بِ\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"ar\">الضمة ـُ\u003c/td>\u003ctd>u\u003c/td>\u003ctd>بُ\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cdiv class=\"box tip\">\u003cb>✅ تذكير · Reminder\u003c/b>الحرف المتحرك هو الحرف الذي يحمل فتحة أو كسرة أو ضمة. واليوم نتعلم علامتين جديدتين: \u003cb>السكون\u003c/b> و\u003cb>الشدة\u003c/b>.\u003cspan class=\"e\">A “moving” letter carries a fatha, kasra or damma. Today we learn two new signs: sukūn and shaddah.\u003c/span>\u003c/div>\u003c/section>\n\n\u003csection class=\"s3\">\u003ch2>\u003ci>3\u003c/i>\u003cspan>الجزء الأول: السكون (ْ)\u003cspan class=\"e\">Part 1: Sukūn\u003c/span>\u003c/span>\u003c/h2>\n\u003cp>\u003cb>السكون\u003c/b> علامة توضع فوق الحرف، وتدل على أن الحرف \u003cb>ليس عليه فتحة ولا كسرة ولا ضمة\u003c/b>. شكلها: \u003cspan class=\"ar\" style=\"font-size:2rem\">ـْ\u003c/span>\u003cspan class=\"e\">Sukūn is a sign above a letter meaning it has no short vowel.\u003c/span>\u003c/p>\u003cdiv class=\"wrap\">\u003ctable>\u003ctr>\u003cth>الحرف\u003c/th>\u003cth>النطق · Sound\u003c/th>\u003c/tr>\u003ctr>\u003ctd class=\"ar\">أَ\u003c/td>\u003ctd>a\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"ar\">أْ\u003c/td>\u003ctd>لا حركة بعد الهمزة · no vowel\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"ar\">بَ\u003c/td>\u003ctd>ba\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"ar\">بْ\u003c/td>\u003ctd>لا حركة بعد الباء · no vowel\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"ar\">مِ\u003c/td>\u003ctd>mi\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"ar\">مْ\u003c/td>\u003ctd>لا حركة بعد الميم · no vowel\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cdiv class=\"box note\">\u003cb>⚠️ مهم · Important\u003c/b>الحرف الساكن لا يُنطق وحده عادةً، بل يُنطق \u003cb>متصلًا بالحرف المتحرك الذي قبله\u003c/b>.\u003cspan class=\"e\">A silent letter is normally not pronounced alone; it joins the moving letter before it.\u003c/span>\u003c/div>\u003c/section>\n\n\u003csection class=\"s4\">\u003ch2>\u003ci>4\u003c/i>\u003cspan>كيف نقرأ الحرف الساكن؟\u003cspan class=\"e\">How Do We Read a Silent Letter?\u003c/span>\u003c/span>\u003c/h2>\n\u003cp>ننطق الحركة على الحرف الأول، ثم نصل به الحرف الساكن دون إضافة حركة:\u003cspan class=\"e\">Say the vowel on the first letter, then attach the silent letter with no new vowel:\u003c/span>\u003c/p>\u003cdiv class=\"eqn\">\u003cspan class=\"pc o\">أَ\u003c/span> + \u003cspan class=\"pc b\">بْ\u003c/span> = \u003cspan class=\"pc g\">أَبْ\u003c/span>\u003c/div>\u003cdiv class=\"eqn\">\u003cspan class=\"pc o\">مِ\u003c/span> + \u003cspan class=\"pc b\">نْ\u003c/span> = \u003cspan class=\"pc g\">مِنْ\u003c/span>\u003c/div>\u003cdiv class=\"eqn\">\u003cspan class=\"pc o\">هَ\u003c/span> + \u003cspan class=\"pc b\">لْ\u003c/span> = \u003cspan class=\"pc g\">هَلْ\u003c/span>\u003c/div>\u003cdiv class=\"eqn\">\u003cspan class=\"pc o\">قُ\u003c/span> + \u003cspan class=\"pc b\">لْ\u003c/span> = \u003cspan class=\"pc g\">قُلْ\u003c/span>\u003c/div>\u003cdiv class=\"wrap\">\u003ctable>\u003ctr>\u003cth>الكلمة\u003c/th>\u003cth>طريقة القراءة\u003c/th>\u003c/tr>\u003ctr>\u003ctd class=\"ar\">أَمْ\u003c/td>\u003ctd>أَ + مْ\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"ar\">عَنْ\u003c/td>\u003ctd>عَ + نْ\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"ar\">كَمْ\u003c/td>\u003ctd>كَ + مْ\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"ar\">لَمْ\u003c/td>\u003ctd>لَ + مْ\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003c/section>\n\n\u003csection class=\"s5\">\u003ch2>\u003ci>5\u003c/i>\u003cspan>كلمات تحتوي على السكون\u003cspan class=\"e\">Words with Sukūn\u003c/span>\u003c/span>\u003c/h2>\n\u003cp>اقرأ الكلمات ببطء:\u003cspan class=\"e\">Read the words slowly:\u003c/span>\u003c/p>\u003cdiv class=\"dots\">\u003cdiv class=\"c1 lc\" style=\"display:block;text-align:center\">\u003cdiv style=\"font-size:2.6rem\">👧\u003c/div>\u003cdiv class=\"ar\" style=\"font-size:1.6rem\">بِنْت\u003c/div>\u003cspan class=\"e\" style=\"text-align:center\">Girl\u003c/span>\u003c/div>\u003cdiv class=\"c2 lc\" style=\"display:block;text-align:center\">\u003cdiv style=\"font-size:2.6rem\">☀️\u003c/div>\u003cdiv class=\"ar\" style=\"font-size:1.6rem\">شَمْس\u003c/div>\u003cspan class=\"e\" style=\"text-align:center\">Sun\u003c/span>\u003c/div>\u003cdiv class=\"c3 lc\" style=\"display:block;text-align:center\">\u003cdiv style=\"font-size:2.6rem\">⭐\u003c/div>\u003cdiv class=\"ar\" style=\"font-size:1.6rem\">نَجْم\u003c/div>\u003cspan class=\"e\" style=\"text-align:center\">Star\u003c/span>\u003c/div>\u003cdiv class=\"c4 lc\" style=\"display:block;text-align:center\">\u003cdiv style=\"font-size:2.6rem\">🐕\u003c/div>\u003cdiv class=\"ar\" style=\"font-size:1.6rem\">كَلْب\u003c/div>\u003cspan class=\"e\" style=\"text-align:center\">Dog\u003c/span>\u003c/div>\u003cdiv class=\"c5 lc\" style=\"display:block;text-align:center\">\u003cdiv style=\"font-size:2.6rem\">🌊\u003c/div>\u003cdiv class=\"ar\" style=\"font-size:1.6rem\">بَحْر\u003c/div>\u003cspan class=\"e\" style=\"text-align:center\">Sea\u003c/span>\u003c/div>\u003cdiv class=\"c6 lc\" style=\"display:block;text-align:center\">\u003cdiv style=\"font-size:2.6rem\">💼\u003c/div>\u003cdiv class=\"ar\" style=\"font-size:1.6rem\">مَكْتَب\u003c/div>\u003cspan class=\"e\" style=\"text-align:center\">Desk / Office\u003c/span>\u003c/div>\u003cdiv class=\"c1 lc\" style=\"display:block;text-align:center\">\u003cdiv style=\"font-size:2.6rem\">🕌\u003c/div>\u003cdiv class=\"ar\" style=\"font-size:1.6rem\">مَسْجِد\u003c/div>\u003cspan class=\"e\" style=\"text-align:center\">Mosque\u003c/span>\u003c/div>\u003cdiv class=\"c2 lc\" style=\"display:block;text-align:center\">\u003cdiv style=\"font-size:2.6rem\">🏫\u003c/div>\u003cdiv class=\"ar\" style=\"font-size:1.6rem\">مَدْرَسَة\u003c/div>\u003cspan class=\"e\" style=\"text-align:center\">School\u003c/span>\u003c/div>\u003c/div>\u003ch3>✍ تدريب على السكون\u003cspan class=\"e\">Sukūn Practice\u003c/span>\u003c/h3>\u003cp>اقرأ ثم حدد الحرف الساكن:\u003cspan class=\"e\">Read, then find the silent letter:\u003c/span>\u003c/p>\u003col class=\"ar\" style=\"font-size:1.2rem\">\u003cli>بِنْت \u003cdetails>\u003csummary>👀\u003c/summary>\u003cb class=\"ar\">النون\u003c/b>\u003c/details>\u003c/li>\u003cli>شَمْس \u003cdetails>\u003csummary>👀\u003c/summary>\u003cb class=\"ar\">الميم\u003c/b>\u003c/details>\u003c/li>\u003cli>نَجْم \u003cdetails>\u003csummary>👀\u003c/summary>\u003cb class=\"ar\">الميم\u003c/b>\u003c/details>\u003c/li>\u003cli>كَلْب \u003cdetails>\u003csummary>👀\u003c/summary>\u003cb class=\"ar\">اللام\u003c/b>\u003c/details>\u003c/li>\u003cli>مَكْتَب \u003cdetails>\u003csummary>👀\u003c/summary>\u003cb class=\"ar\">الكاف\u003c/b>\u003c/details>\u003c/li>\u003c/ol>\u003c/section>\n\n\u003csection class=\"s6\">\u003ch2>\u003ci>6\u003c/i>\u003cspan>الجزء الثاني: الشدة (ّ)\u003cspan class=\"e\">Part 2: Shaddah\u003c/span>\u003c/span>\u003c/h2>\n\u003cp>\u003cb>الشدة\u003c/b> علامة فوق الحرف تدل على أنه يُنطق \u003cb>مشددًا\u003c/b>، أي كأنه حرفان متماثلان: الأول \u003cb>ساكن\u003c/b> والثاني \u003cb>متحرك\u003c/b>. شكلها: \u003cspan class=\"ar\" style=\"font-size:2rem\">ـّ\u003c/span>\u003cspan class=\"e\">Shaddah doubles a letter: it sounds like two identical letters, the first silent and the second moving.\u003c/span>\u003c/p>\u003cdiv class=\"eqn\">\u003cspan class=\"pc o\">بْ\u003c/span> + \u003cspan class=\"pc b\">بَ\u003c/span> = \u003cspan class=\"pc g\">بَّ\u003c/span>\u003c/div>\u003cdiv class=\"eqn\">\u003cspan class=\"pc o\">بْ\u003c/span> + \u003cspan class=\"pc b\">بِ\u003c/span> = \u003cspan class=\"pc g\">بِّ\u003c/span>\u003c/div>\u003cdiv class=\"eqn\">\u003cspan class=\"pc o\">بْ\u003c/span> + \u003cspan class=\"pc b\">بُ\u003c/span> = \u003cspan class=\"pc g\">بُّ\u003c/span>\u003c/div>\u003cdiv class=\"box tip\">\u003cb>💡 فكرة · Idea\u003c/b>الشدة ليست مجرد تكرار في الكتابة، بل تضعيف للحرف في النطق. ولا نكتب الحرف مرتين، فالشدة تكفي.\u003cspan class=\"e\">Shaddah is not just repetition in writing; it doubles the sound. We don’t write the letter twice; the shaddah does it.\u003c/span>\u003c/div>\u003c/section>\n\n\u003csection class=\"s1\">\u003ch2>\u003ci>7\u003c/i>\u003cspan>كيف نقرأ الحرف المشدد؟\u003cspan class=\"e\">How Do We Read a Doubled Letter?\u003c/span>\u003c/span>\u003c/h2>\n\u003cp>لا تنطق الحرف المشدد كحرف عادي، بل بنطق مضاعف \u003cb>متصل دون فصل\u003c/b> بين الجزأين:\u003cspan class=\"e\">Don’t say it as a normal letter: double it smoothly, with no pause between the two parts.\u003c/span>\u003c/p>\u003cdiv class=\"wrap\">\u003ctable>\u003ctr>\u003cth>الحرف المشدد\u003c/th>\u003cth>التحليل · Breakdown\u003c/th>\u003c/tr>\u003ctr>\u003ctd class=\"ar\">بَّ\u003c/td>\u003ctd>بْ + بَ\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"ar\">بِّ\u003c/td>\u003ctd>بْ + بِ\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"ar\">بُّ\u003c/td>\u003ctd>بْ + بُ\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"ar\">مَّ\u003c/td>\u003ctd>مْ + مَ\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"ar\">لِّ\u003c/td>\u003ctd>لْ + لِ\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003c/section>\n\n\u003csection class=\"s2\">\u003ch2>\u003ci>8\u003c/i>\u003cspan>كلمات تحتوي على الشدة\u003cspan class=\"e\">Words with Shaddah\u003c/span>\u003c/span>\u003c/h2>\n\u003cp>اقرأ الكلمات:\u003cspan class=\"e\">Read the words:\u003c/span>\u003c/p>\u003cdiv class=\"dots\">\u003cdiv class=\"c3 lc\" style=\"display:block;text-align:center\">\u003cdiv style=\"font-size:2.6rem\">👨‍🏫\u003c/div>\u003cdiv class=\"ar\" style=\"font-size:1.6rem\">مُعَلِّم\u003c/div>\u003cspan class=\"e\" style=\"text-align:center\">Teacher\u003c/span>\u003c/div>\u003cdiv class=\"c4 lc\" style=\"display:block;text-align:center\">\u003cdiv style=\"font-size:2.6rem\">🐱\u003c/div>\u003cdiv class=\"ar\" style=\"font-size:1.6rem\">قِطَّة\u003c/div>\u003cspan class=\"e\" style=\"text-align:center\">Cat\u003c/span>\u003c/div>\u003cdiv class=\"c5 lc\" style=\"display:block;text-align:center\">\u003cdiv style=\"font-size:2.6rem\">🍎\u003c/div>\u003cdiv class=\"ar\" style=\"font-size:1.6rem\">تُفَّاح\u003c/div>\u003cspan class=\"e\" style=\"text-align:center\">Apples\u003c/span>\u003c/div>\u003cdiv class=\"c6 lc\" style=\"display:block;text-align:center\">\u003cdiv style=\"font-size:2.6rem\">📖\u003c/div>\u003cdiv class=\"ar\" style=\"font-size:1.6rem\">عَلَّمَ\u003c/div>\u003cspan class=\"e\" style=\"text-align:center\">He taught\u003c/span>\u003c/div>\u003cdiv class=\"c1 lc\" style=\"display:block;text-align:center\">\u003cdiv style=\"font-size:2.6rem\">🚗\u003c/div>\u003cdiv class=\"ar\" style=\"font-size:1.6rem\">سَيَّارَة\u003c/div>\u003cspan class=\"e\" style=\"text-align:center\">Car\u003c/span>\u003c/div>\u003cdiv class=\"c2 lc\" style=\"display:block;text-align:center\">\u003cdiv style=\"font-size:2.6rem\">👵\u003c/div>\u003cdiv class=\"ar\" style=\"font-size:1.6rem\">جَدَّة\u003c/div>\u003cspan class=\"e\" style=\"text-align:center\">Grandmother\u003c/span>\u003c/div>\u003cdiv class=\"c3 lc\" style=\"display:block;text-align:center\">\u003cdiv style=\"font-size:2.6rem\">🧑‍🏫\u003c/div>\u003cdiv class=\"ar\" style=\"font-size:1.6rem\">مُدَرِّس\u003c/div>\u003cspan class=\"e\" style=\"text-align:center\">Teacher\u003c/span>\u003c/div>\u003cdiv class=\"c4 lc\" style=\"display:block;text-align:center\">\u003cdiv style=\"font-size:2.6rem\">🕋\u003c/div>\u003cdiv class=\"ar\" style=\"font-size:1.6rem\">مَكَّة\u003c/div>\u003cspan class=\"e\" style=\"text-align:center\">Makkah\u003c/span>\u003c/div>\u003c/div>\u003ch3>🔎 كيف نحلل الكلمة؟\u003cspan class=\"e\">How do we analyze a word?\u003c/span>\u003c/h3>\u003cdiv class=\"wrap\">\u003ctable>\u003ctr>\u003cth>الكلمة\u003c/th>\u003cth>الحرف المشدد\u003c/th>\u003cth>التحليل\u003c/th>\u003c/tr>\u003ctr>\u003ctd class=\"ar\">مُعَلِّم\u003c/td>\u003ctd>اللام (لِّ)\u003c/td>\u003ctd>لْ + لِ\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"ar\">قِطَّة\u003c/td>\u003ctd>الطاء (طَّ)\u003c/td>\u003ctd>طْ + طَ\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"ar\">عَلَّمَ\u003c/td>\u003ctd>اللام (لَّ)\u003c/td>\u003ctd>لْ + لَ\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003c/section>\n\n\u003csection class=\"s3\">\u003ch2>\u003ci>9\u003c/i>\u003cspan>الجزء الثالث: الفرق بين السكون والشدة\u003cspan class=\"e\">Part 3: Sukūn vs. Shaddah\u003c/span>\u003c/span>\u003c/h2>\n\u003cp>هذا الجزء مهم جدًا لفهم العلاقة بين العلامتين:\u003cspan class=\"e\">This part is key to understanding how the two signs relate:\u003c/span>\u003c/p>\u003cdiv class=\"wrap\">\u003ctable>\u003ctr>\u003cth>المقارنة\u003c/th>\u003cth>السكون (ْ)\u003c/th>\u003cth>الشدة (ّ)\u003c/th>\u003c/tr>\u003ctr>\u003ctd class=\"ar\">الشكل\u003c/td>\u003ctd>ـْ\u003c/td>\u003ctd>ـّ\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"ar\">المعنى\u003c/td>\u003ctd>الحرف بلا حركة قصيرة\u003c/td>\u003ctd>الحرف مضعّف\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"ar\">التكوين\u003c/td>\u003ctd>حرف واحد ساكن\u003c/td>\u003ctd>حرفان متماثلان\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"ar\">النطق\u003c/td>\u003ctd>يُوصل بما قبله\u003c/td>\u003ctd>يُنطق بتضعيف متصل\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"ar\">المثال\u003c/td>\u003ctd>مِنْ\u003c/td>\u003ctd>مُعَلِّم\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cdiv class=\"box tip\">\u003cb>🔗 العلاقة بينهما · The Link\u003c/b>الشدة تتكون من حرفين: الأول ساكن، والثاني متحرك. فالسكون جزء من تكوين الحرف المشدد.\u003cspan class=\"e\">Shaddah is made of two letters: the first silent, the second moving. So sukūn is part of a doubled letter.\u003c/span>\u003c/div>\u003c/section>\n\n\u003csection class=\"s4\">\u003ch2>\u003ci>10\u003c/i>\u003cspan>الجزء الرابع: مقارنة عملية\u003cspan class=\"e\">Part 4: Practical Comparison\u003c/span>\u003c/span>\u003c/h2>\n\u003cp>اقرأ ولاحظ الفرق:\u003cspan class=\"e\">Read and notice the difference:\u003c/span>\u003c/p>\u003cdiv class=\"wrap\">\u003ctable>\u003ctr>\u003cth>الكلمة\u003c/th>\u003cth>الملاحظة\u003c/th>\u003c/tr>\u003ctr>\u003ctd class=\"ar\">عَلِمَ\u003c/td>\u003ctd>اللام غير مشددة\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"ar\">عَلَّمَ\u003c/td>\u003ctd>اللام مشددة\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"ar\">دَرَسَ\u003c/td>\u003ctd>الراء غير مشددة\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"ar\">مُدَرِّس\u003c/td>\u003ctd>الراء مشددة\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"ar\">بِنْت\u003c/td>\u003ctd>النون ساكنة\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"ar\">جَدَّة\u003c/td>\u003ctd>الدال مشددة\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"ar\">مَكْتَب\u003c/td>\u003ctd>الكاف ساكنة\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"ar\">مَكَّة\u003c/td>\u003ctd>الكاف مشددة\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cdiv class=\"dots\">\u003cdiv class=\"c1 lc\" style=\"display:block;text-align:center\">\u003cdiv class=\"big\">عَلِمَ\u003c/div>عرف شيئًا\u003cspan class=\"e\" style=\"text-align:center\">He knew\u003c/span>\u003c/div>\u003cdiv class=\"c3 lc\" style=\"display:block;text-align:center\">\u003cdiv class=\"big\">عَلَّمَ\u003c/div>قام بتعليم شخص\u003cspan class=\"e\" style=\"text-align:center\">He taught\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"box note\">\u003cb>🎯 تذكّر · Remember\u003c/b>تغيير علامة الحرف قد يغيّر نطق الكلمة ومعناها.\u003cspan class=\"e\">Changing the sign on a letter can change the sound and the meaning.\u003c/span>\u003c/div>\u003c/section>\n\n\u003csection class=\"s5\">\u003ch2>\u003ci>11\u003c/i>\u003cspan>الجزء الخامس: القراءة والتطبيق\u003cspan class=\"e\">Part 5: Reading Practice\u003c/span>\u003c/span>\u003c/h2>\n\u003cp>\u003cb>السكون:\u003c/b>\u003c/p>\u003cdiv class=\"chips ar\" style=\"font-size:1.5rem\">\u003cspan>أَبْ\u003c/span>\u003cspan>أَمْ\u003c/span>\u003cspan>مِنْ\u003c/span>\u003cspan>عَنْ\u003c/span>\u003cspan>هَلْ\u003c/span>\u003cspan>قُلْ\u003c/span>\u003cspan>كَمْ\u003c/span>\u003cspan>لَمْ\u003c/span>\u003c/div>\u003cp>\u003cb>الشدة:\u003c/b>\u003c/p>\u003cdiv class=\"chips ar\" style=\"font-size:1.5rem\">\u003cspan>بَّ\u003c/span>\u003cspan>بِّ\u003c/span>\u003cspan>بُّ\u003c/span>\u003cspan>مَّ\u003c/span>\u003cspan>لِّ\u003c/span>\u003cspan>سَّ\u003c/span>\u003cspan>رُّ\u003c/span>\u003c/div>\u003cp class=\"e\">هذه المقاطع للتدريب على صوت الحرف المشدد وليست كلمات بالضرورة · These are practice sounds, not necessarily words.\u003c/p>\u003cp style=\"margin-top:10px\">\u003cb>الكلمات:\u003c/b>\u003c/p>\u003cdiv class=\"chips ar\" style=\"font-size:1.4rem\">\u003cspan>بِنْت\u003c/span>\u003cspan>شَمْس\u003c/span>\u003cspan>نَجْم\u003c/span>\u003cspan>كَلْب\u003c/span>\u003cspan>بَحْر\u003c/span>\u003cspan>مُعَلِّم\u003c/span>\u003cspan>قِطَّة\u003c/span>\u003cspan>تُفَّاح\u003c/span>\u003cspan>سَيَّارَة\u003c/span>\u003cspan>جَدَّة\u003c/span>\u003c/div>\u003cp style=\"margin-top:10px\">\u003cb>الجمل:\u003c/b>\u003cspan class=\"e\">Sentences:\u003c/span>\u003c/p>\u003cdiv class=\"dlg\">\u003cdiv class=\"m a\">\u003cdiv class=\"ar\">\u003cspan class=\"ic\">🐱\u003c/span>هَذِهِ قِطَّةٌ.\u003c/div>\u003csmall>This is a cat.\u003c/small>\u003c/div>\u003cdiv class=\"m l\">\u003cdiv class=\"ar\">\u003cspan class=\"ic\">🚗\u003c/span>هَذِهِ سَيَّارَةٌ.\u003c/div>\u003csmall>This is a car.\u003c/small>\u003c/div>\u003cdiv class=\"m a\">\u003cdiv class=\"ar\">\u003cspan class=\"ic\">👨‍🏫\u003c/span>هَذَا مُعَلِّمٌ.\u003c/div>\u003csmall>This is a teacher.\u003c/small>\u003c/div>\u003cdiv class=\"m l\">\u003cdiv class=\"ar\">\u003cspan class=\"ic\">☀️\u003c/span>الشَّمْسُ جَمِيلَةٌ.\u003c/div>\u003csmall>The sun is beautiful.\u003c/small>\u003c/div>\u003cdiv class=\"m a\">\u003cdiv class=\"ar\">\u003cspan class=\"ic\">🧑‍🏫\u003c/span>مُحَمَّدٌ مُدَرِّسٌ.\u003c/div>\u003csmall>Muhammad is a teacher.\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"box note\">\u003cb>📌 ملاحظة · Note\u003c/b>سترى علامات صغيرة في آخر بعض الكلمات (ـٌ ـةٌ). هي التنوين، وسنتعلمه في الدرس القادم.\u003cspan class=\"e\">You will see small marks at the end of some words (tanwīn). We learn them in the next lesson.\u003c/span>\u003c/div>\u003c/section>\n\n\u003csection class=\"s6\" id=\"quiz\">\u003ch2>\u003ci>12\u003c/i>\u003cspan>التدريبات\u003cspan class=\"e\">Exercises\u003c/span>\u003c/span>\u003c/h2>\n\u003ch3>التدريب الأول: اختر الإجابة الصحيحة\u003cspan class=\"e\">Exercise 1: Choose the correct answer\u003c/span>\u003c/h3>\u003cdiv id=\"mc1\">\u003cnoscript>\u003col class=\"ar\" style=\"font-size:1.1rem\">\u003cli>ما علامة السكون؟\u003cul>\u003cli>ـَ\u003c/li>\u003cli>ـْ\u003c/li>\u003cli>ـّ\u003c/li>\u003c/ul>\u003cdetails>\u003csummary>👀 الإجابة · Answer\u003c/summary>\u003cb>ـْ\u003c/b>\u003c/details>\u003c/li>\u003cli>ما علامة الشدة؟\u003cul>\u003cli>ـِ\u003c/li>\u003cli>ـُ\u003c/li>\u003cli>ـّ\u003c/li>\u003c/ul>\u003cdetails>\u003csummary>👀 الإجابة · Answer\u003c/summary>\u003cb>ـّ\u003c/b>\u003c/details>\u003c/li>\u003cli>الحرف المشدد يتكون من:\u003cul>\u003cli>حرفين متماثلين، الأول ساكن والثاني متحرك\u003c/li>\u003cli>حرفين مختلفين\u003c/li>\u003cli>حرف واحد متحرك\u003c/li>\u003c/ul>\u003cdetails>\u003csummary>👀 الإجابة · Answer\u003c/summary>\u003cb>حرفين متماثلين، الأول ساكن والثاني متحرك\u003c/b>\u003c/details>\u003c/li>\u003cli>في كلمة (شَمْس)، الحرف الساكن هو:\u003cul>\u003cli>الشين\u003c/li>\u003cli>الميم\u003c/li>\u003cli>السين\u003c/li>\u003c/ul>\u003cdetails>\u003csummary>👀 الإجابة · Answer\u003c/summary>\u003cb>الميم\u003c/b>\u003c/details>\u003c/li>\u003cli>في كلمة (قِطَّة)، الحرف المشدد هو:\u003cul>\u003cli>القاف\u003c/li>\u003cli>الطاء\u003c/li>\u003cli>التاء\u003c/li>\u003c/ul>\u003cdetails>\u003csummary>👀 الإجابة · Answer\u003c/summary>\u003cb>الطاء\u003c/b>\u003c/details>\u003c/li>\u003c/ol>\u003c/noscript>\u003c/div>\u003ch3>التدريب الثاني: سكون أم شدة؟\u003cspan class=\"e\">Exercise 2: Sukūn or shaddah?\u003c/span>\u003c/h3>\u003cdiv id=\"mc2\">\u003cnoscript>\u003col class=\"ar\" style=\"font-size:1.1rem\">\u003cli>بِنْت\u003cul>\u003cli>سكون\u003c/li>\u003cli>شدة\u003c/li>\u003c/ul>\u003cdetails>\u003csummary>👀 الإجابة · Answer\u003c/summary>\u003cb>سكون\u003c/b>\u003c/details>\u003c/li>\u003cli>مُعَلِّم\u003cul>\u003cli>سكون\u003c/li>\u003cli>شدة\u003c/li>\u003c/ul>\u003cdetails>\u003csummary>👀 الإجابة · Answer\u003c/summary>\u003cb>شدة\u003c/b>\u003c/details>\u003c/li>\u003cli>شَمْس\u003cul>\u003cli>سكون\u003c/li>\u003cli>شدة\u003c/li>\u003c/ul>\u003cdetails>\u003csummary>👀 الإجابة · Answer\u003c/summary>\u003cb>سكون\u003c/b>\u003c/details>\u003c/li>\u003cli>قِطَّة\u003cul>\u003cli>سكون\u003c/li>\u003cli>شدة\u003c/li>\u003c/ul>\u003cdetails>\u003csummary>👀 الإجابة · Answer\u003c/summary>\u003cb>شدة\u003c/b>\u003c/details>\u003c/li>\u003cli>مَكْتَب\u003cul>\u003cli>سكون\u003c/li>\u003cli>شدة\u003c/li>\u003c/ul>\u003cdetails>\u003csummary>👀 الإجابة · Answer\u003c/summary>\u003cb>سكون\u003c/b>\u003c/details>\u003c/li>\u003cli>جَدَّة\u003cul>\u003cli>سكون\u003c/li>\u003cli>شدة\u003c/li>\u003c/ul>\u003cdetails>\u003csummary>👀 الإجابة · Answer\u003c/summary>\u003cb>شدة\u003c/b>\u003c/details>\u003c/li>\u003c/ol>\u003c/noscript>\u003c/div>\u003ch3>التدريب الثالث: حلل الحرف المشدد\u003cspan class=\"e\">Exercise 3: Break down the doubled letter\u003c/span>\u003c/h3>\u003cdiv id=\"mc3\">\u003cnoscript>\u003col class=\"ar\" style=\"font-size:1.1rem\">\u003cli>عَلَّمَ =\u003cul>\u003cli>لْ + لَ\u003c/li>\u003cli>لْ + مَ\u003c/li>\u003cli>عْ + لَ\u003c/li>\u003c/ul>\u003cdetails>\u003csummary>👀 الإجابة · Answer\u003c/summary>\u003cb>لْ + لَ\u003c/b>\u003c/details>\u003c/li>\u003cli>قِطَّة =\u003cul>\u003cli>قْ + طَ\u003c/li>\u003cli>طْ + طَ\u003c/li>\u003cli>طْ + تَ\u003c/li>\u003c/ul>\u003cdetails>\u003csummary>👀 الإجابة · Answer\u003c/summary>\u003cb>طْ + طَ\u003c/b>\u003c/details>\u003c/li>\u003cli>مُعَلِّم =\u003cul>\u003cli>مْ + لِ\u003c/li>\u003cli>عْ + لِ\u003c/li>\u003cli>لْ + لِ\u003c/li>\u003c/ul>\u003cdetails>\u003csummary>👀 الإجابة · Answer\u003c/summary>\u003cb>لْ + لِ\u003c/b>\u003c/details>\u003c/li>\u003cli>سَيَّارَة =\u003cul>\u003cli>يْ + يَ\u003c/li>\u003cli>سْ + يَ\u003c/li>\u003cli>رْ + رَ\u003c/li>\u003c/ul>\u003cdetails>\u003csummary>👀 الإجابة · Answer\u003c/summary>\u003cb>يْ + يَ\u003c/b>\u003c/details>\u003c/li>\u003c/ol>\u003c/noscript>\u003c/div>\u003ch3>التدريب الرابع: اقرأ ثم أجب\u003cspan class=\"e\">Exercise 4: Read, then answer\u003c/span>\u003c/h3>\u003cp class=\"ar\" style=\"font-size:1.5rem\">هَذَا مُعَلِّمٌ، وَهَذِهِ قِطَّةٌ.\u003c/p>\u003cdiv id=\"mc4\">\u003cnoscript>\u003col class=\"ar\" style=\"font-size:1.1rem\">\u003cli>كلمة تحتوي على شدة:\u003cul>\u003cli>هَذَا\u003c/li>\u003cli>مُعَلِّمٌ\u003c/li>\u003cli>وَ\u003c/li>\u003c/ul>\u003cdetails>\u003csummary>👀 الإجابة · Answer\u003c/summary>\u003cb>مُعَلِّمٌ\u003c/b>\u003c/details>\u003c/li>\u003cli>كلمة تحتوي على سكون ظاهر: (بِنْت – قِطَّة – مُعَلِّم)\u003cul>\u003cli>بِنْت\u003c/li>\u003cli>قِطَّة\u003c/li>\u003cli>مُعَلِّم\u003c/li>\u003c/ul>\u003cdetails>\u003csummary>👀 الإجابة · Answer\u003c/summary>\u003cb>بِنْت\u003c/b>\u003c/details>\u003c/li>\u003cli>كم حرفًا مشددًا في كلمة مُعَلِّم؟\u003cul>\u003cli>واحد\u003c/li>\u003cli>اثنان\u003c/li>\u003cli>ثلاثة\u003c/li>\u003c/ul>\u003cdetails>\u003csummary>👀 الإجابة · Answer\u003c/summary>\u003cb>واحد\u003c/b>\u003c/details>\u003c/li>\u003c/ol>\u003c/noscript>\u003c/div>\u003c/section>\n\n\u003csection class=\"s1\">\u003ch2>\u003ci>13\u003c/i>\u003cspan>الواجب المنزلي\u003cspan class=\"e\">Homework\u003c/span>\u003c/span>\u003c/h2>\n\u003col>\u003cli>اكتب خمس كلمات تحتوي على السكون\u003cspan class=\"e\">Write five words with sukūn\u003c/span>\u003c/li>\u003cli>اكتب خمس كلمات تحتوي على الشدة\u003cspan class=\"e\">Write five words with shaddah\u003c/span>\u003c/li>\u003cli>اقرأ الكلمات بصوت مرتفع وسجّل صوتك 🎙: \u003cspan class='ar'>بِنْت – شَمْس – نَجْم – كَلْب · مُعَلِّم – قِطَّة – سَيَّارَة – جَدَّة\u003c/span>\u003cspan class=\"e\">Read the words aloud and record yourself\u003c/span>\u003c/li>\u003cli>اكتب جملتين من إنشائك، في كل واحدة كلمة فيها شدة أو سكون\u003cspan class=\"e\">Write two sentences of your own, each with a word that has shaddah or sukūn\u003c/span>\u003c/li>\u003c/ol>\u003c/section>\n\n\u003csection class=\"s2\">\u003ch2>\u003ci>14\u003c/i>\u003cspan>معيار إتقان الدرس\u003cspan class=\"e\">Mastery Checklist\u003c/span>\u003c/span>\u003c/h2>\n\u003cp>اضغط لتحديد ما تستطيع فعله:\u003cspan class=\"e\">Tap to tick what you can do:\u003c/span>\u003c/p>\u003cdiv class=\"chk\">\u003cnoscript>\u003cul>\u003cli>☐ \u003cb>التمييز:\u003c/b> أميّز بين السكون والشدة\u003cspan class=\"e\">I tell sukūn and shaddah apart\u003c/span>\u003c/li>\u003cli>☐ \u003cb>التحديد:\u003c/b> أحدد الحروف الساكنة والمشددة في الكلمات\u003cspan class=\"e\">I find silent and doubled letters in words\u003c/span>\u003c/li>\u003cli>☐ \u003cb>القراءة:\u003c/b> أقرأ عشر كلمات متنوعة قراءة صحيحة\u003cspan class=\"e\">I read ten varied words correctly\u003c/span>\u003c/li>\u003cli>☐ \u003cb>الشرح:\u003c/b> أشرح أن الشدة = حرفان متماثلان، الأول ساكن والثاني متحرك\u003cspan class=\"e\">I can explain that shaddah = two identical letters, first silent, second moving\u003c/span>\u003c/li>\u003c/ul>\u003c/noscript>\u003c/div>\u003cdiv class=\"box tip\">\u003cb>⭐ تذكّر · Remember\u003c/b>القراءة الصحيحة تبدأ من فهم العلامات الصغيرة؛ فهي التي تضبط نطق الكلمات ومعانيها.\u003cspan class=\"e\">Correct reading starts with understanding the small signs; they control pronunciation and meaning.\u003c/span>\u003c/div>\u003c/section>\n\n\u003c/main>\n\u003cfooter>أحسنت! 🌟 صرتَ تقرأ الكلمات بعلاماتها الصغيرة.\u003c/footer>\n\u003cscript>function mk(id,D){var el=document.getElementById(id);D.forEach(function(q,i){var d=document.createElement(\"div\");d.className=\"q\";var p=document.createElement(\"p\");p.className=\"ar\";p.style.fontSize=\"1.2rem\";p.textContent=(i+1)+\". \"+q[0];d.appendChild(p);var o=document.createElement(\"div\");o.className=\"opts\";var fb=document.createElement(\"div\");fb.className=\"fb\";\nq[1].forEach(function(t,j){var b=document.createElement(\"button\");b.className=\"opt ar\";b.textContent=t;b.onclick=function(){if(d.datas pendChild(k);var b=document.createElement(\"b\");b.textContent=c[0]+\": \";l.appendChild(b);l.appendChild(document.createTextNode(c[1]));var e=document.createElement(\"span\");e.className=\"e\";e.textContent=c[2];l.appendChild(e);ce.appendChild(l)});\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}]}]},"st":{"tx":{"qi":{"en":"A distinctive methodology in teaching the Holy Quran","ar":""},"qm":{"en":"My approach to teaching the Qur’an is built around three interconnected steps to help students develop a correct, lasting, and meaningful relationship with the Qur’an:\n\n1. Correct Recitation (Tajweed)\n\nWe begin by learning to recite the Qur’an correctly, applying the rules of Tajweed, improving pronunciation, and giving each letter its proper articulation.\n\n2. Memorization (Hifz)\n\nThrough repeated recitation and guided practice during our lessons, the teacher and student recite the selected verses together several times. This builds familiarity with the verses and makes memorization at home easier and more effective.\n\n3. Understanding and Reflection (Tadabbur)\n\nLearning goes beyond recitation and memorization. We explore the meanings of the verses, their context and occasions of revelation where established, the main messages of each Surah, and the lessons and practical guidance we can take from them.\n\nThe goal is not simply to memorize the Qur’an, but to recite it correctly, understand its meanings, and benefit from its guidance in daily life.","ar":""},"why":{"en":"Learn with an Egyptian tutor educated at Al-Azhar Al-Sharif, holding an Ijazah in the Qur’an, with experience in teaching Arabic, Qur’an, and Islamic Studies both in person and online.\n\nHis experience as an Imam and Khateeb in Cairo mosques has further strengthened his Arabic language skills, eloquence, public speaking, and ability to communicate ideas clearly and effectively.\n\nCombining traditional Islamic education with a structured, engaging, and student-centered approach, he aims to make learning meaningful, accessible, and enjoyable for students from different backgrounds and levels.\n\nHaving learned English independently at home, he understands many of the challenges students face when learning a new language. This personal experience helps him relate to his students’ difficulties and approach language teaching with greater understanding and patience.\n\nHe also has practical knowledge of technology and computer applications, developed through independent learning and training courses, which he uses to create an effective, organized, and engaging online learning experience.\n\nBeyond established textbooks and learning resources, he develops his own teaching materials and structured lessons, drawing on his previous teaching experiences and observations of students’ needs and learning difficulties. These resources are carefully designed to simplify complex concepts, make lessons easier to understand, and help learners put their knowledge into practice.\n\nBuild your knowledge, deepen your understanding, and learn with confidence.","ar":""}},"ls":[{"id":"s_quran","t":"quran","en":"","ar":"","de":"","da":"","vid":"","pdf":""},{"id":"s_adab","t":"adab","en":"","ar":"","de":"","da":"","vid":"","pdf":""},{"id":"smwx9aede","t":"tafsir","pdf":"https://drive.google.com/file/d/15JwHvWm9AdYakl_3GcwhzucpQAFPXpXS/view?usp=drive_link","html":"","en":"تفسير سور (الإخلاص، الفلق، الناس)","ar":"","de":"ملف مراجعة موجز يقوم الطالب بمراجعته، ويمكن للوالدين الاستفادة منه أيضًا، لكن الدرس الحضوري أكثر شمولاً وأوسع نطاقًا وأكثر ثباتًا وأكثر تأثيرًا.","da":"","vid":""},{"id":"smwx9ptum","t":"hadith","pdf":"https://drive.google.com/file/d/1LEBnmEV922pInIJPV5_HrEQHn0T9D5ue/view?usp=drive_link","html":"","en":"The Five Pillers of Islam","ar":"","de":"A brief review file that the student reviews, and the parent can also benefit from it, but the in-person lesson is more comprehensive, broader, more proven, and more impactful.","da":"","vid":""},{"id":"smwx9x2ax","t":"hadith" function studyPage(id){const T=TRK[id],n=shown(id).length;return `<section><div class="wrap">${cr(lnk('islamic','Islamic Studies','الدراسات الإسلامية'),`<span>${T.en}</span>`)}${banner()}<div class="k">Islamic Studies</div>${head(T.en,T.ar)}<p style="max-width:720px;margin-top:0">${T.de}<span class="ar" lang="ar">${T.da}</span></p>${S.edit||n?`<h3 class="sech">Lessons<span class="ar" lang="ar">الدروس</span></h3>${lgrid(id)}`:SOON}</div></section>`}
function slPage(l){const T=TRK[l.t],q=l.t==='quran',bh=q?'quran':'study-'+l.t,ed=S.edit;const b=[];if(l.html)b.push(`<button class="btn" onclick="openSL('${l.id}')">Open Lesson<span class="ar">افتح الدرس</span></button>`);if(l.pdf)b.push(/^data:/.test(l.pdf)?`<button class="btn l" onclick="openPdf('${l.id}')">Open PDF<span class="ar">افتح ملف PDF</span></button>`:`<a class="btn l" style="text-decoration:none;display:inline-block" href="${esc(l.pdf)}" target="_blank" rel="noopener">Open PDF<span class="ar">افتح ملف PDF</span></a>`);return `<section><div class="wrap">${cr(...(q?[lnk('quran',T.en,T.ar)]:[lnk('islamic','Islamic Studies','الدراسات الإسلامية'),lnk(bh,T.en,T.ar)]),'<span>Lesson</span>')}${banner()}<h2>${esc(l.en||'Sample Lesson')}</h2><span class="ar sub" lang="ar">${esc(l.ar||'درس نموذجي')}</span>${l.de||l.da?`<div class="tb"><div class="bio2"><div dir="ltr">${paras(l.de)}</div><div dir="rtl" lang="ar">${paras(l.da,1)}</div></div></div>`:''}${ed||l.vid?`<div style="max-width:820px;margin-top:14px">${vbox(l.vid)}</div>`:''}${b.length?`<h3 class="sech">Lesson materials<span class="ar" lang="ar">مواد الدرس</span></h3><div class="cta" style="margin-top:0">${b.join('')}</div>`:ed?`<div class="empty" style="max-width:820px;margin-top:14px">Add a video link, a PDF or an HTML file using Edit.<span class="ar" lang="ar" style="text-align:center">أضف رابط فيديو أو ملف PDF أو HTML من زر تعديل.</span></div>`:''}<div class="cta"><button class="btn l" onclick="go('${bh}')">← Back to ${T.en}<span class="ar">رجوع إلى ${T.ar}</span></button><button class="btn" onclick="goTo('contact')">Contact / Book a Lesson<span class="ar">تواصل / احجز درسًا</span></button></div>${ed?`<p><button class="btn l sm" onclick="lsForm('${l.id}')">Edit lesson<span class="ar">تعديل الدرس</span></button></p>`:''}</div></section>`}

function lsForm(id,t){const l=id?ST().ls.find(x=>x.id===id):{},ex=[l.pdf?'PDF':'',l.html?'HTML':''].filter(Boolean).join(' + '),rm=(i,n)=>`<label style="display:flex;gap:8px;align-items:center;font-size:14px;margin:0 0 8px"><input type="checkbox" id="${i}"> ${n}</label>`;modal(`<h3>${id?'Edit Lesson':'Add Lesson'}<span class="ar" lang="ar">${id?'تعديل الدرس':'إضافة درس'}</span></h3>${fld('se','Title in English','العنوان بالإنجليزية',l.en,'dir="ltr"')}${fld('sa','Title in Arabic','العنوان بالعربية',l.ar,'class="rtl"')}${fld('sde','Description in English','الوصف بالإنجليزية',l.de,'dir="ltr"')}${fld('sda','Description in Arabic','الوصف بالعربية',l.da,'class="rtl"')}${fld('sv','Video link (YouTube or .mp4)','رابط الفيديو (يوتيوب أو mp4)',l.vid,'dir="ltr" placeholder="https://"')}<div class="fld"><label>Upload a file: PDF or HTML${ex?' (current: '+ex+')':''}<span class="ar" lang="ar">ارفع ملف PDF أو HTML</span></label><input type="file" id="sf" accept=".pdf,.html,.htm"></div>${fld('sp','Or a PDF link (optional)','أو رابط PDF (اختياري)',l.pdf&&!/^data:/.test(l.pdf)?l.pdf:'','dir="ltr" placeholder="https://"')}${l.pdf?rm('rp','Remove current PDF · حذف ملف PDF الحالي'):''}${l.html?rm('rh','Remove current HTML lesson · حذف درس HTML الحالي'):''}${btns(`saveLs('${id||''}','${t||''}')`)}`)}
function saveLs(id,t){const ok=u=>/^https?:\/\//i.test(u)?u:'';const v={en:$('se').value.trim(),ar:$('sa').value.trim(),de:$('sde').value.trim(),da:$('sda').value.trim(),vid:ok($('sv').value.trim())},lk=ok($('sp').value.trim());if(lk)v.pdf=lk;const f=$('sf').files[0];const fin=p=>{if(id){const l=ST().ls.find(x=>x.id===id);Object.assign(l,v);if($('rp')&&$('rp').checked)l.pdf='';if($('rh')&&$('rh').checked)l.html='';Object.assign(l,p)}else ST().ls.push({id:'s'+Date.now().toString(36),t,pdf:'',html:'',...v,...p});save();closeModal();render()};if(!f)return fin({});if(f.size>10485760)return toast('File is too large (max 10 MB)','الملف كبير جدًا (الحد الأقصى ١٠ ميجابايت)');const n=f.name.toLowerCase(),r=new FileReader();if(/\.pdf$/.test(n)){r.onload=()=>fin({pdf:r.result});r.readAsDataURL(f)}else if(/\.html?$/.test(n)){r.onload=()=>fin({html:r.result});r.readAsText(f)}else toast('Choose a PDF or HTML file','اختر ملف PDF أو HTML')}

function uniqIds(Lv){const seen=new Set();for(const c in Lv)Lv[c].forEach(u=>{let id=u.id;if(seen.has(id)){id=c.toLowerCase()+u.id;let k=2;while(seen.has(id))id=c.toLowerCase()+u.id+'x'+k++;u.id=id}seen.add(u.id)})}
const pill=c=>FREE.includes(c)?'<span class="free">Free preview · مجاني</span>':OK(c)?'':'<span class="free lk">🔒 Locked · مقفل</span>';
function route(){const h=location.hash.slice(1).split('-');if(h[0]==='level'&&h[1]&&lvl(h[1].toUpperCase())){const c=h[1].toUpperCase();return OK(c)?{v:'level',c}:{v:'lock',c}}if(h[0]==='unit'){const[c,u]=findUnit(h[1]);if(u&&OK(c))return{v:'unit',c,u};if(!UNL)return{v:'lock'}}if(['arabic','quran','islamic'].includes(h[0]))return{v:h[0]};if(h[0]==='study'&&TRK[h[1]])return{v:'study',t:h[1]};if(h[0]==='slesson'){const l=ST().ls.find(x=>x.id===h[1]);if(l)return{v:'slesson',l}}return{v:'home'}}

async function unlockLevels(pw,auto){if(!pw||!ENC)return;const b=$('lkb');if(b)b.disabled=true;let L=null;try{L=await decryptState(pw,ENC)}catch(e){}
if(!L){if(b)b.disabled=false;if(auto){try{localStorage.removeItem('awnd-pw')}catch(x){}}else if($('lke')){$('lke').innerHTML=bi('Wrong password. Try again.','كلمة المرور غير صحيحة. حاول مرة أخرى.');$('lkp').select()}return}
try{const r=$('lkr');if(auto||(r&&r.checked))localStorage.setItem('awnd-pw',pw)}catch(x){}
LV.forEach(v=>{if(!L[v[0]])L[v[0]]=[]});FREE.forEach(c=>{if(D.levels[c].length||!L[c].length)L[c]=D.levels[c]});uniqIds(L);D.levels=L;UNL=true;SITEPW=pw;render()}
function tryAuto(){if(AUTOTRIED){const e=$('lkp');e&&e.focus();return}AUTOTRIED=true;let s='';try{s=localStorage.getItem('awnd-pw')||''}catch(e){}if(s)unlockLevels(s,true);else{const e=$('lkp');e&&e.focus()}}
function copyLink(){const done=()=>toast('Link copied','تم نسخ الرابط');const i=$('shu');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(SHARE_URL).then(done,()=>{i.select();document.execCommand('copy');done()})}else{i.select();document.execCommand('copy');done()}}
function shareModal(){const u=encodeURIComponent(SHARE_URL),t=encodeURIComponent(SHARE_AR+'\n'+SHARE_EN);const L='class="btn l" style="text-decoration:none" target="_blank" rel="noopener"';modal(`<h3>Share this site<span class="ar" lang="ar">شارك الموقع</span></h3><p style="font-size:14px;margin-top:0">Invite other students to learn with Nour El-Din.<span class="ar" lang="ar">ادعُ طلابًا آخرين للتعلّم مع نور الدين.</span></p><div class="fld"><input id="shu" readonly dir="ltr" value="${SHARE_URL}" onclick="this.select()"></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="copyLink()">Copy link<span class="ar">نسخ الرابط</span></button><a ${L} href="https://wa.me/?text=${t}%20${u}">WhatsApp<span class="ar">واتساب</span></a><a ${L} href="https://t.me/share/url?url=${u}&text=${t}">Telegram<span class="ar">تيليجرام</span></a><a ${L} href="https://www.facebook.com/sharer/sharer.php?u=${u}">Facebook<span class="ar">فيسبوك</span></a><button class="btn l" onclick="closeModal()">Close<span class="ar">إغلاق</span></button></div>`)}
async function shareSite(){const d={title:'Nour El-Din Academy',text:SHARE_AR+'\n'+SHARE_EN,url:SHARE_URL};if(navigator.share){try{await navigator.share(d);return}catch(e){if(e&&e.name==='AbortError')return}}shareModal()}
const banner=()=>S.edit?`<div class="banner">Edit mode is on: add units, lessons and your details.<span class="ar" lang="ar">وضع التحرير مفعّل: أضف الوحدات والدروس وبياناتك.</span><button class="btn dk sm" style="margin-top:8px" onclick="dlSite()">Download updated site<span class="ar" lang="ar">تنزيل الموقع المحدّث</span></button></div>`:'';
const photoH=()=>`<div class="photo ${S.edit?'ed':''}" ${S.edit?'onclick="$(\'pf\').click()"':''}>${photo?`<img src="${photo}" alt="Nour El-Din">`:'ن'}</div>`;
function home(){return `<div class="hero" id="top"><div class="wrap"><div><div class="eyebrow">Learn with Confidence.<span class="ar" lang="ar">تعلّم بثقة.</span></div><h1>Nour El-Din Academy</h1><span class="ar" lang="ar">أكاديمية نور الدين</span><div class="secs"><span>Arabic Language<i lang="ar">اللغة العربية</i></span><span>Qur’an Studies<i lang="ar">القرآن الكريم</i></span><span>Islamic Studies<i lang="ar">الدراسات الإسلامية</i></span></div><p>Structured lessons. Real progress. Knowledge that lasts.<span class="ar" lang="ar">دروس منظّمة. تقدّم حقيقي. علم يدوم.</span></p><div class="cta"><button class="btn" onclick="goTo('programs')">Explore Programs<span class="ar">استكشف البرامج</span></button><button class="btn w" onclick="goTo('about')">Meet Your Teacher<span class="ar">تعرّف على معلّمك</span></button></div></div>${photoH()}</div></div>
<section class="alt" id="about"><div class="wrap">${banner()}<div class="about"><div>${photoH()}<div class="k">About the Teacher</div><h2>Meet Nour El-Din</h2><span class="ar sub" lang="ar">تعرّف على نور الدين</span></div><a class="vid" href="https://youtu.be/YbnPb3fZeZI" target="_blank" rel="noopener"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="#10B981"/><path d="M26 20v24l20-12z" fill="#102C2A"/></svg><b>Watch my introduction</b><span class="ar" lang="ar">شاهد فيديو التعريف بالمعلم</span><small>Opens on YouTube · يُفتح على يوتيوب</small></a></div><div class="bio"><div dir="ltr" lang="en">${paras(D.bio.en)}</div><div dir="rtl" lang="ar">${paras(D.bio.ar,1)}</div></div><div class="ytrow"><a class="btn" href="https://youtube.com/@noureddin2025" target="_blank" rel="noopener">My YouTube Channel ↗<span class="ar" lang="ar">قناتي على يوتيوب</span></a><div class="ytnote">Useful religious and Islamic topics in Modern Standard Arabic<span class="ar" lang="ar">مواضيع دينية وشرعية مفيدة باللغة العربية الفصحى</span></div></div>${S.edit?'<p style="margin-top:14px"><button class="btn l sm" onclick="bioForm()">Edit bio<span class="ar">تعديل النبذة</span></button></p>':''}</div></section>
<section id="programs"><div class="wrap"><div class="k">Learning Programs</div><h2>Explore Our Learning Programs</h2><span class="ar sub" lang="ar">استكشف برامجنا التعليمية</span><div class="grid"><div class="card t" style="--ac:#10B981" onclick="go('arabic')"><div class="ico"><svg viewBox="0 0 24 24"><path d="M12 6v14M12 6C10 4.5 7 4 4 4v14c3 0 6 .5 8 2 2-1.5 5-2 8-2V4c-3 0-6 .5-8 2z"/></svg></div><h3>Arabic Language</h3><span class="ar" lang="ar">اللغة العربية</span><p>Seven levels from absolute beginner to advanced, with units, lessons and activities.<span class="ar" lang="ar">سبعة مستويات من المبتدئ تمامًا إلى المتقدم، مع وحدات ودروس وأنشطة.</span></p><div class="cardacts"><button class="btn sm">Explore<span class="ar">استكشف</span></button></div></div><div class="card t" style="--ac:#C9A961" onclick="go('quran')"><div class="ico"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></div><h3>Qur’an Studies</h3><span class="ar" lang="ar">القرآن الكريم</span><p>Specialised Qur’an lessons with sample lessons and teaching videos.<span class="ar" lang="ar">دروس متخصصة في القرآن الكريم مع دروس نموذجية وفيديوهات تعليمية.</span></p><div class="cardacts"><button class="btn sm">Explore<span class="ar">استكشف</span></button></div></div><div class="card t" style="--ac:#4E9FB0" onclick="go('islamic')"><div class="ico"><svg viewBox="0 0 24 24"><path d="M3 9l9-5 9 5-9 5zM7 11.5V16c2.5 2 7.5 2 10 0v-4.5"/></svg></div><h3>Islamic Studies</h3><span class="ar" lang="ar">الدراسات الإسلامية</span><p>Hadith, Fiqh, Tafsir, Seerah, Aqeedah and Adab, each with its own lessons.<span class="ar" lang="ar">الحديث والفقه والتفسير والسيرة والعقيدة والآداب، ولكل تخصص دروسه.</span></p><div class="cardacts"><button class="btn sm">Explore<span class="ar">استكشف</span></button></div></div></div></div></section>
${S.edit||hasT('why')?`<section class="alt" id="why"><div class="wrap"><div class="k">Why Nour El-Din</div><h2>Why Learn with Nour El-Din?</h2><span class="ar sub" lang="ar">لماذا تتعلّم مع نور الدين؟</span>${txb('why')}</div></section>`:''}
<section class="contact" id="contact"><div class="wrap"><div class="k">Contact</div><h2>Book a Lesson or Say Hello</h2><span class="ar sub" lang="ar">احجز درسًا أو راسلنا</span><div class="cta" style="margin-top:0">${D.contact.book?`<a class="btn" style="text-decoration:none" target="_blank" rel="noopener" href="${esc(D.contact.book)}">Book a Lesson<span class="ar">احجز درسًا</span></a>`:''}${D.contact.wa?`<a class="btn w" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/${esc(D.contact.wa.replace(/\D/g,''))}">WhatsApp<span class="ar">واتساب</span></a>`:''}${D.contact.email?`<a class="btn w" style="text-decoration:none" href="mailto:${esc(D.contact.email)}">Email<span class="ar">البريد الإلكتروني</span></a>`:''}${S.edit?'<button class="btn w" onclick="contactForm()">Edit contact details<span class="ar">تعديل بيانات التواصل</span></button>':''}</div>${D.contact.wa||D.contact.email?`<div class="clines" dir="ltr">${D.contact.wa?`<span>WhatsApp: <b>${esc(fmtPhone(D.contact.wa))}</b></span>`:''}${D.contact.email?`<span>Email: <b>${esc(D.contact.email)}</b></span>`:''}</div>`:''}${!D.contact.book&&!D.contact.wa&&!D.contact.email&&!S.edit?'<p style="color:var(--sage)">Contact details will be added soon.<span class="ar" lang="ar">ستُضاف وسائل التواصل قريبًا.</span></p>':''}</div></section>`}
function setPhoto(f){if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=500;const s=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,500,500);photo=c.toDataURL('image/jpeg',.85);D.photo=photo;render();save()};im.src=URL.createObjectURL(f)}
function levelPage(c){const v=lvl(c),us=D.levels[c];return `<section><div class="wrap"><div class="crumb"><a onclick="go('')">Home</a>›<a onclick="go('arabic')">Arabic Language</a>›<span>Level ${c}</span><span class="ar" style="display:inline">· الرئيسية › المستوى ${c}</span></div>${banner()}<h2>Level ${c} · ${v[1]}</h2><span class="ar sub" lang="ar">المستوى ${c} · ${v[2]}</span><div class="grid">${us.map((u,i)=>`<div class="card" style="animation-delay:${i*50}ms" onclick="go('unit-${u.id}')"><div class="code">${u.n}</div><h3>Unit ${u.n}${u.en?' · '+esc(u.en):''}</h3><span class="ar" lang="ar">الوحدة ${AD(u.n)}${u.ar?' · '+esc(u.ar):''}</span><div class="meta">${cntFix(u.ls.length,'l')}</div>${S.edit?`<div class="cardacts" onclick="event.stopPropagation()"><button class="btn l sm" onclick="unitForm('${c}','${u.id}')">Edit<span class="ar">تعديل</span></button><button class="btn d sm" onclick="delUnit('${c}','${u.id}')">${S.pend==='u'+u.id?'Confirm delete<span class="ar">تأكيد الحذف</span>':'Delete<span class="ar">حذف</span>'}</button></div>`:''}</div>`).join('')}${S.edit?`<div class="card add" onclick="unitForm('${c}')"><div style="font-size:34px;line-height:1">＋</div>Add Unit<span class="ar" lang="ar" style="text-align:center">إضافة وحدة</span></div>`:''}</div></div></section>`}
function sorted(ls){return ls.slice().sort((a,b)=>String(a.num).localeCompare(String(b.num),undefined,{numeric:true}))}
function unitPage(c,u){const ls=sorted(u.ls);return `<section><div class="wrap"><div class="crumb"><a onclick="go('')">Home</a>›<a onclick="go('arabic')">Arabic Language</a>›<a onclick="go('level-${c.toLowerCase()}')">Level ${c}</a>›<span>Unit ${u.n}</span><span class="ar" style="display:inline">· الوحدة ${AD(u.n)}</span></div>${banner()}<h2>Level ${c} · Unit ${u.n}${u.en?' · '+esc(u.en):''}</h2><span class="ar sub" lang="ar">المستوى ${c} · الوحدة ${AD(u.n)}${u.ar?' · '+esc(u.ar):''}</span>${S.edit?`<p><button class="btn dk" onclick="lessonForm('${u.id}')">＋ Add Lesson<span class="ar">إضافة درس</span></button></p>`:''}${ls.length?ls.map((l,i)=>`<div class="lrow" style="animation-delay:${i*40}ms"><div class="lnum">${esc(l.num)}</div><div class="ltxt"><b>${esc(l.en||'Lesson '+l.num)}</b><span class="ar" lang="ar">${esc(l.ar||'الدرس '+l.num)}</span></div><div class="acts">${S.edit?`<button class="btn l sm" onclick="lessonForm('${u.id}','${l.id}')">Edit<span class="ar">تعديل</span></button><button class="btn d sm" onclick="delLesson('${u.id}','${l.id}')">${S.pend==='l'+l.id?'Confirm delete<span class="ar">تأكيد الحذف</span>':'Delete<span class="ar">حذف</span>'}</button>`:''}<button class="btn" onclick="openLesson('${u.id}','${l.id}')">Start Lesson<span class="ar">ابدأ الدرس</span></button></div></div>`).join(''):`<div class="empty">No lessons yet.<span class="ar" lang="ar" style="text-align:center">لا توجد دروس بعد.</span></div>`}</div></section>`}
function modal(h){$('mbox').innerHTML=h;$('modal').classList.add('on')}
function closeModal(){$('modal').classList.remove('on')}
const btns=f=>`<div style="display:flex;gap:8px"><button class="btn" onclick="${f}">Save<span class="ar">حفظ</span></button><button class="btn l" onclick="closeModal()">Cancel<span class="ar">إلغاء</span></button></div>`;
const fld=(id,en,ar,v,o='')=>`<div class="fld"><label>${en}<span class="ar" lang="ar">${ar}</span></label><input id="${id}" value="${esc(v)}" ${o}></div>`;
function unitForm(c,id){const u=id?D.levels[c].find(x=>x.id===id):null;modal(`<h3>${u?'Edit Unit':'Add Unit'}<span class="ar" lang="ar">${u?'تعديل الوحدة':'إضافة وحدة'}</span></h3><p style="font-size:14px;margin-top:0">${u?'Unit '+u.n:'The unit number is assigned automatically.'}<span class="ar" lang="ar">${u?'':'يُعطى رقم الوحدة تلقائيًا.'}</span></p>${fld('ue','Subtitle (optional)','عنوان فرعي (اختياري)',u&&u.en,'dir="ltr"')}${fld('ua','Arabic subtitle (optional)','العنوان بالعربية (اختياري)',u&&u.ar,'class="rtl"')}${btns(`saveUnit('${c}','${id||''}')`)}`)}
function saveUnit(c,id){const en=$('ue').value.trim(),ar=$('ua').value.trim();if(id){const u=D.levels[c].find(x=>x.id===id);u.en=en;u.ar=ar}else{const n=Math.max(0,...D.levels[c].map(u=>u.n))+1;D.levels[c].push({id:'u'+Date.now().toString(36),n,en,ar,ls:[]})}save();closeModal();render()}
function delUnit(c,id){if(S.pend==='u'+id){D.levels[c]=D.levels[c].filter(u=>u.id!==id);S.pend=null;save()}else S.pend='u'+id;render()}
function lessonForm(uid,lid){const[c,u]=findUnit(uid),l=lid?u.ls.find(x=>x.id===lid):null;modal(`<h3>${l?'Edit Lesson':'Add Lesson'}<span class="ar" lang="ar">${l?'تعديل الدرس':'إضافة درس'}</span></h3>${fld('ln','Lesson number','رقم الدرس',l&&l.num,'dir="ltr" placeholder="1"')}${fld('le','Title in English','العنوان بالإنجليزية',l&&l.en,'dir="ltr"')}${fld('la','Title in Arabic','العنوان بالعربية',l&&l.ar,'class="rtl"')}<div class="fld"><label>HTML file${l?' (leave empty to keep current)':''}<span class="ar" lang="ar">ملف HTML${l?' (اتركه فارغًا للإبقاء على الحالي)':''}</span></label><input type="file" id="lf" accept=".html,.htm"></div>${btns(`saveLesson('${uid}','${lid||''}')`)}`)}
function saveLesson(uid,lid){const[c,u]=findUnit(uid),num=$('ln').value.trim(),en=$('le').value.trim(),ar=$('la').value.trim(),f=$('lf').files[0];
if(!num)return toast('Enter the lesson number','أدخل رقم الدرس');
const fin=html=>{if(lid){const l=u.ls.find(x=>x.id===lid);Object.assign(l,{num,en,ar});if(html!=null)l.html=html}else u.ls.push({id:'l'+Date.now().toString(36),num,en,ar,html});save();closeModal();render()};
if(f){const r=new FileReader();r.onload=()=>fin(r.result);r.readAsText(f)}else if(lid)fin(null);else toast('Choose an HTML file','اختر ملف HTML')}
function delLesson(uid,lid){const[c,u]=findUnit(uid);if(S.pend==='l'+lid){u.ls=u.ls.filter(l=>l.id!==lid);S.pend=null;save()}else S.pend='l'+lid;render()}
function bioForm(){modal(`<h3>Teacher bio<span class="ar" lang="ar">نبذة عن المعلم</span></h3><div class="fld"><label>English<span class="ar" lang="ar">بالإنجليزية</span></label><textarea id="be" rows="9" dir="ltr">${esc(D.bio.en)}</textarea></div><div class="fld"><label>Arabic<span class="ar" lang="ar">بالعربية</span></label><textarea id="ba" rows="9" class="rtl">${esc(D.bio.ar)}</textarea></div>${btns('saveBio()')}`)}
function saveBio(){D.bio={en:$('be').value.trim(),ar:$('ba').value.trim()};save();closeModal();render()}
function contactForm(){const c=D.contact;modal(`<h3>Contact details<span class="ar" lang="ar">بيانات التواصل</span></h3>${fld('ce','Email','البريد الإلكتروني',c.email,'dir="ltr"')}${fld('cw','WhatsApp number (with country code)','رقم واتساب (مع رمز الدولة)',c.wa,'dir="ltr"')}${fld('cb','Booking link','رابط الحجز',c.book,'dir="ltr" placeholder="https://"')}${btns('saveContact()')}`)}
function saveContact(){const b=$('cb').value.trim();D.contact={email:$('ce').value.trim(),wa:$('cw').value.trim(),book:/^https?:\/\//i.test(b)?b:''};save();closeModal();render()}
function resForm(){modal(`<h3>Add Resource<span class="ar" lang="ar">إضافة مادة</span></h3>${fld('re','Title in English','العنوان بالإنجليزية','','dir="ltr"')}${fld('ra','Title in Arabic','العنوان بالعربية','','class="rtl"')}<div class="fld"><label>File (PDF, image or HTML)<span class="ar" lang="ar">الملف (PDF أو صورة أو HTML)</span></label><input type="file" id="rf" accept=".pdf,.html,.htm,image/*"></div>${btns('saveRes()')}`)}
function saveRes(){const f=$('rf').files[0];if(!f)return toast('Choose a file','اختر ملفًا');const r=new FileReader();r.onload=()=>{D.res.push({id:'r'+Date.now().toString(36),en:$('re').value.trim(),ar:$('ra').value.trim(),name:f.name,url:r.result});save();closeModal();render()};r.readAsDataURL(f)}
function delRes(id){if(S.pend==='r'+id){D.res=D.res.filter(r=>r.id!==id);S.pend=null;save()}else S.pend='r'+id;render()}
function openRes(id){const r=D.res.find(x=>x.id===id);S.list=[];$('vt').innerHTML=bi(r.en||r.name,r.ar);$('frame').removeAttribute('srcdoc');$('frame').src=r.url;$('viewer').classList.add('on')}
function openLesson(uid,lid){const[c,u]=findUnit(uid);S.list=sorted(u.ls);S.cur=lid;showV()}
function showV(){const l=S.list.find(x=>x.id===S.cur);$('vt').innerHTML=bi(l.en||'Lesson '+l.num,l.ar||'الدرس '+l.num);$('frame').removeAttribute('src');$('frame').srcdoc=l.html;$('viewer').classList.add('on')}
function closeViewer(){$('viewer').classList.remove('on');$('frame').removeAttribute('srcdoc');$('frame').removeAttribute('src')}
function step(d){const i=S.list.findIndex(x=>x.id===S.cur),n=S.list[i+d];if(n){S.cur=n.id;showV()}else toast('No more lessons','لا يوجد درس آخر')}
function fs(){const e=$('viewer');if(document.fullscreenElement)document.exitFullscreen();else if(e.requestFullscreen)e.requestFullscreen()}
if(LEGACY)gateStart();else render();
</script></body></html>

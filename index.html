<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Arabic with Nour El-Din</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><style id="app-style">
:root{--deep:#102C2A;--em:#10B981;--sage:#A7B8AD;--bg:#F5F5F0;--card:#fff;--ink:#172321;--muted:#5b6f67;--line:#dfe3dc;--head:#102C2A;--btnink:#06241f;--sh:0 2px 10px rgba(16,44,42,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1b1a;--card:#112826;--ink:#e6efea;--muted:#9db3a8;--line:#1f3b37;--head:#fff;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1b1a;--card:#112826;--ink:#e6efea;--muted:#9db3a8;--line:#1f3b37;--head:#fff;--sh:none;color-scheme:dark}
html{scroll-padding-top:calc(70px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.6}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:auto;padding:0 20px}
.ar{display:block;direction:rtl;text-align:right;font-family:"IBM Plex Sans Arabic",sans-serif;color:var(--muted);font-size:.9em;font-weight:400;line-height:1.7}
.c,.c .ar{text-align:center}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--deep);color:#fff}
nav .wrap{display:flex;align-items:center;gap:6px;min-height:66px;flex-wrap:wrap}
.logo{display:flex;gap:10px;align-items:center;cursor:pointer;margin-inline-end:auto;color:#fff;padding:6px 0}
.logo svg{width:38px;height:38px;flex:none}
.logo b{display:block;font-size:22px;font-weight:800;line-height:1;letter-spacing:-.02em}
.logo small{display:block;font-size:11px;font-weight:500;color:var(--sage);letter-spacing:.04em;margin-top:3px}
.nl{background:none;border:0;color:#d5e3dc;padding:8px 12px;cursor:pointer;font-weight:500;font-size:14px;border-radius:8px;text-align:center;line-height:1.25}
.nl:hover{color:#fff;background:rgba(255,255,255,.08)}
.nl .ar{color:var(--sage);font-size:.8em;text-align:center}
.btn{border:0;border-radius:12px;padding:10px 20px;font-weight:600;cursor:pointer;background:var(--em);color:var(--btnink);min-height:44px;transition:.2s;text-align:center;line-height:1.3}
.btn:hover{transform:translateY(-1px);filter:brightness(1.06)}
.btn .ar{color:inherit;opacity:.85;font-size:.8em;text-align:center}
.btn.dk{background:var(--deep);color:#fff}.btn.l{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.d{background:#b8433b;color:#fff}.btn.w{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.5)}
.btn.sm{padding:4px 12px;min-height:38px;font-size:14px}.btn.on{background:var(--em);color:var(--btnink)}
nav .btn.l{color:#fff;border-color:rgba(255,255,255,.3)}
.hero{background:var(--deep);color:#fff;padding:64px 0 76px;border-bottom:4px solid var(--em)}
.hero .wrap{display:grid;grid-template-columns:1.25fr 1fr;gap:40px;align-items:center}
.eyebrow{font-size:13px;font-weight:600;color:var(--em);letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px}
.eyebrow .ar{color:var(--em);font-size:14px;letter-spacing:0;text-transform:none;font-weight:600;margin-top:4px}
.hero h1{font-size:clamp(38px,6.4vw,68px);line-height:1.04;letter-spacing:-.035em;margin:0;font-weight:800}
.hero h1+.ar{font-size:clamp(22px,3.2vw,30px);font-weight:600;color:var(--em);margin:12px 0 16px}
.hero p{font-size:18px;color:#d5e3dc;max-width:480px;margin:0}.hero p .ar{color:var(--sage);font-size:.9em;margin-top:2px}
.cta{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
.photo{width:min(320px,100%);aspect-ratio:1;border-radius:50%;border:6px solid #fff;justify-self:center;background:#1c4a45;display:grid;place-items:center;font-size:110px;font-weight:700;color:var(--em);overflow:hidden;position:relative}
.photo img{width:100%;height:100%;object-fit:cover}
.photo.ed{cursor:pointer}.photo.ed:after{content:"Change photo · تغيير الصورة";position:absolute;inset:auto 0 0;background:rgba(0,0,0,.65);color:#fff;font-size:12px;padding:8px 0;font-weight:500;text-align:center}
section{padding:68px 0}
.alt{background:var(--card)}
.k{font-size:13px;font-weight:700;color:var(--em);letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}
h2{font-size:clamp(28px,4vw,40px);margin:0;color:var(--head);line-height:1.15;letter-spacing:-.025em;font-weight:800}
.sub{margin:4px 0 30px;font-size:1.05em}
.crumb{display:flex;gap:8px;flex-wrap:wrap;font-size:14px;margin-bottom:16px;color:var(--muted);align-items:center}
.crumb a{color:var(--head);cursor:pointer;font-weight:600;text-decoration:underline;text-decoration-color:var(--em);text-underline-offset:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:6px;position:relative;cursor:pointer;transition:.25s;animation:up .45s both}
.alt .card{background:var(--bg)}
.card:hover{transform:translateY(-3px);border-color:var(--em)}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.code{font-size:42px;font-weight:800;line-height:1;color:var(--em);letter-spacing:-.03em}
.card h3{margin:4px 0 0;font-size:18px;color:var(--head);line-height:1.3}
.card p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.meta{margin-top:auto;padding-top:14px;font-size:13px;font-weight:600;color:var(--head)}
.ico{width:46px;height:46px;border-radius:12px;background:var(--deep);display:grid;place-items:center;margin-bottom:8px}
.ico svg{width:24px;height:24px;stroke:var(--em);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.add{border:2px dashed var(--em);background:transparent!important;align-items:center;justify-content:center;text-align:center;min-height:150px;color:var(--head);font-weight:600}
.about{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.about .photo{width:150px;margin:0 0 18px;justify-self:start;border-color:var(--deep);font-size:90px}
.vid{aspect-ratio:16/9;max-width:100%;border-radius:16px;background:var(--deep);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;text-decoration:none;padding:20px;border:1px solid var(--line);box-shadow:0 8px 28px rgba(16,44,42,.18);transition:.25s}
.vid:hover{transform:translateY(-3px);border-color:var(--em)}
.vid svg{width:68px;height:68px;margin-bottom:6px}.vid b{font-size:20px}.vid .ar{color:var(--sage);text-align:center;font-size:1em}.vid small{font-size:12px;color:var(--sage);margin-top:4px}
.vcap{margin-top:12px;font-size:14px;font-weight:600;color:var(--head)}.vcap a{color:var(--head);text-decoration-color:var(--em);text-underline-offset:3px}
.about p{font-size:18px;margin:0 0 6px}
.bio{display:grid;grid-template-columns:1fr 1fr;gap:20px 48px;margin-top:36px;padding-top:28px;border-top:1px solid var(--line)}
.bio>div{min-width:0}.bio p{font-size:15px;line-height:1.75;margin:0 0 10px;color:var(--ink)}
.bio p.ar{display:block;font-size:15.5px;line-height:1.95;color:var(--ink);text-align:right;direction:rtl}
.ytrow{display:flex;gap:16px 24px;align-items:center;flex-wrap:wrap;margin-top:18px}
.ytrow .btn{text-decoration:none;display:inline-block}
.ytnote{font-size:14px;color:var(--muted);flex:1;min-width:220px}.ytnote .ar{font-size:1em}
.lrow{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;gap:16px;align-items:center;margin-bottom:12px;flex-wrap:wrap;animation:up .4s both}
.lnum{min-width:56px;height:56px;padding:0 10px;border-radius:14px;background:var(--deep);color:var(--em);display:grid;place-items:center;font-weight:800;font-size:20px}
.ltxt{flex:1;min-width:180px}.ltxt b{display:block;font-size:17px;color:var(--head)}.ltxt .ar{font-size:1em;color:var(--ink);font-weight:500}
.acts,.cardacts{display:flex;gap:6px;flex-wrap:wrap}.cardacts{margin-top:12px}
.empty{text-align:center;padding:40px 10px;color:var(--muted);border:2px dashed var(--line);border-radius:16px}
.banner{background:rgba(16,185,129,.12);border:1px solid var(--em);border-radius:12px;padding:8px 14px;margin-bottom:22px;font-size:14px}.banner .ar{color:inherit}
.contact{background:var(--deep);color:#fff}.contact h2{color:#fff}.contact .ar{color:var(--sage)}
.contact .cta .ar{color:inherit}
.clines{display:flex;gap:6px 28px;flex-wrap:wrap;margin:20px 0 0;color:var(--sage);font-size:15px;user-select:text}.clines b{color:#fff;font-weight:600;overflow-wrap:anywhere}
.modal{position:fixed;inset:0;background:rgba(5,20,18,.65);display:none;place-items:center;z-index:50;padding:18px}.modal.on{display:grid}
.box{background:var(--card);border-radius:20px;padding:24px;max-width:480px;width:100%;max-height:92vh;overflow:auto}.box h3{margin:0 0 14px;color:var(--head)}
.fld{margin-bottom:12px}.fld label{display:block;font-weight:600;font-size:14px;margin-bottom:4px}.fld label .ar{display:inline;margin-inline-start:6px}
.fld input,.fld textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:10px 14px;min-height:44px}
.fld .rtl{direction:rtl;text-align:right}
.viewer{position:fixed;inset:0;background:var(--bg);z-index:60;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}.viewer.on{display:flex}
.vbar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--deep);color:#fff;flex-wrap:wrap}
.vbar .t{margin-inline-end:auto;font-weight:600;line-height:1.3}.vbar .t .ar{color:var(--sage)}
.vbar .btn{background:rgba(255,255,255,.12);color:#fff}
iframe{flex:1;border:0;width:100%;background:#fff}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--deep);color:#fff;padding:10px 22px;border-radius:12px;z-index:80;display:none;text-align:center;border:1px solid var(--em)}.toast .ar{color:#fff;text-align:center}
footer{padding:26px 0;text-align:center;color:var(--muted);font-size:14px;background:var(--bg)}footer .ar{text-align:center}
@media(max-width:860px){.about{grid-template-columns:1fr;gap:28px}.bio{grid-template-columns:1fr}}
@media(max-width:760px){.hero .wrap,.about{grid-template-columns:1fr;gap:28px}.hero .photo{order:-1;width:200px;font-size:72px}.about .photo{width:200px;margin:0 auto 20px;justify-self:center}.about{text-align:start}.nl{padding:6px 9px;font-size:13px}section{padding:48px 0}nav .wrap{padding-bottom:6px}.navl{order:5;width:100%;overflow-x:auto;display:flex;gap:2px}}
.navl{display:flex;gap:2px}

.gate{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--deep)}
.gbox{background:var(--card);border-radius:20px;padding:28px 24px;max-width:400px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.gbox .logo2{display:flex;gap:10px;align-items:center;margin-bottom:14px}.gbox .logo2 svg{width:40px;height:40px;flex:none}
.gbox h1{font-size:22px;margin:0;color:var(--head);letter-spacing:-.02em;line-height:1.2}
.gbox p{margin:6px 0 16px;color:var(--muted);font-size:14px}
.gbox input[type=password]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:10px 14px;min-height:46px;font-size:16px;margin-bottom:10px}
.gbox .rem{display:flex;gap:8px;align-items:center;font-size:14px;margin-bottom:14px;color:var(--ink);flex-wrap:wrap}
.gbox .btn{width:100%}
.gerr{color:#d9574d;font-size:14px;min-height:22px;margin-top:10px;text-align:center}.gerr .ar{color:#d9574d;text-align:center}
.nl.on{background:rgba(16,185,129,.3);color:#fff}

const toB64=buf=>{const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
const fromB64=t=>{const s=atob(t),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u};
async function keyFrom(pw,salt,it){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:it,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptState(pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),it=600000;const key=await keyFrom(pw,salt,it);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(D)));return JSON.stringify({v:1,it,s:toB64(salt),i:toB64(iv),c:toB64(ct)})}
async function decryptState(pw,e){const key=await keyFrom(pw,fromB64(e.s),e.it);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(e.i)},key,fromB64(e.c));return JSON.parse(new TextDecoder().decode(pt))}

function saveUnit(c,id){const en=$('ue').value.trim(),ar=$('ua').value.trim();if(id){const u=D.levels[c].find(x=>x.id===id);u.en=en;u.ar=ar}else{const n=Math.max(0,...D.levels[c].map(u=>u.n))+1;D.levels[c].push({id:'u'+Date.now().toString(36),n,en,ar,ls:[]})}save();closeModal();render()}
function delUnit(c,id){if(S.pend==='u'+id){D.levels[c]=D.levels[c].filter(u=>u.id!==id);S.pend=null;save()}else S.pend='u'+id;render()}
function lessonForm(uid,lid){const[c,u]=findUnit(uid),l=lid?u.ls.find(x=>x.id===lid):null;modal(`<h3>${l?'Edit Lesson':'Add Lesson'}<span class="ar" lang="ar">${l?'تعديل الدرس':'إضافة درس'}</span></h3>${fld('ln','Lesson number','رقم الدرس',l&&l.num,'dir="ltr" placeholder="1"')}${fld('le','Title in English','العنوان بالإنجليزية',l&&l.en,'dir="ltr"')}${fld('la','Title in Arabic','العنوان بالعربية',l&&l.ar,'class="rtl"')}<div class="fld"><label>HTML file${l?' (leave empty to keep current)':''}<span class="ar" lang="ar">ملف HTML${l?' (اتركه فارغًا للإبقاء على الحالي)':''}</span></label><input type="file" id="lf" accept=".html,.htm"></div>${btns(`saveLesson('${uid}','${lid||''}')`)}`)}
function saveLesson(uid,lid){const[c,u]=findUnit(uid),num=$('ln').value.trim(),en=$('le').value.trim(),ar=$('la').value.trim(),f=$('lf').files[0];
if(!num)return toast('Enter the lesson number','أدخل رقم الدرس');
const fin=html=>{if(lid){const l=u.ls.find(x=>x.id===lid);Object.assign(l,{num,en,ar});if(html!=null)l.html=html}else u.ls.push({id:'l'+Date.now().toString(36),num,en,ar,html});save();closeModal();render();ART&&toast('Saving…','جارٍ الحفظ')};
if(f){const r=new FileReader();r.onload=()=>fin(r.result);r.readAsText(f)}else if(lid)fin(null);else toast('Choose an HTML file','اختر ملف HTML')}
function delLesson(uid,lid){const[c,u]=findUnit(uid);if(S.pend==='l'+lid){u.ls=u.ls.filter(l=>l.id!==lid);S.pend=null;save()}else S.pend='l'+lid;render()}
function bioForm(){modal(`<h3>Teacher bio<span class="ar" lang="ar">نبذة عن المعلم</span></h3><div class="fld"><label>English<span class="ar" lang="ar">بالإنجليزية</span></label><textarea id="be" rows="9" dir="ltr">${esc(D.bio.en)}</textarea></div><div class="fld"><label>Arabic<span class="ar" lang="ar">بالعربية</span></label><textarea id="ba" rows="9" class="rtl">${esc(D.bio.ar)}</textarea></div>${btns('saveBio()')}`)}
function saveBio(){D.bio={en:$('be').value.trim(),ar:$('ba').value.trim()};save();closeModal();render()}
function contactForm(){const c=D.contact;modal(`<h3>Contact details<span class="ar" lang="ar">بيانات التواصل</span></h3>${fld('ce','Email','البريد الإلكتروني',c.email,'dir="ltr"')}${fld('cw','WhatsApp number (with country code)','رقم واتساب (مع رمز الدولة)',c.wa,'dir="ltr"')}${fld('cb','Booking link','رابط الحجز',c.book,'dir="ltr" placeholder="https://"')}${btns('saveContact()')}`)}
function saveContact(){const b=$('cb').value.trim();D.contact={email:$('ce').value.trim(),wa:$('cw').value.trim(),book:/^https?:\/\//i.test(b)?b:''};save();closeModal();render()}
function resForm(){modal(`<h3>Add Resource<span class="ar" lang="ar">إضافة مادة</span></h3>${fld('re','Title in English','العنوان بالإنجليزية','','dir="ltr"')}${fld('ra','Title in Arabic','العنوان بالعربية','','class="rtl"')}<div class="fld"><label>File (PDF, image or HTML)<span class="ar" lang="ar">الملف (PDF أو صورة أو HTML)</span></label><input type="file" id="rf" accept=".pdf,.html,.htm,image/*"></div>${btns('saveRes()')}`)}
function saveRes(){const f=$('rf').files[0];if(!f)return toast('Choose a file','اختر ملفًا');const r=new FileReader();r.onload=()=>{D.res.push({id:'r'+Date.now().toString(36),en:$('re').value.trim(),ar:$('ra').value.trim(),name:f.name,url:r.result});save();closeModal();render()};r.readAsDataURL(f)}
function delRes(id){if(S.pend==='r'+id){D.res=D.res.filter(r=>r.id!==id);S.pend=null;save()}else S.pend='r'+id;render()}
function openRes(id){const r=D.res.find(x=>x.id===id);S.list=[];$('vt').innerHTML=bi(r.en||r.name,r.ar);$('frame').removeAttribute('srcdoc');$('frame').src=r.url;$('viewer').classList.add('on')}
function openLesson(uid,lid){const[c,u]=findUnit(uid);S.list=sorted(u.ls);S.cur=lid;showV()}
function showV(){const l=S.list.find(x=>x.id===S.cur);$('vt').innerHTML=bi(l.en||'Lesson '+l.num,l.ar||'الدرس '+l.num);$('frame').removeAttribute('src');$('frame').srcdoc=l.html;$('viewer').classList.add('on')}
function closeViewer(){$('viewer').classList.remove('on');$('frame').removeAttribute('srcdoc');$('frame').removeAttribute('src')}
function step(d){const i=S.list.findIndex(x=>x.id===S.cur),n=S.list[i+d];if(n){S.cur=n.id;showV()}else toast('No more lessons','لا يوجد درس آخر')}
function fs(){const e=$('viewer');if(document.fullscreenElement)document.exitFullscreen();else if(e.requestFullscreen)e.requestFullscreen()}
function startEditor(){render();(async()=>{
try{if(window.claude&&claude.use){
const u=await claude.use('user');
if(u){CAN=!!(await u.isOwner())||!!(await u.canEdit())}
if(CAN)ART=await claude.use('artifact')}}catch(e){}
if(CAN&&ART){
EDOK=true;
try{if(sessionStorage.getItem('awnd-edit')==='1'){S.edit=true;$('edbtn').classList.add('on')}
if(sessionStorage.getItem('awnd-saved')==='1'){sessionStorage.removeItem('awnd-saved');toast('Saved','تم الحفظ')}}catch(e){}
render()}
})();}
if(ENC)gateStart();else startEditor();
</script></body></html>

ent positions\u003c/span>\u003c/li>\n\u003cli>تقرأ بعض الكلمات البسيطة 🌟\u003cspan class=\"e\">Read some simple words\u003c/span>\u003c/li>\u003c/ul>\u003c/section>\n\n\u003csection class=\"s2\">\u003ch2>\u003ci>2\u003c/i>\u003cspan>الحروف الجديدة\u003cspan class=\"e\">New Letters\u003c/span>\u003c/span>\u003c/h2>\n\n\u003cdiv class=\"lc c1\">\u003cdiv class=\"big\">ص\u003c/div>\u003cdiv>\u003cb class=\"ar\">1. الصاد\u003c/b> \u003cspan class=\"lat\">Ṣād\u003c/span>\u003cbr>\u003cspan class=\"ar\" style=\"font-size:1.4rem\">صَ – صِ – صُ\u003c/span>\n\u003cdiv>\u003cspan class=\"wd\">\u003ci>🧘\u003c/i>\u003cb class=\"ar\">صَبْرٌ\u003c/b> Patience\u003c/span>\u003c/div>\n\u003cul>\u003cli>يشبه السين (س) لكنه \u003cb>مفخم\u003c/b>.\u003cspan class=\"e\">Like س but heavy (emphatic).\u003c/span>\u003c/li>\u003cli>يرتفع الجزء الخلفي من اللسان قليلًا عند النطق.\u003cspan class=\"e\">The back of the tongue rises slightly.\u003c/span>\u003c/li>\u003cli>لا تنطقه مثل السين تمامًا.\u003cspan class=\"e\">Don’t say it exactly like س.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"lc c2\">\u003cdiv class=\"big\">ض\u003c/div>\u003cdiv>\u003cb class=\"ar\">2. الضاد\u003c/b> \u003cspan class=\"lat\">Ḍād\u003c/span>\u003cbr>\u003cspan class=\"ar\" style=\"font-size:1.4rem\">ضَ – ضِ – ضُ\u003c/span>\n\u003cdiv>\u003cspan class=\"wd\">\u003ci>🤝\u003c/i>\u003cb class=\"ar\">ضَيْفٌ\u003c/b> Guest\u003c/span>\u003c/div>\n\u003cul>\u003cli>حرف مفخم ومجهور.\u003cspan class=\"e\">A heavy, voiced letter.\u003c/span>\u003c/li>\u003cli>مخرجه من حافة اللسان مع الأضراس العليا.\u003cspan class=\"e\">Made from the side edge of the tongue against the upper molars.\u003c/span>\u003c/li>\u003cli>ليس «دالًا مفخمة» فقط؛ مخرجه وصفاته أدق من ذلك.\u003cspan class=\"e\">It is not simply a “heavy daal”; its articulation is more specific.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"lc c3\">\u003cdiv class=\"big\">ط\u003c/div>\u003cdiv>\u003cb class=\"ar\">3. الطاء\u003c/b> \u003cspan class=\"lat\">Ṭā’\u003c/span>\u003cbr>\u003cspan class=\"ar\" style=\"font-size:1.4rem\">طَ – طِ – طُ\u003c/span>\n\u003cdiv>\u003cspan class=\"wd\">\u003ci>🎒\u003c/i>\u003cb class=\"ar\">طَالِبٌ\u003c/b> Student\u003c/span>\u003c/div>\n\u003cul>\u003cli>يشبه التاء (ت) لكنه \u003cb>مفخم\u003c/b>.\u003cspan class=\"e\">Like ت but heavy.\u003c/span>\u003c/li>\u003cli>يختلف عن التاء في التفخيم والاستعلاء والإطباق.\u003cspan class=\"e\">It differs from ت in heaviness: the tongue rises and presses toward the palate.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"lc c4\">\u003cdiv class=\"big\">ظ\u003c/div>\u003cdiv>\u003cb class=\"ar\">4. الظاء\u003c/b> \u003cspan class=\"lat\">Ẓā’\u003c/span>\u003cbr>\u003cspan class=\"ar\" style=\"font-size:1.4rem\">ظَ – ظِ – ظُ\u003c/span>\n\u003cdiv>\u003cspan class=\"wd\">\u003ci>🌳\u003c/i>\u003cb class=\"ar\">ظِلٌّ\u003c/b> Shade\u003c/span>\u003c/div>\n\u003cul>\u003cli>يشبه الذال (ذ) لكنه \u003cb>مفخم\u003c/b>.\u003cspan class=\"e\">Like ذ but heavy.\u003c/span>\u003c/li>\u003cli>يخرج من طرف اللسان مع أطراف الثنايا العليا.\u003cspan class=\"e\">Tongue tip at the edges of the upper front teeth.\u003c/span>\u003c/li>\u003cli>لا تخلطه بالزاي أو الضاد.\u003cspan class=\"e\">Don’t mix it with ز or ض.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"lc c5\">\u003cdiv class=\"big\">ع\u003c/div>\u003cdiv>\u003cb class=\"ar\">5. العين\u003c/b> \u003cspan class=\"lat\">‘Ayn\u003c/span>\u003cbr>\u003cspan class=\"ar\" style=\"font-size:1.4rem\">عَ – عِ – عُ\u003c/span>\n\u003cdiv>\u003cspan class=\"wd\">\u003ci>👁️\u003c/i>\u003cb class=\"ar\">عَيْنٌ\u003c/b> Eye\u003c/span>\u003c/div>\n\u003cul>\u003cli>يخرج من وسط الحلق.\u003cspan class=\"e\">From the middle of the throat.\u003c/span>\u003c/li>\u003cli>ليس له مقابل مطابق في الإنجليزية، فيحتاج إلى استماع وتكرار.\u003cspan class=\"e\">No exact English equivalent; it needs lots of listening and repeating.\u003c/span>\u003c/li>\u003cli>لا تنطقه مثل الهمزة أو الألف.\u003cspan class=\"e\">Don’t say it like hamza or alif.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"lc c6\">\u003cdiv class=\"big\">غ\u003c/div>\u003cdiv>\u003cb class=\"ar\">6. الغين\u003c/b> \u003cspan class=\"lat\">Ghayn\u003c/span>\u003cbr>\u003cspan class=\"ar\" style=\"font-size:1.4rem\">غَ – غِ – غُ\u003c/span>\n\u003cdiv>\u003cspan class=\"wd\">\u003ci>🛏️\u003c/i>\u003cb class=\"ar\">غُرْفَةٌ\u003c/b> Room\u003c/span>\u003c/div>\n\u003cul>\u003cli>يخرج من أدنى الحلق، قريبًا من الخاء (خ).\u003cspan class=\"e\">From the lowest part of the throat, near خ.\u003c/span>\u003c/li>\u003cli>يشبه الخاء لكنه \u003cb>مجهور\u003c/b>.\u003cspan class=\"e\">Like خ but voiced.\u003c/span>\u003c/li>\u003cli>يقاربه R الفرنسي في بعض الكلمات، لكنه ليس مطابقًا تمامًا.\u003cspan class=\"e\">Close to the French R in some words, but not identical.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection class=\"s3\">\u003ch2>\u003ci>3\u003c/i>\u003cspan>المقارنة بين الحروف المتشابهة\u003cspan class=\"e\">Similar Letters\u003c/span>\u003c/span>\u003c/h2>\n\u003cp>بعض الحروف الجديدة قريبة من حروف تعلمتها:\u003cspan class=\"e\">Some new letters are close to ones you already know:\u003c/span>\u003c/p>\n\u003cdiv class=\"wrap\">\u003ctable>\u003ctr>\u003cth>الجديد · New\u003c/th>\u003cth>السابق · Old\u003c/th>\u003cth>الفرق · Difference\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd class=\"ar\" style=\"font-size:1.8rem\">ص\u003c/td>\u003ctd class=\"ar\" style=\"font-size:1.8rem\">س\u003c/td>\u003ctd>الصاد مفخمة\u003cspan class=\"e\" style=\"text-align:center\">ص is heavy\u003c/span>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"ar\" style=\"font-size:1.8rem\">ض\u003c/td>\u003ctd class=\"ar\" style=\"font-size:1.8rem\">د\u003c/td>\u003ctd>الضاد مفخمة ولها مخرج خاص\u003cspan class=\"e\" style=\"text-align:center\">ض is heavy with its own articulation\u003c/span>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"ar\" style=\"font-size:1.8rem\">ط\u003c/td>\u003ctd class=\"ar\" style=\"font-size:1.8rem\">ت\u003c/td>\u003ctd>الطاء مفخمة\u003cspan class=\"e\" style=\"text-align:center\">ط is heavy\u003c/span>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"ar\" style=\"font-size:1.8rem\">ظ\u003c/td>\u003ctd class=\"ar\" style=\"font-size:1.8rem\">ذ\u003c/td>\u003ctd>الظاء مفخمة\u003cspan class=\"e\" style=\"text-align:center\">ظ is heavy\u003c/span>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"ar\" style=\"font-size:1.8rem\">غ\u003c/td>\u003ctd class=\"ar\" style=\"font-size:1.8rem\">خ\u003c/td>\u003ctd>الغين مجهورة والخاء مهموسة\u003cspan class=\"e\" style=\"text-align:center\">غ is voiced, خ is voiceless\u003c/span>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cdiv class=\"box tip\">\u003cb>👀 انظر إلى النقاط · Check the Dots\u003c/b>ص ط ع: \u003cb>بلا نقاط\u003c/b> · ض ظ غ: \u003cb>نقطة واحدة فوقها\u003c/b>\u003cspan class=\"e\">ص ط ع have no dots; ض ظ غ have one dot above.\u003c/span>\u003c/div>\n\u003cdiv class=\"box note\">\u003cb>🎧 تدريب · Practice\u003c/b>انطق كل زوج بوضوح وكرّره، ثم اختبر أذنك دون النظر إلى الحروف:\u003cdiv class=\"chips ar\" style=\"font-size:1.5rem;margin-top:6px\">\u003cspan>س – ص\u003c/span>\u003cspan>ت – ط\u003c/span>\u003cspan>ذ – ظ\u003c/span>\u003cspan>خ – غ\u003c/span>\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection class=\"s4\">\u003ch2>\u003ci>4\u003c/i>\u003cspan>الحركات القصيرة\u003cspan class=\"e\">Short Vowels\u003c/span>\u003c/span>\u003c/h2>\n\u003cdiv class=\"wrap\">\u003ctable>\u003ctr>\u003cth>الحرف\u003c/th>\u003cth>الفتحة\u003c/th>\u003cth>الكسرة\u003c/th>\u003cth>الضمة\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd class=\"ar\">ص\u003c/td>\u003ctd class=\"ar\">صَ\u003c/td>\u003ctd class=\"ar\">صِ\u003c/td>\u003ctd class=\"ar\">صُ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"ar\">ض\u003c/td>\u003ctd class=\"ar\">ضَ\u003c/td>\u003ctd class=\"ar\">ضِ\u003c/td>\u003ctd class=\"ar\">ضُ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"ar\">ط\u003c/td>\u003ctd class=\"ar\">طَ\u003c/td>\u003ctd class=\"ar\">طِ\u003c/td>\u003ctd class=\"ar\">طُ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"ar\">ظ\u003c/td>\u003ctd class=\"ar\">ظَ\u003c/td>\u003ctd class=\"ar\">ظِ\u003c/td>\u003ctd class=\"ar\">ظُ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"ar\">ع\u003c/td>\u003ctd class=\"ar\">عَ\u003c/td>\u003ctd class=\"ar\">عِ\u003c/td>\u003ctd class=\"ar\">عُ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"ar\">غ\u003c/td>\u003ctd class=\"ar\">غَ\u003c/td>\u003ctd class=\"ar\">غِ\u003c/td>\u003ctd class=\"ar\">غُ\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003c/section>\n\n\u003csection class=\"s5\">\u003ch2>\u003ci>5\u003c/i>\u003cspan>أشكال الحروف\u003cspan class=\"e\">Letter Forms\u003c/span>\u003c/span>\u003c/h2>\n\u003cdiv class=\"wrap\">\u003ctable>\u003ctr>\u003cth>الحرف\u003c/th>\u003cth>أول الكلمة · Start\u003c/th>\u003cth>وسط الكلمة · Middle\u003c/th>\u003cth>آخر الكلمة · End\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd class=\"ar\">ص\u003c/td>\u003ctd class=\"ar\">صـ\u003c/td>\u003ctd class=\"ar\">ـصـ\u003c/td>\u003ctd class=\"ar\">ـص\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"ar\">ض\u003c/td>\u003ctd class=\"ar\">ضـ\u003c/td>\u003ctd class=\"ar\">ـضـ\u003c/td>\u003ctd class=\"ar\">ـض\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"ar\">ط\u003c/td>\u003ctd class=\"ar\">طـ\u003c/td>\u003ctd class=\"ar\">ـطـ\u003c/td>\u003ctd class=\"ar\">ـط\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"ar\">ظ\u003c/td>\u003ctd class=\"ar\">ظـ\u003c/td>\u003ctd class=\"ar\">ـظـ\u003c/td>\u003ctd class=\"ar\">ـظ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"ar\">ع\u003c/td>\u003ctd class=\"ar\">عـ\u003c/td>\u003ctd class=\"ar\">ـعـ\u003c/td>\u003ctd class=\"ar\">ـع\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"ar\">غ\u003c/td>\u003ctd class=\"ar\">غـ\u003c/td>\u003ctd class=\"ar\">ـغـ\u003c/td>\u003ctd class=\"ar\">ـغ\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003c/section>\n\n\u003csection class=\"s6\">\u003ch2>\u003ci>6\u003c/i>\u003cspan>المفردات\u003cspan class=\"e\">Vocabulary\u003c/span>\u003c/span>\u003c/h2>\n\u003cdiv class=\"dots\">\n\u003cdiv class=\"c1 lc\" style=\"display:block;text-align:center\">\u003cdiv style=\"font-size:3rem\">🧘\u003c/div>\u003cdiv class=\"ar\" style=\"font-size:1.6rem\">صَبْر\u003c/div>\u003cspan class=\"e\" style=\"text-align:center\">Patience\u003c/span>\u003c/div>\n\u003cdiv class=\"c2 lc\" style=\"display:block;text-align:center\">\u003cdiv style=\"font-size:3rem\">🤝\u003c/div>\u003cdiv class=\"ar\" style=\"font-size:1.6rem\">ضَيْف\u003c/div>\u003cspan class=\"e\" style=\"text-align:center\">Guest\u003c/span>\u003c/div>\n\u003cdiv class=\"c3 lc\" style=\"display:block;text-align:center\">\u003cdiv style=\"font-size:3rem\">🎒\u003c/div>\u003cdiv class=\"ar\" style=\"font-size:1.6rem\">طَالِب\u003c/div>\u003cspan class=\"e\" style=\"text-align:center\">Student\u003c/span>\u003c/div>\n\u003cdiv class=\"c4 lc\" style=\"display:block;text-align:center\">\u003cdiv style=\"font-size:3rem\">🌳\u003c/div>\u003cdiv class=\"ar\" style=\"font-size:1.6rem\">ظِلّ\u003c/div>\u003cspan class=\"e\" style=\"text-align:center\">Shade\u003c/span>\u003c/div>\n\u003cdiv class=\"c5 lc\" style=\"display:block;text-align:center\">\u003cdiv style=\"font-size:3rem\">👁️\u003c/div>\u003cdiv class=\"ar\" style=\"font-size:1.6rem\">عَيْن\u003c/div>\u003cspan class=\"e\" style=\"text-align:center\">Eye\u003c/span>\u003c/div>\n\u003cdiv class=\"c6 lc\" style=\"display:block;text-align:center\">\u003cdiv style=\"font-size:3rem\">🛏️\u003c/div>\u003cdiv class=\"ar\" style=\"font-size:1.6rem\">غُرْفَة\u003c/div>\u003cspan class=\"e\" style=\"text-align:center\">Room\u003c/span>\u003c/div>\u003c/div>\n\u003cdiv class=\"box note\">\u003cb>💡 تنبيه · Tip\u003c/b>هذه الكلمات للتعرّف على المعنى والنطق فقط، ولا يلزم أن تقرأها كاملة وحدك إن كان فيها حروف لم تتعلمها بعد.\u003cspan class=\"e\">These words are for meaning and pronunciation; you don’t have to read them alone if they contain letters you haven’t learned.\u003c/span>\u003c/div>\u003c/section>\n\n\u003csection class=\"s1\" id=\"quiz\">\u003ch2>\u003ci>7\u003c/i>\u003cspan>تدريبات الدرس\u003cspan class=\"e\">Exercises\u003c/span>\u003c/span>\u003c/h2>\n\u003ch3>التدريب الأول: اختر الإجابة الصحيحة\u003cspan class=\"e\">Exercise 1: Choose the correct answer\u003c/span>\u003c/h3>\u003cdiv id=\"mc\">\u003c/div>\n\u003ch3>التدريب الثاني: اقرأ بصوت مرتفع\u003cspan class=\"e\">Exercise 2: Read aloud\u003c/span>\u003c/h3>\n\u003cdiv class=\"chips ar\" style=\"font-size:1.5rem\">\u003cspan>صَ – ضَ – طَ – ظَ – عَ – غَ\u003c/span>\u003c/div>\u003cbr>\n\u003cdiv class=\"chips ar\" style=\"font-size:1.5rem\">\u003cspan>صِ – ضِ – طِ – ظِ – عِ – غِ\u003c/span>\u003c/div>\u003cbr>\n\u003cdiv class=\"chips ar\" style=\"font-size:1.5rem\">\u003cspan>صُ – ضُ – طُ – ظُ – عُ – غُ\u003c/span>\u003c/div>\n\u003ch3>التدريب الثالث: استمع وحدد الحرف\u003cspan class=\"e\">Exercise 3: Listen and choose\u003c/span>\u003c/h3>\n\u003cp>يقرأ معلمك أحد الحرفين، وأنت تحدد الحرف الذي سمعته 👂\u003cspan class=\"e\">Your teacher says one letter of a pair and you name it.\u003c/span>\u003c/p>\n\u003cdiv class=\"chips ar\" style=\"font-size:1.4rem\">\u003cspan>س / ص\u003c/span>\u003cspan>ت / ط\u003c/span>\u003cspan>ذ / ظ\u003c/span>\u003cspan>خ / غ\u003c/span>\u003c/div>\n\u003ch3>تدريب إضافي: طابق الحرف المفخم بما يقابله\u003cspan class=\"e\">Bonus: Match the heavy letter to its lighter partner\u003c/span>\u003c/h3>\n\u003cdiv id=\"fills\">\u003c/div>\u003cbutton class=\"btn\" id=\"chk\">تحقق من الإجابات\u003c/button>\u003cdiv class=\"score\" id=\"sc\">\u003c/div>\u003c/section>\n\n\u003csection class=\"s2\">\u003ch2>\u003ci>8\u003c/i>\u003cspan>المحادثة والمراجعة\u003cspan class=\"e\">Speaking and Review\u003c/span>\u003c/span>\u003c/h2>\n\u003cp>قدّم نفسك بالعربية \u003cb>دون النظر إلى الورقة\u003c/b>:\u003cspan class=\"e\">Introduce yourself in Arabic without looking at the page:\u003c/span>\u003c/p>\n\u003cdiv class=\"dlg\">\n\u003cdiv class=\"m a\">\u003cdiv class=\"ar\">\u003cspan class=\"ic\">🕊️\u003c/span>السَّلَامُ عَلَيْكُمْ.\u003c/div>\u003c/div>\n\u003cdiv class=\"m l\">\u003cdiv class=\"ar\">\u003cspan class=\"ic\">🏷️\u003c/span>اسْمِي ... .\u003c/div>\u003c/div>\n\u003cdiv class=\"m a\">\u003cdiv class=\"ar\">\u003cspan class=\"ic\">🌍\u003c/span>أَنَا مِنْ ... .\u003c/div>\u003c/div>\n\u003cdiv class=\"m l\">\u003cdiv class=\"ar\">\u003cspan class=\"ic\">😊\u003c/span>أَنَا بِخَيْرٍ، الْحَمْدُ لِلَّهِ.\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"box tip\">\u003cb>🔁 مراجعة · Review\u003c/b>بعد ذلك يسألك معلمك عن حروف الدروس السابقة بترتيب عشوائي.\u003cspan class=\"e\">Then your teacher asks you about letters from previous lessons in random order.\u003c/span>\u003c/div>\u003c/section>\n\n\u003csection class=\"s3\">\u003ch2>\u003ci>9\u003c/i>\u003cspan>الأخطاء الشائعة\u003cspan class=\"e\">Common Mistakes\u003c/span>\u003c/span>\u003c/h2>\n\u003cdiv class=\"wrap\">\u003ctable>\u003ctr>\u003cth>الخطأ · Mistake\u003c/th>\u003cth>التصحيح · Fix\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>نطق ص مثل س\u003c/td>\u003ctd>ارفع مؤخرة اللسان قليلًا\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>نطق ط مثل ت\u003c/td>\u003ctd>فخّم الصوت\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>نطق ع مثل الهمزة أو الألف\u003c/td>\u003ctd>أخرج الصوت من وسط الحلق\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>نطق غ مثل خ\u003c/td>\u003ctd>غ مجهورة، وخ مهموسة\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003c/section>\n\n\u003csection class=\"s4\">\u003ch2>\u003ci>🏠\u003c/i>\u003cspan>الواجب المنزلي\u003cspan class=\"e\">Homework\u003c/span>\u003c/span>\u003c/h2>\n\u003cul>\u003cli>اكتب الحروف الستة 5 مرات\u003cspan class=\"e\">Write the six letters 5 times\u003c/span>\u003c/li>\n\u003cli>سجّل صوتك وأنت تنطق الحروف بالحركات الثلاث 🎙\u003cspan class=\"e\">Record yourself saying the letters with the three short vowels\u003c/span>\u003c/li>\n\u003cli>تدرّب على الأزواج المتشابهة\u003cspan class=\"e\">Practice the similar pairs\u003c/span>\u003c/li>\n\u003cli>راجع الحروف السابقة كاملة\u003cspan class=\"e\">Review all the previous letters\u003c/span>\u003c/li>\u003c/ul>\u003c/section>\n\n\u003csection class=\"s5\">\u003ch2>\u003ci>✔\u003c/i>\u003cspan>اختبر نفسك\u003cspan class=\"e\">Mastery Checklist\u003c/span>\u003c/span>\u003c/h2>\n\u003cp>اضغط لتحديد ما تستطيع فعله:\u003cspan class=\"e\">Tap to tick what you can do:\u003c/span>\u003c/p>\n\u003cdiv class=\"chk\">\u003c/div>\u003c/section>\n\u003c/main>\n\u003cfooter>أحسنت! 🌟 ستة حروف جديدة، وبقي القليل لتعرف الأبجدية كلها.\u003c/footer>\n\u003cscript>\nfunction mk(id,D){var el=document.getElementById(id);D.forEach(function(q,i){var d=document.createElement(\"div\");d.className=\"q\";var p=document.createElement(\"p\");p.textContent=(i+1)+\". \"+q[0];d.appendChild(p);var o=document.createElement(\"div\");o.className=\"opts\";var fb=document.createElement(\"div\");fb.className=\"fb\";\nq[1].forEach(function(t,j){var b=document.createElement(\"button\");b.className=\"opt ar\";b.textContent=t;b.onclick=function(){if(d.dataset.d)return;d.dataset.d=1;b.classList.add(j==q[2]?\"ok\":\"no\");if(j==q[2]){fb.textContent=\"✅ أحسنت!\"}else{fb.textContent=\"❌ الصحيح: \"+q[1][q[2]];o.children[q[2]].classList.add(\"ok\")}};o.appendChild(b)});d.appendChild(o);d.appendChild(fb);el.appendChild(d)})}\nmk(\"mc\",[[\"ما الحرف الذي يقابل السين في التفخيم؟\",[\"ص\",\"ض\",\"ط\"],0],[\"ما الحرف الذي يقابل التاء في التفخيم؟\",[\"ظ\",\"ط\",\"ع\"],1],[\"أي الحروف الآتية يخرج من الحلق؟\",[\"ص\",\"ع\",\"ض\"],1],[\"ما الفرق بين خ وغ؟\",[\"غ مجهورة وخ مهموسة\",\"خ مفخمة وغ مرققة\",\"لا يوجد فرق\"],0],[\"ما الحرف الذي يقابل الذال في التفخيم؟\",[\"ض\",\"ظ\",\"ص\"],1]]);\nvar FL=[[\"ص\",\"س\"],[\"ط\",\"ت\"],[\"ظ\",\"ذ\"],[\"ض\",\"د\"],[\"غ\",\"خ\"]],W=[\"س\",\"ت\",\"ذ\",\"د\",\"خ\"],sels=[],fe=document.getElementById(\"fills\");\nFL.forEach(function(f){var r=document.createElement(\"div\");r.className=\"fill\";var a=document.createElement( ius:12px;padding:6px 16px;cursor:pointer}\n.opt.ok{background:var(--g1);color:#fff}.opt.no{background:var(--r1);color:#fff}\n.fb{margin-top:6px;font-weight:700;min-height:1.4em}\n.btn{background:linear-gradient(135deg,var(--p1),var(--b1));color:#fff;border:0;border-radius:14px;padding:10px 22px;font-weight:800;cursor:pointer}\n.fill{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0}\nselect{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:4px 8px}\n.speak li{margin:6px 0;font-weight:700}\n.score{font-size:1.2rem;font-weight:800;text-align:center;margin-top:10px}\nfooter{text-align:center;color:var(--mut);padding:0 10px 30px}\n.e{display:block;direction:ltr;text-align:left;color:var(--mut);font-size:.92rem;font-weight:400;line-height:1.5;margin-top:2px}\nh2 .e{color:var(--b1);font-weight:700;font-size:1rem}\nh3 .e{display:inline;font-size:.9rem;margin-inline-start:8px}\n.brand{direction:ltr;display:inline-block;font-size:1.6rem;font-weight:800;letter-spacing:.5px;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.55);border-radius:99px;padding:6px 26px;margin-bottom:14px;text-shadow:0 2px 6px rgba(0,0,0,.25)}\n.ic{font-size:1.35rem;line-height:1;vertical-align:middle;margin-inline-end:6px;font-style:normal}\ntd.ic{font-size:2.2rem;margin:0}\n.pron .ic{display:block;font-size:2.6rem;margin:0 0 4px}\n.avatar{display:block;width:150px;height:150px;border-radius:50%;object-fit:cover;margin:0 auto 14px;border:5px solid #fff;box-shadow:0 8px 24px rgba(0,0,0,.3)}\n.lc{display:flex;gap:14px;border-radius:18px;padding:14px;margin:12px 0;align-items:center;border:2px solid var(--line)}\n.lc .big{font-family:Amiri,serif;font-size:4.4rem;line-height:1.1;min-width:84px;text-align:center;font-weight:700}\n.c1{background:var(--bl);border-color:var(--b1)}.c1 .big{color:var(--b1)}\n.c2{background:var(--gr);border-color:var(--g1)}.c2 .big{color:var(--g1)}\n.c3{background:var(--or);border-color:var(--o1)}.c3 .big{color:va on 06 · A0 · The Final Arabic Letters\u003c/div>\n\u003cdiv class=\"ar\" style=\"font-size:2rem;letter-spacing:3px;margin-top:6px\">ف – ق – ك – ل – م – ن – هـ – و – ي\u003c/div>\n\u003cdiv class=\"tags\">\u003cspan>🏆 الحروف التسعة الأخيرة\u003c/span>\u003cspan>👂 الاستماع\u003c/span>\u003cspan>🗣 النطق\u003c/span>\u003cspan>📖 القراءة\u003c/span>\u003c/div>\n\u003c/header>\n\u003cmain>\n\n\u003csection class=\"s1\">\u003ch2>\u003ci>1\u003c/i>\u003cspan>أهداف الدرس\u003cspan class=\"e\">Lesson Objectives\u003c/span>\u003c/span>\u003c/h2>\n\u003cp>بنهاية الدرس ستستطيع أن:\u003cspan class=\"e\">By the end of this lesson you will be able to:\u003c/span>\u003c/p>\n\u003cul>\n\u003cli>تتعرف على الحروف التسعة الأخيرة 🔤\u003cspan class=\"e\">Recognize the final nine letters\u003c/span>\u003c/li>\n\u003cli>تنطقها بصورة صحيحة 🗣\u003cspan class=\"e\">Pronounce them correctly\u003c/span>\u003c/li>\n\u003cli>تميّز بين الحروف المتشابهة 👀\u003cspan class=\"e\">Tell similar letters apart\u003c/span>\u003c/li>\n\u003cli>تقرأ الحروف مع الحركات القصيرة 📖\u003cspan class=\"e\">Read the letters with short vowels\u003c/span>\u003c/li>\n\u003cli>تعرف أشكال الحروف عند اتصالها في الكلمات 🧩\u003cspan class=\"e\">Know the letter forms when they connect in words\u003c/span>\u003c/li>\n\u003cli>تقرأ بعض الكلمات البسيطة 🌟\u003cspan class=\"e\">Read some simple words\u003c/span>\u003c/li>\u003c/ul>\n\u003cdiv class=\"box tip\">\u003cb>🏆 إنجاز كبير · Big Milestone\u003c/b>هذا آخر درس في تقديم الحروف! قسمنا التسعة إلى مجموعتين حتى يكون الدرس خفيفًا.\u003cspan class=\"e\">This is the last lesson introducing the letters! We split the nine into two groups to keep it light.\u003c/span>\u003c/div>\u003c/section>\n\n\u003csection class=\"s2\">\u003ch2>\u003ci>2\u003c/i>\u003cspan>المجموعة الأولى: ف – ق – ك – ل – م\u003cspan class=\"e\">Group 1\u003c/span>\u003c/span>\u003c/h2>\u003cdiv id=\"g1\">\u003cdiv class=\"lc c1\">\u003cdiv class=\"big\">ف\u003c/div>\u003cdiv>\u003cb class=\"ar\">1. الفاء\u003c/b> \u003cspan class=\"lat\">Fā’\u003c/span>\u003cbr>\u003cspan class=\"ar\" style=\"font-size:1.4rem\">فَ – فِ – فُ\u003c/span>\u003cdiv>\u003cspan class=\"wd\">\u003ci>👄\u003c/i>\u003cb class=\"ar\">فَمٌ\u003c/b> Mouth\u003c/span>\u003c/div>\u003cul>\u003cli>يشبه F في الإنجليزية.\u003cspan class=\"e\">Like English F.\u003c/span>\u003c/li>\u003cli>يخرج من باطن الشفة السفلى مع أطراف الثنايا العليا.\u003cspan class=\"e\">Lower lip against the upper front teeth.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003cdiv class=\"lc c2\">\u003cdiv class=\"big\">ق\u003c/div>\u003cdiv>\u003cb class=\"ar\">2. القاف\u003c/b> \u003cspan class=\"lat\">Qāf\u003c/span>\u003cbr>\u003cspan class=\"ar\" style=\"font-size:1.4rem\">قَ – قِ – قُ\u003c/span>\u003cdiv>\u003cspan class=\"wd\">\u003ci>🖊️\u003c/i>\u003cb class=\"ar\">قَلَمٌ\u003c/b> Pen\u003c/span>\u003c/div>\u003cul>\u003cli>حرف مفخم.\u003cspan class=\"e\">A heavy letter.\u003c/span>\u003c/li>\u003cli>يخرج من أقصى اللسان مع ما يحاذيه من الحنك الأعلى؛ ليس K تمامًا بل أعمق منه.\u003cspan class=\"e\">From the back of the tongue; deeper than K.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003cdiv class=\"lc c3\">\u003cdiv class=\"big\">ك\u003c/div>\u003cdiv>\u003cb class=\"ar\">3. الكاف\u003c/b> \u003cspan class=\"lat\">Kāf\u003c/span>\u003cbr>\u003cspan class=\"ar\" style=\"font-size:1.4rem\">كَ – كِ – كُ\u003c/span>\u003cdiv>\u003cspan class=\"wd\">\u003ci>📖\u003c/i>\u003cb class=\"ar\">كِتَابٌ\u003c/b> Book\u003c/span>\u003c/div>\u003cul>\u003cli>يشبه K في الإنجليزية.\u003cspan class=\"e\">Like English K.\u003c/span>\u003c/li>\u003cli>يخرج من أقصى اللسان، لكن أقرب إلى الأمام من القاف.\u003cspan class=\"e\">Back of the tongue, a little further forward than ق.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003cdiv class=\"lc c4\">\u003cdiv class=\"big\">ل\u003c/div>\u003cdiv>\u003cb class=\"ar\">4. اللام\u003c/b> \u003cspan class=\"lat\">Lām\u003c/span>\u003cbr>\u003cspan class=\"ar\" style=\"font-size:1.4rem\">لَ – لِ – لُ\u003c/span>\u003cdiv>\u003cspan class=\"wd\">\u003ci>🥛\u003c/i>\u003cb class=\"ar\">لَبَنٌ\u003c/b> Milk\u003c/span>\u003c/div>\u003cul>\u003cli>يشبه L في الإنجليزية.\u003cspan class=\"e\">Like English L.\u003c/span>\u003c/li>\u003cli>يخرج من حافة اللسان مع اللثة العليا.\u003cspan class=\"e\">Tongue edge against the upper gum.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003cdiv class=\"lc c5\">\u003cdiv class=\"big\">م\u003c/div>\u003cdiv>\u003cb class=\"ar\">5. الميم\u003c/b> \u003cspan class=\"lat\">Mīm\u003c/span>\u003cbr>\u003cspan class=\"ar\" style=\"font-size:1.4rem\">مَ – مِ – مُ\u003c/span>\u003cdiv>\u003cspan class=\"wd\">\u003ci>💧\u003c/i>\u003cb class=\"ar\">مَاءٌ\u003c/b> Water\u003c/span>\u003c/div>\u003cul>\u003cli>يشبه M في الإنجليزية.\u003cspan class=\"e\">Like English M.\u003c/span>\u003c/li>\u003cli>يخرج من انطباق الشفتين.\u003cspan class=\"e\">Lips closed together.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"s3\">\u003ch2>\u003ci>3\u003c/i>\u003cspan>المجموعة الثانية: ن – هـ – و – ي\u003cspan class=\"e\">Group 2\u003c/span>\u003c/span>\u003c/h2>\u003cdiv id=\"g2\">\u003cdiv class=\"lc c6\">\u003cdiv class=\"big\">ن\u003c/div>\u003cdiv>\u003cb class=\"ar\">6. النون\u003c/b> \u003cspan class=\"lat\">Nūn\u003c/span>\u003cbr>\u003cspan class=\"ar\" style=\"font-size:1.4rem\">نَ – نِ – نُ\u003c/span>\u003cdiv>\u003cspan class=\"wd\">\u003ci>⭐\u003c/i>\u003cb class=\"ar\">نَجْمٌ\u003c/b> Star\u003c/span>\u003c/div>\u003cul>\u003cli>يشبه N في الإنجليزية.\u003cspan class=\"e\">Like English N.\u003c/span>\u003c/li>\u003cli>من طرف اللسان مع اللثة العليا، ويصاحبه صوت الغنة.\u003cspan class=\"e\">Tongue tip at the upper gum, with a nasal resonance.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003cdiv class=\"lc c1\">\u003cdiv class=\"big\">هـ\u003c/div>\u003cdiv>\u003cb class=\"ar\">7. الهاء\u003c/b> \u003cspan class=\"lat\">Hā’\u003c/span>\u003cbr>\u003cspan class=\"ar\" style=\"font-size:1.4rem\">هَ – هِ – هُ\u003c/span>\u003cdiv>\u003cspan class=\"wd\">\u003ci>🌬️\u003c/i>\u003cb class=\"ar\">هَوَاءٌ\u003c/b> Air\u003c/span>\u003c/div>\u003cul>\u003cli>يشبه H في كلمة House.\u003cspan class=\"e\">Like H in “House”.\u003c/span>\u003c/li>\u003cli>يخرج من أقصى الحلق.\u003cspan class=\"e\">From the back of the throat.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003cdiv class=\"lc c2\">\u003cdiv class=\"big\">و\u003c/div>\u003cdiv>\u003cb class=\"ar\">8. الواو\u003c/b> \u003cspan class=\"lat\">Wāw\u003c/span>\u003cbr>\u003cspan class=\"ar\" style=\"font-size:1.4rem\">وَ – وِ – وُ\u003c/span>\u003cdiv>\u003cspan class=\"wd\">\u003ci>🌹\u003c/i>\u003cb class=\"ar\">وَرْدٌ\u003c/b> Roses\u003c/span>\u003c/div>\u003cul>\u003cli>إذا تحركت تشبه W في الإنجليزية.\u003cspan class=\"e\">With a vowel, like English W.\u003c/span>\u003c/li>\u003cli>تخرج بضم الشفتين دون إطباقهما.\u003cspan class=\"e\">Round the lips without closing them.\u003c/span>\u003c/li>\u003cli>سنتعلم لاحقًا أنها قد تكون حرف مد أيضًا.\u003cspan class=\"e\">Later: it can also be a long vowel letter.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003cdiv class=\"lc c3\">\u003cdiv class=\"big\">ي\u003c/div>\u003cdiv>\u003cb class=\"ar\">9. الياء\u003c/b> \u003cspan class=\"lat\">Yā’\u003c/span>\u003cbr>\u003cspan class=\"ar\" style=\"font-size:1.4rem\">يَ – يِ – يُ\u003c/span>\u003cdiv>\u003cspan class=\"wd\">\u003ci>✋\u003c/i>\u003cb class=\"ar\">يَدٌ\u003c/b> Hand\u003c/span>\u003c/div>\u003cul>\u003cli>إذا تحركت تشبه Y في الإنجليزية.\u003cspan class=\"e\">With a vowel, like English Y.\u003c/span>\u003c/li>\u003cli>يخرج الصوت من وسط اللسان مع ما يحاذيه من الحنك الأعلى.\u003cspan class=\"e\">Middle of the tongue against the palate.\u003c/span>\u003c/li>\u003cli>سنتعلم لاحقًا أنها قد تكون حرف مد أيضًا.\u003cspan class=\"e\">Later: it can also be a long vowel letter.\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection class=\"s4\">\u003ch2>\u003ci>4\u003c/i>\u003cspan>انتبه للنقاط\u003cspan class=\"e\">Check the Dots\u003c/span>\u003c/span>\u003c/h2>\n\u003cdiv class=\"dots\">\n\u003cdiv class=\"c1 lc\" style=\"display:block;text-align:center\">\u003cdiv class=\"big\">ف\u003c/div>نقطة فوقه\u003cspan class=\"e\" style=\"text-align:center\">One dot above\u003c/span>\u003c/div>\n\u003cdiv class=\"c2 lc\" style=\"display:block;text-align:center\">\u003cdiv class=\"big\">ق\u003c/div>نقطتان فوقه\u003cspan class=\"e\" style=\"text-align:center\">Two dots above\u003c/span>\u003c/div>\n\u003cdiv class=\"c3 lc\" style=\"display:block;text-align:center\">\u003cdiv class=\"big\">ن\u003c/div>نقطة فوقه\u003cspan class=\"e\" style=\"text-align:center\">One dot above\u003c/span>\u003c/div>\n\u003cdiv class=\"c4 lc\" style=\"display:block;text-align:center\">\u003cdiv class=\"big\">ي\u003c/div>نقطتان تحته\u003cspan class=\"e\" style=\"text-align:center\">Two dots below\u003c/span>\u003c/div>\u003c/div>\n\u003cdiv class=\"box note\">\u003cb>🎧 تدريب سمعي · Listening\u003c/b>اسمع كل زوج ثم حدد الحرف:\u003cdiv class=\"chips ar\" style=\"font-size:1.5rem;margin-top:6px\">\u003cspan>قَ / كَ\u003c/span>\u003cspan>وَ / يَ\u003c/span>\u003cspan>هَ / حَ\u003c/span>\u003cspan>فَ / قَ\u003c/span>\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection class=\"s5\">\u003ch2>\u003ci>5\u003c/i>\u003cspan>الحروف والحركات القصيرة\u003cspan class=\"e\">Letters and Short Vowels\u003c/span>\u003c/span>\u003c/h2>\n\u003cdiv class=\"wrap\">\u003ctable id=\"vt\">\u003ctr>\u003cth>الحرف\u003c/th>\u003cth>الفتحة\u003c/th>\u003cth>الكسرة\u003c/th>\u003cth>الضمة\u003c/th>\u003c/tr>\u003ctr>\u003ctd class='ar'>ف\u003c/td>\u003ctd class='ar'>فَ\u003c/td>\u003ctd class='ar'>فِ\u003c/td>\u003ctd class='ar'>فُ\u003c/td>\u003c/tr>\u003ctr>\u003ctd class='ar'>ق\u003c/td>\u003ctd class='ar'>قَ\u003c/td>\u003ctd class='ar'>قِ\u003c/td>\u003ctd class='ar'>قُ\u003c/td>\u003c/tr>\u003ctr>\u003ctd class='ar'>ك\u003c/td>\u003ctd class='ar'>كَ\u003c/td>\u003ctd class='ar'>كِ\u003c/td>\u003ctd class='ar'>كُ\u003c/td>\u003c/tr>\u003ctr>\u003ctd class='ar'>ل\u003c/td>\u003ctd class='ar'>لَ\u003c/td>\u003ctd class='ar'>لِ\u003c/td>\u003ctd class='ar'>لُ\u003c/td>\u003c/tr>\u003ctr>\u003ctd class='ar'>م\u003c/td>\u003ctd class='ar'>مَ\u003c/td>\u003ctd class='ar'>مِ\u003c/td>\u003ctd class='ar'>مُ\u003c/td>\u003c/tr>\u003ctr>\u003ctd class='ar'>ن\u003c/td>\u003ctd class='ar'>نَ\u003c/td>\u003ctd class='ar'>نِ\u003c/td>\u003ctd class='ar'>نُ\u003c/td>\u003c/tr>\u003ctr>\u003ctd class='ar'>هـ\u003c/td>\u003ctd class='ar'>هَ\u003c/td>\u003ctd class='ar'>هِ\u003c/td>\u003ctd class='ar'>هُ\u003c/td>\u003c/tr>\u003ctr>\u003ctd class='ar'>و\u003c/td>\u003ctd class='ar'>وَ\u003c/td>\u003ctd class='ar'>وِ\u003c/td>\u003ctd class='ar'>وُ\u003c/td>\u003c/tr>\u003ctr>\u003ctd class='ar'>ي\u003c/td>\u003ctd class='ar'>يَ\u003c/td>\u003ctd class='ar'>يِ\u003c/td>\u003ctd class='ar'>يُ\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003c/section>\n\n\u003csection class=\"s6\">\u003ch2>\u003ci>6\u003c/i>\u003cspan>أشكال الحروف\u003cspan class=\"e\">Letter Forms\u003c/span>\u003c/span>\u003c/h2>\n\u003cdiv class=\"wrap\">\u003ctable id=\"ft\">\u003ctr>\u003cth>الحرف\u003c/th>\u003cth>أول الكلمة · Start\u003c/th>\u003cth>وسط الكلمة · Middle\u003c/th>\u003cth>آخر الكلمة · End\u003c/th>\u003c/tr>\u003ctr>\u003ctd class='ar'>ف\u003c/td>\u003ctd class='ar'>فـ\u003c/td>\u003ctd class='ar'>ـفـ\u003c/td>\u003ctd class='ar'>ـف\u003c/td>\u003c/tr>\u003ctr>\u003ctd class='ar'>ق\u003c/td>\u003ctd class='ar'>قـ\u003c/td>\u003ctd class='ar'>ـقـ\u003c/td>\u003ctd class='ar'>ـق\u003c/td>\u003c/tr>\u003ctr>\u003ctd class='ar'>ك\u003c/td>\u003ctd class='ar'>كـ\u003c/td>\u003ctd class='ar'>ـكـ\u003c/td>\u003ctd class='ar'>ـك\u003c/td>\u003c/tr>\u003ctr>\u003ctd class='ar'>ل\u003c/td>\u003ctd class='ar'>لـ\u003c/td>\u003ctd class='ar'>ـلـ\u003c/td>\u003ctd class='ar'>ـل\u003c/td>\u003c/tr>\u003ctr>\u003ctd class='ar'>م\u003c/td>\u003ctd class='ar'>مـ\u003c/td>\u003ctd class='ar'>ـمـ\u003c/td>\u003ctd class='ar'>ـم\u003c/td>\u003c/tr>\u003ctr>\u003ctd class='ar'>ن\u003c/td>\u003ctd class='ar'>نـ\u003c/td>\u003ctd class='ar'>ـنـ\u003c/td>\u003ctd class='ar'>ـن\u003c/td>\u003c/tr>\u003ctr>\u003ctd class='ar'>هـ\u003c/td>\u003ctd class='ar'>هـ\u003c/td>\u003ctd class='ar'>ـهـ\u003c/td>\u003ctd class='ar'>ـه\u003c/td>\u003c/tr>\u003ctr>\u003ctd class='ar'>و\u003c/td>\u003ctd class='ar'>و\u003c/td>\u003ctd class='ar'>ـو\u003c/td>\u003ctd class='ar'>ـو\u003c/td>\u003c/tr>\u003ctr>\u003ctd class='ar'>ي\u003c/td>\u003ctd class='ar'>يـ\u003c/td>\u003ctd class='ar'>ـيـ\u003c/td>\u003ctd class='ar'>ـي\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cdiv class=\"box note\">\u003cb>⚠️ ملاحظة · Note\u003c/b>الواو لا تتصل بالحرف الذي بعدها، مثل الراء والزاي. أما الهاء فلها أشكال متنوعة بحسب موضعها.\u003cspan class=\"e\">Waw doesn’t connect to the next letter, like ر and ز. Haa has varied shapes depending on its position.\u003c/span>\u003c/div>\n\u003cdiv class=\"box tip\">\u003cb>🔁 تذكّر · Remember\u003c/b>الحروف التي لا تتصل بما بعدها: \u003cspan class=\"ar\" style=\"font-size:1.5rem\">ا · د · ذ · ر · ز · و\u003c/span>\u003cspan class=\"e\">The letters that don’t connect to the next letter\u003c/span>\u003c/div>\u003c/section>\n\n\u003csection class=\"s1\">\u003ch2>\u003ci>7\u003c/i>\u003cspan>المفردات\u003cspan class=\"e\">Vocabulary\u003c/span>\u003c/span>\u003c/h2>\n\u003cdiv class=\"dots\">\n\u003cdiv class=\"c1 lc\" style=\"display:block;text-align:center\">\u003cdiv style=\"font-size:3rem\">🖊️\u003c/div>\u003cdiv class=\"ar\" style=\"font-size:1.6rem\">قَلَم\u003c/div>\u003cspan class=\"e\" style=\"text-align:center\">Pen\u003c/span>\u003c/div>\n\u003cdiv class=\"c2 lc\" style=\"display:block;text-align:center\">\u003cdiv style=\"font-size:3rem\">📖\u003c/div>\u003cdiv class=\"ar\" style=\"font-size:1.6rem\">كِتَاب\u003c/div>\u003cspan class=\"e\" style=\"text-align:center\">Book\u003c/span>\u003c/div>\n\u003cdiv class=\"c3 lc\" style=\"display:block;text-align:center\">\u003cdiv style=\"font-size:3rem\">💧\u003c/div>\u003cdiv class=\"ar\" style=\"font-size:1.6rem\">مَاء\u003c/div>\u003cspan class=\"e\" style=\"text-align:center\">Water\u003c/span>\u003c/div>\n\u003cdiv class=\"c4 lc\" style=\"display:block;text-align:center\">\u003cdiv style=\"font-size:3rem\">⭐\u003c/div>\u003cdiv class=\"ar\" style=\"font-size:1.6rem\">نَجْم\u003c/div>\u003cspan class=\"e\" style=\"text-align:center\">Star\u003c/span>\u003c/div>\n\u003cdiv class=\"c5 lc\" style=\"display:block;text-align:center\">\u003cdiv style=\"font-size:3rem\">✋\u003c/div>\u003cdiv class=\"ar\" style=\"font-size:1.6rem\">يَد\u003c/div>\u003cspan class=\"e\" style=\"text-align:center\">Hand\u003c/span>\u003c/div>\n\u003cdiv class=\"c6 lc\" style=\"display:block;text-align:center\">\u003cdiv style=\"font-size:3rem\">🌹\u003c/div>\u003cdiv class=\"ar\" style=\"font-size:1.6rem\">وَرْد\u003c/div>\u003cspan class=\"e\" style=\"text-align:center\">Roses\u003c/span>\u003c/div>\u003c/div>\n\u003cdiv class=\"box note\">\u003cb>💡 تنبيه · Tip\u003c/b>في كلمة «مَاء» حرف الهمزة (ء)، وسنتعلمه لاحقًا. تعلّم الكلمات الآن بالسمع والنطق.\u003cspan class=\"e\">The word “maa’” contains hamza (ء), which we learn later. For now learn these words by listening and speaking.\u003c/span>\u003c/div>\u003c/section>\n\n\u003csection class=\"s2\" id=\"quiz\">\u003ch2>\u003ci>8\u003c/i>\u003cspan>تدريبات الدرس\u003cspan class=\"e\">Exercises\u003c/span>\u003c/span>\u003c/h2>\n\u003ch3>التدريب الأول: اختر الحرف الصحيح\u003cspan class=\"e\">Exercise 1: Choose the correct letter\u003c/span>\u003c/h3>\u003cdiv id=\"mc\">\u003cnoscript>\u003col class=\"ar\" style=\"font-size:1.1rem\">\u003cli>أي حرف يشبه صوت F؟\u003cul>\u003cli>ق\u003c/li>\u003cli>ف\u003c/li>\u003cli>ك\u003c/li>\u003c/ul>\u003cdetails>\u003csummary>👀 الإجابة · Answer\u003c/summary>\u003cb>ف\u003c/b>\u003c/details>\u003c/li>\u003cli>أي حرف يشبه صوت K؟\u003cul>\u003cli>ق\u003c/li>\u003cli>ك\u003c/li>\u003cli>ل\u003c/li>\u003c/ul>\u003cdetails>\u003csummary>👀 الإجابة · Answer\u003c/summary>\u003cb>ك\u003c/b>\u003c/details>\u003c/li>\u003cli>أي حرف لا يتصل بما بعده؟\u003cul>\u003cli>م\u003c/li>\u003cli>ن\u003c/li>\u003cli>و\u003c/li>\u003c/ul>\u003cdetails>\u003csummary>👀 الإجابة · Answer\u003c/summary>\u003cb>و\u003c/b>\u003c/details>\u003c/li>\u003cli>أي حرف يشبه صوت Y؟\u003cul>\u003cli>ي\u003c/li>\u003cli>و\u003c/li>\u003cli>هـ\u003c/li>\u003c/ul>\u003cdetails>\u003csummary>👀 الإجابة · Answer\u003c/summary>\u003cb>ي\u003c/b>\u003c/details>\u003c/li>\u003cli>أي حرف يخرج من انطباق الشفتين؟\u003cul>\u003cli>ل\u003c/li>\u003cli>م\u003c/li>\u003cli>ن\u003c/li>\u003c/ul>\u003cdetails>\u003csummary>👀 الإجابة · Answer\u003c/summary>\u003cb>م\u003c/b>\u003c/details>\u003c/li>\u003c/ol>\u003c/noscript>\u003c/div>\n\u003ch3>التدريب الثاني: اقرأ بصوت مرتفع\u003cspan class=\"e\">Exercise 2: Read aloud\u003c/span>\u003c/h3>\n\u003cdiv class=\"chips ar\" style=\"font-size:1.4rem\">\u003cspan>فَ – قَ – كَ – لَ – مَ – نَ – هَ – وَ – يَ\u003c/span>\u003c/div>\u003cbr>\n\u003cdiv class=\"chips ar\" style=\"font-size:1.4rem\">\u003cspan>فِ – قِ – كِ – لِ – مِ – نِ – هِ – وِ – يِ\u003c/span>\u003c/div>\u003cbr>\n\u003cdiv class=\"chips ar\" style=\"font-size:1.4rem\">\u003cspan>فُ – قُ – كُ – لُ – مُ – نُ – هُ – وُ – يُ\u003c/span>\u003c/div>\n\u003ch3>التدريب الثالث: التمييز السمعي\u003cspan class=\"e\">Exercise 3: Listening\u003c/span>\u003c/h3>\n\u003cp>يقرأ معلمك أحد الحرفين وأنت تحدده 👂\u003cspan class=\"e\">Your teacher says one letter of each pair; you identify it.\u003c/span>\u003c/p>\n\u003cdiv class=\"chips ar\" style=\"font-size:1.4rem\">\u003cspan>قَ / كَ\u003c/span>\u003cspan>وَ / يَ\u003c/span>\u003cspan>هَ / حَ\u003c/span>\u003cspan>فَ / قَ\u003c/span>\u003c/div>\n\u003ch3>تدريب إضافي: طابق الحرف بنقاطه\u003cspan class=\"e\">Bonus: Match the letter to its dots\u003c/span>\u003c/h3>\n\u003cdiv id=\"fills\">\u003cnoscript>\u003cul class=\"ar\" style=\"font-size:1.2rem\">\u003cli>ف ↔ \u003cdetails style=\"display:inline-block\">\u003csummary>👀\u003c/summary>نقطة فوقه\u003c/details>\u003c/li>\u003cli>ق ↔ \u003cdetails style=\"display:inline-block\">\u003csummary>👀\u003c/summary>نقطتان فوقه\u003c/details>\u003c/li>\u003cli>ي ↔ \u003cdetails style=\"display:inline-block\">\u003csummary>👀\u003c/summary>نقطتان تحته\u003c/details>\u003c/li>\u003cli>ل ↔ \u003cdetails style=\"display:inline-block\">\u003csummary>👀\u003c/summary>بلا نقاط\u003c/details>\u003c/li>\u003c/ul>\u003cstyle>#chk{display:none}\u003c/style>\u003c/noscript>\u003c/div>\u003cbutton class=\"btn\" id=\"chk\">تحقق من الإجابات\u003c/button>\u003cdiv class=\"score\" id=\"sc\">\u003c/div>\u003c/section>\n\n\u003csection class=\"s3\">\u003ch2>\u003ci>9\u003c/i>\u003cspan>المحادثة والمراجعة\u003cspan class=\"e\">Speaking and Review\u003c/span>\u003c/span>\u003c/h2>\n\u003cp>قدّم نفسك \u003cb>دون مساعدة\u003c/b>:\u003cspan class=\"e\">Introduce yourself without help:\u003c/span>\u003c/p>\n\u003cdiv class=\"dlg\">\n\u003cdiv class=\"m a\">\u003cdiv class=\"ar\">\u003cspan class=\"ic\">🕊️\u003c/span>السَّلَامُ عَلَيْكُمْ.\u003c/div>\u003c/div>\n\u003cdiv class=\"m l\">\u003cdiv class=\"ar\">\u003cspan class=\"ic\">🏷️\u003c/span>اسْمِي ... .\u003c/div>\u003c/div>\n\u003cdiv class=\"m a\">\u003cdiv class=\"ar\">\u003cspan class=\"ic\">🌍\u003c/span>أَنَا مِنْ ... .\u003c/div>\u003c/div>\n\u003cdiv class=\"m l\">\u003cdiv class=\"ar\">\u003cspan class=\"ic\">📚\u003c/span>أَنَا أَتَعَلَّمُ اللُّغَةَ الْعَرَبِيَّةَ.\u003csmall>I am learning the Arabic language.\u003c/small>\u003c/div>\u003c/div>\n\u003cdiv class=\"m a\">\u003cdiv class=\"ar\">\u003cspan class=\"ic\">😊\u003c/span>أَنَا بِخَيْرٍ، الْحَمْدُ لِلَّهِ.\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"box tip\">\u003cb>🔁 مراجعة · Review\u003c/b>راجع مع معلمك الحروف الستة السابقة \u003cspan class=\"ar\" style=\"font-size:1.4rem\">ص ض ط ظ ع غ\u003c/span> وكل ما تعلمته.\u003cspan class=\"e\">Review the previous six letters and everything you have learned.\u003c/span>\u003c/div>\u003c/section>\n\n\u003csection class=\"s4\">\u003ch2>\u003ci>🏠\u003c/i>\u003cspan>الواجب المنزلي\u003cspan class=\"e\">Homework\u003c/span>\u003c/span>\u003c/h2>\n\u003cul>\u003cli>اكتب الحروف التسعة 5 مرات\u003cspan class=\"e\">Write the nine letters 5 times\u003c/span>\u003c/li>\n\u003cli>سجّل صوتك وأنت تنطق الحروف بالحركات الثلاث 🎙\u003cspan class=\"e\">Record yourself saying the letters with the three short vowels\u003c/span>\u003c/li>\n\u003cli>اقرأ الكلمات: \u003cspan class=\"ar\">قَلَم – كِتَاب – مَاء – نَجْم – يَد\u003c/span>\u003cspan class=\"e\">Read the five words\u003c/span>\u003c/li>\n\u003cli>راجع الحروف الهجائية كاملة\u003cspan class=\"e\">Review the whole alphabet\u003c/span>\u003c/li>\u003c/ul>\u003c/section>\n\n\u003csection class=\"s5\">\u003ch2>\u003ci>🎉\u003c/i>\u003cspan>إنجاز مهم في المستوى A0\u003cspan class=\"e\">A Major A0 Milestone\u003c/span>\u003c/span>\u003c/h2>\n\u003cp style=\"text-align:center;font-size:1.2rem\">\u003cb>اكتمل تقديم الحروف الهجائية الـ28!\u003c/b>\u003cspan class=\"e\" style=\"text-align:center\">All 28 letters of the Arabic alphabet have been introduced!\u003c/span>\u003c/p>\n\u003cdiv class=\"alpha\" id=\"alpha\">\u003cdiv class=\"c1\">\u003cb>ا\u003c/b>\u003csmall>2\u003c/small>\u003c/div>\u003cdiv class=\"c1\">\u003cb>ب\u003c/b>\u003csmall>2\u003c/small>\u003c/div>\u003cdiv class=\"c1\">\u003cb>ت\u003c/b>\u003csmall>2\u003c/small>\u003c/div>\u003cdiv class=\"c1\">\u003cb>ث\u003c/b>\u003csmall>2\u003c/small>\u003c/div>\u003cdiv class=\"c2\">\u003cb>ج\u003c/b>\u003csmall>3\u003c/small>\u003c/div>\u003cdiv class=\"c2\">\u003cb>ح\u003c/b>\u003csmall>3\u003c/small>\u003c/div>\u003cdiv class=\"c2\">\u003cb>خ\u003c/b>\u003csmall>3\u003c/small>\u003c/div>\u003cdiv class=\"c2\">\u003cb>د\u003c/b>\u003csmall>3\u003c/small>\u003c/div>\u003cdiv class=\"c2\">\u003cb>ذ\u003c/b>\u003csmall>3\u003c/small>\u003c/div>\u003cdiv class=\"c3\">\u003cb>ر\u003c/b> nize the final nine letters\u003c/span>\u003c/li>\u003cli>☐ \u003cb>النطق:\u003c/b> أنطقها نطقًا صحيحًا\u003cspan class=\"e\">I pronounce them correctly\u003c/span>\u003c/li>\u003cli>☐ \u003cb>التمييز:\u003c/b> أفرّق بين ق وك، وبين و وي\u003cspan class=\"e\">I tell ق from ك, and و from ي\u003c/span>\u003c/li>\u003cli>☐ \u003cb>القراءة:\u003c/b> أقرؤها بالحركات القصيرة\u003cspan class=\"e\">I read them with short vowels\u003c/span>\u003c/li>\u003cli>☐ \u003cb>الاتصال:\u003c/b> أعرف الحروف التي لا تتصل بما بعدها\u003cspan class=\"e\">I know the letters that don’t connect\u003c/span>\u003c/li>\u003cli>☐ \u003cb>المحادثة:\u003c/b> أقدّم نفسي دون مساعدة\u003cspan class=\"e\">I introduce myself without help\u003c/span>\u003c/li>\u003c/ul>\u003c/noscript>\u003c/div>\u003c/section>\n\u003c/main>\n\u003cfooter>مبروك! 🎉 عرفتَ حروف العربية كلها، والآن نبدأ رحلة القراءة.\u003c/footer>\n\u003cscript>function mk(id,D){var el=document.getElementById(id);D.forEach(function(q,i){var d=document.createElement(\"div\");d.className=\"q\";var p=document.createElement(\"p\");p.textContent=(i+1)+\". \"+q[0];d.appendChild(p);var o=document.createElement(\"div\");o.className=\"opts\";var fb=document.createElement(\"div\");fb.className=\"fb\";\nq[1].forEach(function(t,j){var b=document.createElement(\"button\");b.className=\"opt ar\";b.textContent=t;b.onclick=function(){if(d.dataset.d)return;d.dataset.d=1;b.classList.add(j==q[2]?\"ok\":\"no\");if(j==q[2]){fb.textContent=\"✅ أحسنت!\"}else{fb.textContent=\"❌ الصحيح: \"+q[1][q[2]];o.children[q[2]].classList.add(\"ok\")}};o.appendChild(b)});d.appendChild(o);d.appendChild(fb);el.appendChild(d)})}\nmk(\"mc\",[[\"أي حرف يشبه صوت F؟\",[\"ق\",\"ف\",\"ك\"],1],[\"أي حرف يشبه صوت K؟\",[\"ق\",\"ك\",\"ل\"],1],[\"أي حرف لا يتصل بما بعده؟\",[\"م\",\"ن\",\"و\"],2],[\"أي حرف يشبه صوت Y؟\",[\"ي\",\"و\",\"هـ\"],0],[\"أي حرف يخرج من انطباق الشفتين؟\",[\"ل\",\"م\",\"ن\"],1]]);\nvar FL=[[\"ف\",\"نقطة فوقه\"],[\"ق\",\"نقطتان فوقه\"],[\"ي\",\"نقطتان تحته\"],[\"ل\",\" t-align:center;font-weight:700}\n.c1{background:var(--bl);border-color:var(--b1)}.c1 .big{color:var(--b1)}\n.c2{background:var(--gr);border-color:var(--g1)}.c2 .big{color:var(--g1)}\n.c3{background:var(--or);border-color:var(--o1)}.c3 .big{color:var(--o1)}\n.c4{background:var(--pu);border-color:var(--p1)}.c4 .big{color:var(--p1)}\n.dots{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}\n.dots .lc{margin:0}\ndetails{display:inline-block;margin-top:4px}summary{cursor:pointer;color:var(--b1);font-weight:700}\n.chips.ar span{font-family:Amiri,serif}\n@media(max-width:520px){.lc{flex-direction:column;text-align:center}}\n.c5{background:#fde2e2;border-color:var(--r1)}.c5 .big{color:var(--r1)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]) .c5{background:#4a1f24}}\n:root[data-theme=\"dark\"] .c5{background:#4a1f24}\n.wd{display:inline-flex;align-items:center;gap:6px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:3px 10px;margin:3px 3px 3px 0;font-size:.9rem}\n.wd i{font-style:normal;font-size:1.4rem}.wd b{font-size:1.2rem}\n.c6{background:#dbf1fb;border-color:#0ea5e9}.c6 .big{color:#0ea5e9}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]) .c6{background:#0f3347}}\n:root[data-theme=\"dark\"] .c6{background:#0f3347}\n.lc ul{margin:6px 0 0}\n.alpha{display:grid;grid-template-columns:repeat(auto-fit,minmax(54px,1fr));gap:8px}\n.alpha div{border:2px solid;border-radius:14px;text-align:center;padding:6px 0 2px;position:relative}\n.alpha b{font-family:Amiri,serif;font-size:1.9rem;line-height:1.2;display:block}\n.alpha small{font-size:.7rem;color:var(--mut)}\n.alpha .c1,.alpha .c2,.alpha .c3,.alpha .c4,.alpha .c5{border-color:currentColor}\n.alpha .c1{color:var(--b1)}.alpha .c2{color:var(--g1)}.alpha .c3{color:var(--o1)}.alpha .c4{color:var(--p1)}.alpha .c5{color:var(--r1)}\n.bar{height:10px;border-radius:6px;background:var(--o1);width:36px;margin:8px auto 0}\ LaT9mGr3GwDoVhD6R78jRs+YGZLEZDBWEuZUQrmMdKOcfZclMhlh9B0lJJVgemd6Yx//9k=\">\n\u003cdiv class=\"brand\">Arabic with Nour El-Din\u003c/div>\n\u003cdiv class=\"ar\" style=\"font-size:1.1rem\">مستوى المبتدئين A0 · الحركات الطويلة\u003c/div>\n\u003ch1 class=\"ar\" style=\"font-size:2.1rem\">الدرس السابع: الحركات الطويلة (المدود)\u003c/h1>\n\u003cdiv class=\"en\">Lesson 07 · A0 · Long Vowels\u003c/div>\n\u003cdiv class=\"ar\" style=\"font-size:2.3rem;margin-top:6px\">المد بالألف والواو والياء\u003cbr>\u003cspan style=\"letter-spacing:10px\">ا – و – ي\u003c/span>\u003c/div>\n\u003cdiv class=\"en\" style=\"margin-top:4px\">Long Vowels: Alif, Waw, Yaa\u003c/div>\n\u003cdiv class=\"tags\">\u003cspan>⏱ الصوت القصير والطويل\u003c/span>\u003cspan>👂 الاستماع\u003c/span>\u003cspan>🗣 النطق\u003c/span>\u003cspan>📖 القراءة\u003c/span>\u003c/div>\n\u003c/header>\n\u003cmain>\n\n\u003csection class=\"s1\">\u003ch2>\u003ci>1\u003c/i>\u003cspan>أهداف الدرس\u003cspan class=\"e\">Lesson Objectives\u003c/span>\u003c/span>\u003c/h2>\n\u003cp>بنهاية الدرس ستستطيع أن:\u003cspan class=\"e\">By the end of this lesson you will be able to:\u003c/span>\u003c/p>\n\u003cul>\n\u003cli>تفهم الفرق بين الحركة القصيرة والطويلة ⏱\u003cspan class=\"e\">Understand the difference between short and long vowels\u003c/span>\u003c/li>\n\u003cli>تتعرف على حروف المد الثلاثة 🔤\u003cspan class=\"e\">Recognize the three long-vowel letters\u003c/span>\u003c/li>\n\u003cli>تقرأ المقاطع التي فيها مد 📖\u003cspan class=\"e\">Read syllables that contain a long vowel\u003c/span>\u003c/li>\n\u003cli>تميّز بين الفتحة والكسرة والضمة والمدود 👂\u003cspan class=\"e\">Distinguish fatha, kasra, damma and the long vowels\u003c/span>\u003c/li>\n\u003cli>تقرأ كلمات بسيطة فيها مدود 🌟\u003cspan class=\"e\">Read simple words containing long vowels\u003c/span>\u003c/li>\u003c/ul>\u003c/section>\n\n\u003csection class=\"s2\">\u003ch2>\u003ci>2\u003c/i>\u003cspan>ما معنى المد؟\u003cspan class=\"e\">What is a Long Vowel?\u003c/span>\u003c/span>\u003c/h2>\n\u003cp>في العربية حركات \u003cb>قصيرة\u003c/b> وحركات \u003cb>طويلة\u003c/b>. القصيرة تستغرق زمنًا قليلًا، وفي الطويلة \u003cb>نمدّ الصوت\u003c/b> قليلًا.\u003cspan class=\"e\">Arabic has short and long vowels. A short vowel is quick; for a long one we stretch the sound a little.\u003c/span>\u003c/p>\n\u003cdiv class=\"dots\">\n\u003cdiv class=\"c3 lc\" style=\"display:block;text-align:center\">\u003cdiv class=\"big\">بَ\u003c/div>\u003cspan class=\"lat\">Ba\u003c/span>\u003cbr>صوت قصير\u003cspan class=\"e\" style=\"text-align:center\">Short sound\u003c/span>\u003cdiv class=\"bar\">\u003c/div>\u003c/div>\n\u003cdiv class=\"c1 lc\" style=\"display:block;text-align:center\">\u003cdiv class=\"big\">بَا\u003c/div>\u003cspan class=\"lat\">Bā\u003c/span>\u003cbr>صوت طويل\u003cspan class=\"e\" style=\"text-align:center\">Long sound\u003c/span>\u003cdiv class=\"bar l\">\u003c/div>\u003c/div>\u003c/div>\n\u003cp style=\"text-align:center\">👀 لاحظ الفرق في زمن النطق · Notice the difference in time\u003c/p>\u003c/section>\n\n\u003csection class=\"s3\">\u003ch2>\u003ci>3\u003c/i>\u003cspan>أنواع المدود الثلاثة\u003cspan class=\"e\">The Three Long Vowels\u003c/span>\u003c/span>\u003c/h2>\u003cdiv id=\"mads\">\u003cdiv class=\"lc c1\" style=\"display:block\">\u003cb class=\"ar\" style=\"font-size:1.3rem\">أولًا: المد بالألف (ا)\u003c/b>\u003cspan class=\"e\">Long vowel with Alif\u003c/span>يأتي بعد الفتحة.\u003cspan class=\"e\">After a fatha.\u003c/span>\u003cdiv class=\"ar\" style=\"font-size:2.2rem;text-align:center;margin:8px 0\">بَ + ا = بَا\u003c/div>\u003cdiv class=\"lat\" style=\"text-align:center\">Ba → Bā\u003c/div>\u003cdiv class=\"chips\" style=\"justify-content:center;margin:10px 0\">\u003cspan style=\"background:var(--card);color:var(--ink);text-align:center\">\u003cb class=\"ar\" style=\"font-size:1.5rem;display:block\">بَا\u003c/b>\u003cspan class=\"lat\">Bā\u003c/span>\u003c/span>\u003cspan style=\"background:var(--card);color:var(--ink);text-align:center\">\u003cb class=\"ar\" style=\"font-size:1.5rem;display:block\">تَا\u003c/b>\u003cspan class=\"lat\">Tā\u003c/span>\u003c/span>\u003cspan style=\"background:var(--card);color:var(--ink);text-align:center\">\u003cb class=\"ar\" style=\"font-size:1.5rem;display:block\">سَا\u003c/b>\u003cspan class=\"lat\">Sā\u003c/span>\u003c/span>\u003cspan style=\"background:var(--card);color:var(--ink);text-align:center\">\u003cb class=\"ar\" style=\"font-size:1.5rem;display:block\">مَا\u003c/b>\u003cspan class=\"lat\">Mā\u003c/span>\u003c/span>\u003cspan style=\"background:var(--card);color:var(--ink);text-align:center\">\u003cb class=\"ar\" style=\"font-size:1.5rem;display:block\">قَا\u003c/b>\u003cspan class=\"lat\">Qā\u003c/span>\u003c/span>\u003c/div>\u003cdiv>\u003cspan class=\"wd\">\u003ci>🚪\u003c/i>\u003cb class=\"ar\">بَاب\u003c/b> Door\u003c/span>\u003cspan class=\"wd\">\u003ci>💧\u003c/i>\u003cb class=\"ar\">مَاء\u003c/b> Water\u003c/span>\u003cspan class=\"wd\">\u003ci>📖\u003c/i>\u003cb class=\"ar\">كِتَاب\u003c/b> Book\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lc c2\" style=\"display:block\">\u003cb class=\"ar\" style=\"font-size:1.3rem\">ثانيًا: المد بالواو (و)\u003c/b>\u003cspan class=\"e\">Long vowel with Waw\u003c/span>يأتي بعد الضمة، وتكون الواو ساكنة.\u003cspan class=\"e\">After a damma; the waw is silent (sukoon).\u003c/span>\u003cdiv class=\"ar\" style=\"font-size:2.2rem;text-align:center;margin:8px 0\">بُ + وْ = بُو\u003c/div>\u003cdiv class=\"lat\" style=\"text-align:center\">Bu → Bū\u003c/div>\u003cdiv class=\"chips\" style=\"justify-content:center;margin:10px 0\">\u003cspan style=\"background:var(--card);color:var(--ink);text-align:center\">\u003cb class=\"ar\" style=\"font-size:1.5rem;display:block\">بُو\u003c/b>\u003cspan class=\"lat\">Bū\u003c/span>\u003c/span>\u003cspan style=\"background:var(--card);color:var(--ink);text-align:center\">\u003cb class=\"ar\" style=\"font-size:1.5rem;display:block\">تُو\u003c/b>\u003cspan class=\"lat\">Tū\u003c/span>\u003c/span>\u003cspan style=\"background:var(--card);color:var(--ink);text-align:center\">\u003cb class=\"ar\" style=\"font-size:1.5rem;display:block\">سُو\u003c/b>\u003cspan class=\"lat\">Sū\u003c/span>\u003c/span>\u003cspan style=\"background:var(--card);color:var(--ink);text-align:center\">\u003cb class=\"ar\" style=\"font-size:1.5rem;display:block\">مُو\u003c/b>\u003cspan class=\"lat\">Mū\u003c/span>\u003c/span>\u003cspan style=\"background:var(--card);color:var(--ink);text-align:center\">\u003cb class=\"ar\" style=\"font-size:1.5rem;display:block\">قُو\u003c/b>\u003cspan class=\"lat\">Qū\u003c/span>\u003c/span>\u003c/div>\u003cdiv>\u003cspan class=\"wd\">\u003ci>💡\u003c/i>\u003cb class=\"ar\">نُور\u003c/b> Light\u003c/span>\u003cspan class=\"wd\">\u003ci>🛒\u003c/i>\u003cb class=\"ar\">سُوق\u003c/b> Market\u003c/span>\u003cspan class=\"wd\">\u003ci>🗣️\u003c/i>\u003cb class=\"ar\">يَقُولُ\u003c/b> He says\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lc c3\" style=\"display:block\">\u003cb class=\"ar\" style=\"font-size:1.3rem\">ثالثًا: المد بالياء (ي)\u003c/b>\u003cspan class=\"e\">Long vowel with Yaa\u003c/span>يأتي بعد الكسرة، وتكون الياء ساكنة.\u003cspan class=\"e\">After a kasra; the yaa is silent (sukoon).\u003c/span>\u003cdiv class=\"ar\" style=\"font-size:2.2rem;text-align:center;margin:8px 0\">بِ + يْ = بِي\u003c/div>\u003cdiv class=\"lat\" style=\"text-align:center\">Bi → Bī\u003c/div>\u003cdiv class=\"chips\" style=\"justify-content:center;margin:10px 0\">\u003cspan style=\"background:var(--card);color:var(--ink);text-align:center\">\u003cb class=\"ar\" style=\"font-size:1.5rem;display:block\">بِي\u003c/b>\u003cspan class=\"lat\">Bī\u003c/span>\u003c/span>\u003cspan style=\"background:var(--card);color:var(--ink);text-align:center\">\u003cb class=\"ar\" style=\"font-size:1.5rem;display:block\">تِي\u003c/b>\u003cspan class=\"lat\">Tī\u003c/span>\u003c/span>\u003cspan style=\"background:var(--card);color:var(--ink);text-align:center\">\u003cb class=\"ar\" style=\"font-size:1.5rem;display:block\">سِي\u003c/b>\u003cspan class=\"lat\">Sī\u003c/span>\u003c/span>\u003cspan style=\"background:var(--card);color:var(--ink);text-align:center\">\u003cb class=\"ar\" style=\"font-size:1.5rem;display:block\">مِي\u003c/b>\u003cspan class=\"lat\">Mī\u003c/span>\u003c/span>\u003cspan style=\"background:var(--card);color:var(--ink);text-align:center\">\u003cb class=\"ar\" style=\"font-size:1.5rem;display:block\">قِي\u003c/b>\u003cspan class=\"lat\">Qī\u003c/span>\u003c/span>\u003c/div>\u003cdiv>\u003cspan class=\"wd\">\u003ci>🐘\u003c/i>\u003cb class=\"ar\">فِيل\u003c/b> Elephant\u003c/span>\u003cspan class=\"wd\">\u003ci>🏢\u003c/i>\u003cb class=\"ar\">كَبِير\u003c/b> Big\u003c/span>\u003cspan class=\"wd\">\u003ci>🌺\u003c/i>\u003cb class=\"ar\">جَمِيل\u003c/b> Beautiful\u003c/span>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"box note\">\u003cb>⚠️ انتبه · Careful\u003c/b>ليست كل ألف أو واو أو ياء حرف مد. تكون مدًّا حين تسبقها حركتها (فتحة، ضمة، كسرة) وتكون ساكنة. وسنتدرب على ذلك كثيرًا.\u003cspan class=\"e\">Not every alif, waw or yaa is a long vowel. It is one when it follows its matching short vowel and is silent (sukoon). We will practice this a lot.\u003c/span>\u003c/div>\u003c/section>\n\n\u003csection class=\"s4\">\u003ch2>\u003ci>4\u003c/i>\u003cspan>قاعدة مهمة\u003cspan class=\"e\">Key Rule\u003c/span>\u003c/span>\u003c/h2>\n\u003cdiv class=\"wrap\">\u003ctable>\u003ctr>\u003cth>الحركة · Vowel\u003c/th>\u003cth>حرف المد · Letter\u003c/th>\u003cth>المثال · Example\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>فتحة · Fatha\u003c/td>\u003ctd class=\"ar\">ألف · ا\u003c/td>\u003ctd class=\"ar\">بَا\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>ضمة · Damma\u003c/td>\u003ctd class=\"ar\">واو · و\u003c/td>\u003ctd class=\"ar\">بُو\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>كسرة · Kasra\u003c/td>\u003ctd class=\"ar\">ياء · ي\u003c/td>\u003ctd class=\"ar\">بِي\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cdiv class=\"box tip\">\u003cb>🧠 احفظها · Memorize\u003c/b>فتحة ← ألف · ضمة ← واو · كسرة ← ياء\u003cspan class=\"e\">Fatha → alif · Damma → waw · Kasra → yaa\u003c/span>\u003c/div>\u003c/section>\n\n\u003csection class=\"s5\">\u003ch2>\u003ci>5\u003c/i>\u003cspan>المقارنة بين الحركات والمدود\u003cspan class=\"e\">Short vs. Long\u003c/span>\u003c/span>\u003c/h2>\n\u003cdiv class=\"wrap\">\u003ctable>\u003ctr>\u003cth>قصير · Short\u003c/th>\u003cth>طويل · Long\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd class=\"ar\">بَ\u003c/td>\u003ctd class=\"ar\">بَا\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"ar\">بُ\u003c/td>\u003ctd class=\"ar\">بُو\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"ar\">بِ\u003c/td>\u003ctd class=\"ar\">بِي\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"ar\">تَ\u003c/td>\u003ctd class=\"ar\">تَا\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"ar\">تُ\u003c/td>\u003ctd class=\"ar\">تُو\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"ar\">تِ\u003c/td>\u003ctd class=\"ar\">تِي\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cdiv class=\"box note\">\u003cb>🎯 نصيحة · Tip\u003c/b>انطق كل زوج، ولا تبالغ في إطالة الصوت.\u003cspan class=\"e\">Say each pair, but don’t over-stretch the long sound.\u003c/span>\u003c/div>\u003c/section>\n\n\u003csection class=\"s6\">\u003ch2>\u003ci>6\u003c/i>\u003cspan>القراءة والتطبيق\u003cspan class=\"e\">Reading Practice\u003c/span>\u003c/span>\u003c/h2>\n\u003cp>\u003cb>المد بالألف:\u003c/b>\u003c/p>\u003cdiv class=\"chips ar\" style=\"font-size:1.5rem\">\u003cspan>بَا\u003c/span>\u003cspan>تَا\u003c/span>\u003cspan>جَا\u003c/span>\u003cspan>سَا\u003c/span>\u003cspan>مَا\u003c/span>\u003cspan>قَا\u003c/span>\u003c/div>\n\u003cp>\u003cb>المد بالواو:\u003c/b>\u003c/p>\u003cdiv class=\"chips ar\" style=\"font-size:1.5rem\">\u003cspan>بُو\u003c/span>\u003cspan>تُو\u003c/span>\u003cspan>جُو\u003c/span>\u003cspan>سُو\u003c/span>\u003cspan>مُو\u003c/span>\u003cspan>نُو\u003c/span>\u003c/div>\n\u003cp>\u003cb>المد بالياء:\u003c/b>\u003c/p>\u003cdiv class=\"chips ar\" style=\"font-size:1.5rem\">\u003cspan>بِي\u003c/span>\u003cspan>تِي\u003c/span>\u003cspan>جِي\u003c/span>\u003cspan>سِي\u003c/span>\u003cspan>مِي\u003c/span>\u003cspan>فِي\u003c/span>\u003c/div>\n\u003cp style=\"margin-top:12px\">ثم اقرأ الكلمات:\u003cspan class=\"e\">Now read the words:\u003c/span>\u003c/p>\u003cdiv class=\"dots\" id=\"words\">\u003cdiv class=\"c1 lc\" style=\"display:block;text-align:center\">\u003cdiv style=\"font-size:3rem\">🚪\u003c/div>\u003cdiv class=\"ar\" style=\"font-size:1.7rem\">بَاب\u003c/div>\u003cspan class=\"e\" style=\"text-align:center\">Door\u003c/span>\u003c/div>\u003cdiv class=\"c2 lc\" style=\"display:block;text-align:center\">\u003cdiv style=\"font-size:3rem\">💧\u003c/div>\u003cdiv class=\"ar\" style=\"font-size:1.7rem\">مَاء\u003c/div>\u003cspan class=\"e\" style=\"text-align:center\">Water\u003c/span>\u003c/div>\u003cdiv class=\"c3 lc\" style=\"display:block;text-align:center\">\u003cdiv style=\"font-size:3rem\">💡\u003c/div>\u003cdiv class=\"ar\" style=\"font-size:1.7rem\">نُور\u003c/div>\u003cspan class=\"e\" style=\"text-align:center\">Light\u003c/span>\u003c/div>\u003cdiv class=\"c4 lc\" style=\"display:block;text-align:center\">\u003cdiv style=\"font-size:3rem\">🛒\u003c/div>\u003cdiv class=\"ar\" style=\"font-size:1.7rem\">سُوق\u003c/div>\u003cspan class=\"e\" style=\"text-align:center\">Market\u003c/span>\u003c/div>\u003cdiv class=\"c5 lc\" style=\"display:block;text-align:center\">\u003cdiv style=\"font-size:3rem\">🐘\u003c/div>\u003cdiv class=\"ar\" style=\"font-size:1.7rem\">فِيل\u003c/div>\u003cspan class=\"e\" style=\"text-align:center\">Elephant\u003c/span>\u003c/div>\u003cdiv class=\"c6 lc\" style=\"display:block;text-align:center\">\u003cdiv style=\"font-size:3rem\">🌺\u003c/div>\u003cdiv class=\"ar\" style=\"font-size:1.7rem\">جَمِيل\u003c/div>\u003cspan class=\"e\" style=\"text-align:center\">Beautiful\u003c/span>\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection class=\"s1\" id=\"quiz\">\u003ch2>\u003ci>7\u003c/i>\u003cspan>تدريبات الدرس\u003cspan class=\"e\">Exercises\u003c/span>\u003c/span>\u003c/h2>\n\u003ch3>التدريب الأول: اختر الإجابة الصحيحة\u003cspan class=\"e\">Exercise 1: Choose the correct answer\u003c/span>\u003c/h3>\u003cdiv id=\"mc\">\u003cnoscript>\u003col class=\"ar\" style=\"font-size:1.1rem\">\u003cli>ما حرف المد الذي يأتي بعد الفتحة؟\u003cul>\u003cli>الألف\u003c/li>\u003cli>الواو\u003c/li>\u003cli>الياء\u003c/li>\u003c/ul>\u003cdetails>\u003csummary>👀 الإجابة · Answer\u003c/summary>\u003cb>الألف\u003c/b>\u003c/details>\u003c/li>\u003cli>ما المقطع الذي يحتوي على مد بالواو؟\u003cul>\u003cli>بَا\u003c/li>\u003cli>بُو\u003c/li>\u003cli>بِي\u003c/li>\u003c/ul>\u003cdetails>\u003csummary>👀 الإجابة · Answer\u003c/summary>\u003cb>بُو\u003c/b>\u003c/details>\u003c/li>\u003cli>أي حركة تسبق الياء في المد؟\u003cul>\u003cli>الفتحة\u003c/li>\u003cli>الضمة\u003c/li>\u003cli>الكسرة\u003c/li>\u003c/ul>\u003cdetails>\u003csummary>👀 الإجابة · Answer\u003c/summary>\u003cb>الكسرة\u003c/b>\u003c/details>\u003c/li>\u003cli>أي كلمة تحتوي على مد بالألف؟\u003cul>\u003cli>نُور\u003c/li>\u003cli>بَاب\u003c/li>\u003cli>فِيل\u003c/li>\u003c/ul>\u003cdetails>\u003csummary>👀 الإجابة · Answer\u003c/summary>\u003cb>بَاب\u003c/b>\u003c/details>\u003c/li>\u003cli>أي كلمة تحتوي على مد بالياء؟\u003cul>\u003cli>سُوق\u003c/li>\u003cli>مَاء\u003c/li>\u003cli>فِيل\u003c/li>\u003c/ul>\u003cdetails>\u003csummary>👀 الإجابة · Answer\u003c/summary>\u003cb>فِيل\u003c/b>\u003c/details>\u003c/li>\u003c/ol>\u003c/noscript>\u003c/div>\n\u003ch3>التدريب الثاني: اقرأ بصوت مرتفع\u003cspan class=\"e\">Exercise 2: Read aloud\u003c/span>\u003c/h3>\n\u003cdiv class=\"chips ar\" style=\"font-size:1.5rem\">\u003cspan>بَ – بَا\u003c/span>\u003cspan>بُ – بُو\u003c/span>\u003cspan>بِ – بِي\u003c/span>\u003cspan>مَ – مَا\u003c/span>\u003cspan>مُ – مُو\u003c/span>\u003cspan>مِ – مِي\u003c/span>\u003c/div>\n\u003ch3>التدريب الثالث: قصير أم طويل؟\u003cspan class=\"e\">Exercise 3: Short or long?\u003c/span>\u003c/h3>\n\u003cp>ينطق معلمك مقطعًا وتحدد: قصير أم طويل؟ 👂 وهذا تدريب بصري:\u003cspan class=\"e\">Your teacher says a syllable and you decide. Here is a visual version:\u003c/span>\u003c/p>\u003cdiv id=\"sl\">\u003cnoscript>\u003col class=\"ar\" style=\"font-size:1.1rem\">\u003cli>بَ\u003cul>\u003cli>قصير\u003c/li>\u003cli>طويل\u003c/li>\u003c/ul>\u003cdetails>\u003csummary>👀 الإجابة · Answer\u003c/summary>\u003cb>قصير\u003c/b>\u003c/details>\u003c/li>\u003cli>بُو\u003cul>\u003cli>قصير\u003c/li>\u003cli>طويل\u003c/li>\u003c/ul>\u003cdetails>\u003csummary>👀 الإجابة · Answer\u003c/summary>\u003cb>طويل\u003c/b>\u003c/details>\u003c/li>\u003cli>تِي\u003cul>\u003cli>قصير\u003c/li>\u003cli>طويل\u003c/li>\u003c/ul>\u003cdetails>\u003csummary>👀 الإجابة · Answer\u003c/summary>\u003cb>طويل\u003c/b>\u003c/details>\u003c/li>\u003cli>مُ\u003cul>\u003cli>قصير\u003c/li>\u003cli>طويل\u003c/li>\u003c/ul>\u003cdetails>\u003csummary>👀 الإجابة · Answer\u003c/summary>\u003cb>قصير\u003c/b>\u003c/details>\u003c/li>\u003cli>سَا\u003cul>\u003cli>قصير\u003c/li>\u003cli>طويل\u003c/li>\u003c/ul>\u003cdetails>\u003csummary>👀 الإجابة · Answer\u003c/summary>\u003cb>طويل\u003c/b>\u003c/details>\u003c/li>\u003cli>قِ\u003cul>\u003cli>قصير\u003c/li>\u003cli>طويل\u003c/li>\u003c/ul>\u003cdetails>\u003csummary>👀 الإجابة · Answer\u003c/summary>\u003cb>قصير\u003c/b>\u003c/details>\u003c/li>\u003c/ol>\u003c/noscript>\u003c/div>\u003c/section>\n\n\u003csection class=\"s2\">\u003ch2>\u003ci>8\u003c/i>\u003cspan>المحادثة والمراجعة\u003cspan class=\"e\">Speaking and Review\u003c/span>\u003c/span>\u003c/h2>\n\u003cdiv class=\"dlg\">\n\u003cdiv class=\"m a\">\u003cdiv class=\"ar\">\u003cspan class=\"ic\">🏷️\u003c/span>مَا اسْمُكَ؟\u003c/div>\u003c/div>\n\u003cdiv class=\"m l\">\u003cdiv class=\"ar\">\u003cspan class=\"ic\">🌍\u003c/span>مِنْ أَيْنَ أَنْتَ؟\u003c/div>\u003c/div>\n\u003cdiv class=\"m a\">\u003cdiv class=\"ar\">\u003cspan class=\"ic\">📚\u003c/span>هَلْ تَتَعَلَّمُ الْعَرَبِيَّةَ؟\u003c/div>\u003csmall>Are you learning Arabic?\u003c/small>\u003c/div>\u003c/div>\n\u003cdiv class=\"box tip\">\u003cb>📖 بعد ذلك · Then\u003c/b>اقرأ الكلمات التي فيها مدود: بَاب · نُور · فِيل\u003cspan class=\"e\">Then read the words with long vowels.\u003c/span>\u003c/div>\u003c/section>\n\n\u003csection class=\"s3\">\u003ch2>\u003ci>9\u003c/i>\u003cspan>الأخطاء الشائعة\u003cspan class=\"e\">Common Mistakes\u003c/span>\u003c/span>\u003c/h2>\n\u003cdiv class=\"wrap\">\u003ctable>\u003ctr>\u003cth>الخطأ · Mistake\u003c/th>\u003cth>التصحيح · Fix\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>نطق بَا مثل بَ\u003c/td>\u003ctd>مُدّ الصوت قليلًا\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>المبالغة في إطالة المد\u003c/td>\u003ctd>أطِل بقدر معتدل\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>اعتبار كل و وي مدًّا\u003c/td>\u003ctd>تأكد من الحركة قبلهما والسكون\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003c/section>\n\n\u003csection class=\"s4\">\u003ch2>\u003ci>🏠\u003c/i>\u003cspan>الواجب المنزلي\u003cspan class=\"e\">Homework\u003c/span>\u003c/span>\u003c/h2>\n\u003cul>\u003cli>اكتب المقاطع الثلاثة مع المدود\u003cspan class=\"e\">Write the three syllable types with long vowels\u003c/span>\u003c/li>\n\u003cli>سجّل صوتك مقارنًا بين الحركة القصيرة والطويلة 🎙\u003cspan class=\"e\">Record yourself comparing short and long vowels\u003c/span>\u003c/li>\n\u003cli>اقرأ الكلمات الست\u003cspan class=\"e\">Read the six words\u003c/span>\u003c/li>\n\u003cli>راجع الحروف الهجائية كاملة\u003cspan class=\"e\">Review the whole alphabet\u003c/span>\u003c/li>\u003c/ul>\u003c/section>\n\n\u003csection class=\"s5\">\u003ch2>\u003ci>✔\u003c/i>\u003cspan>اختبر نفسك\u003cspan class=\"e\">Mastery Checklist\u003c/span>\u003c/span>\u003c/h2>\n\u003cp>اضغط لتحديد ما تستطيع فعله:\u003cspan class=\"e\">Tap to tick what you can do:\u003c/span>\u003c/p>\u003cdiv class=\"chk\">\u003cnoscript>\u003cul>\u003cli>☐ \u003cb>الفهم:\u003c/b> أفهم الفرق بين القصير والطويل\u003cspan class=\"e\">I understand short vs. long vowels\u003c/span>\u003c/li>\u003cli>☐ \u003cb>التعرف:\u003c/b> أعرف حروف المد الثلاثة\u003cspan class=\"e\">I know the three long-vowel letters\u003c/span>\u003c/li>\u003cli>☐ \u003cb>القاعدة:\u003c/b> أحفظ: فتحة ← ألف، ضمة ← واو، كسرة ← ياء\u003cspan class=\"e\">I know: fatha→alif, damma→waw, kasra→yaa\u003c/span>\u003c/li>\u003cli>☐ \u003cb>القراءة:\u003c/b> أقرأ المقاطع والكلمات التي فيها مد\u003cspan class=\"e\">I read syllables and words with long vowels\u003c/span>\u003c/li>\u003cli>☐ \u003cb>التمييز:\u003c/b> أميّز بين القصير والطويل عند السماع\u003cspan class=\"e\">I tell short from long by ear\u003c/span>\u003c/li>\u003c/ul>\u003c/noscript>\u003c/div>\u003c/section>\n\u003c/main>\n\u003cfooter>أحسنت! 🌟 صرتَ تقرأ الصوت القصير والطويل، وهذه خطوة كبيرة نحو القراءة.\u003c/footer>\n\u003cscript>function mk(id,D){var el=document.getElementById(id);D.forEach(function(q,i){var d=document.createElement(\"div\");d.className=\"q\";var p=document.createElement(\"p\");p.className=\"ar\";p.style.fontSize=\"1.2rem\";p.textContent=(i+1)+\". \"+q[0];d.appendChild(p);var o=document.createElement(\"div\");o.className=\"opts\";var fb=document.createElement(\"div\");fb.className=\"fb\";\nq[1].forEach(function(t,j){var b=document.createElement(\"button\");b.className=\"opt ar\";b.textContent=t;b.onclick=function(){if(d.dataset.d)return;d.dataset.d=1;b.classList.add(j==q[2]?\"ok\":\"no\");if(j==q[2]){fb.textContent=\"✅ أحسنت!\"}else{fb.textContent=\"❌ الصحيح: \"+q[1][q[2]];o.children[q[2]].classList.add(\"ok\")}};o.appendChild(b)});d.appendChild(o);d.appendChild(fb);el.appendChild(d)})}\nmk(\"mc\",[[\"ما حرف المد الذي يأتي بعد الفتحة؟\",[\"الألف\",\"الواو\",\"الياء\"],0],[\"ما المقطع الذي يحتوي على مد بالواو؟\",[\"بَا\",\"بُو\",\"بِي\"],1],[\"أي حركة تسبق الياء في المد؟\",[\"الفتحة\",\"الضمة\",\"الكسرة\"],2],[\"أي كلمة تحتوي على مد بالألف؟\",[\"نُور\",\"بَاب\",\"فِيل\"],1],[\"أي كلمة تحتوي على مد بالياء؟\",[\"سُوق\",\"مَاء\",\"فِيل\"],2]]);\nvar S=[\"قصير\",\"طويل\"];mk(\"sl\",[[\"بَ\",S,0],[\"بُو\",S,1],[\"تِ ius:14px;padding:12px 14px;margin:12px 0}\n.note{background:var(--y1);border-inline-start:6px solid #f59e0b}\n.tip{background:var(--gr);border-inline-start:6px solid var(--g1)}\n.box b{display:block;margin-bottom:2px}\n.dlg{display:flex;flex-direction:column;gap:10px;margin:12px 0}\n.m{max-width:88%;padding:10px 14px;border-radius:18px}\n.m small{display:block;direction:ltr;text-align:left;color:var(--mut);font-size:.82rem;line-height:1.4}\n.a{background:var(--bl);align-self:flex-start;border:2px solid var(--b1)}\n.l{background:var(--or);align-self:flex-end;border:2px solid var(--o1)}\n.who{font-weight:800;font-size:.85rem}\n.a .who{color:var(--b1)}.l .who{color:var(--o1)}\n.pron{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}\n.pron div{border-radius:16px;padding:14px;text-align:center;font-weight:700}\n.pron .ar{font-size:2rem;display:block}\n.pron div:nth-child(1){background:var(--bl)}.pron div:nth-child(2){background:var(--gr)}.pron div:nth-child(3){background:var(--pu)}\n.chips{display:flex;flex-wrap:wrap;gap:8px}\n.chips span{background:var(--pu);border-radius:99px;padding:4px 16px}\n.q{border:2px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}\n.q p{margin:0 0 8px;font-weight:700}\n.opts{display:flex;flex-wrap:wrap;gap:8px}\nbutton,select{font:inherit;color:var(--ink)}\n.opt{background:var(--bl);border:2px solid transparent;border-radius:12px;padding:6px 16px;cursor:pointer}\n.opt.ok{background:var(--g1);color:#fff}.opt.no{background:var(--r1);color:#fff}\n.fb{margin-top:6px;font-weight:700;min-height:1.4em}\n.btn{background:linear-gradient(135deg,var(--p1),var(--b1));color:#fff;border:0;border-radius:14px;padding:10px 22px;font-weight:800;cursor:pointer}\n.fill{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0}\nselect{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:4px 8px}\n.speak li{margin:6px 0;font-weight:700}\n.score{font-size:1.2rem;font-weight:800;text-
